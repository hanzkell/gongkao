/* The same navigation tree is docked on the left or placed in the mobile drawer. */
.tocLayout {display:grid;grid-template-columns:clamp(205px,23%,278px) minmax(0,1fr);column-gap:clamp(24px,3.8vw,54px);align-items:start;}

  #drawerSlot .tocTree a,#drawerSlot .tocTree button,#drawerSlot .tocTree summary {min-height:43px;}
  .practiceHead {padding-top:16px;}
}

节奏与时间分配\u003c/strong>\u003csmall class=\"strategyScope\">国考与江苏省考 · 限时作答\u003c/small>\u003cspan>用行测共用材料题定位拖慢整组的具体步骤，用申论小题收笔与作文起笔两个节点校准整卷时间。\u003c/span>\u003c/a>\u003ca class=\"strategyRow\" href=\"#strategy/prep/review\" data-route=\"strategy/prep/review\">\u003cstrong>错因拆解与换题复测\u003c/strong>\u003csmall class=\"strategyScope\">行测与申论 · 模拟复盘\u003c/small>\u003cspan>把笼统的“算错、漏点、写空”拆解到出错步骤，再用同类型陌生真题验证改法是否生效。\u003c/span>\u003c/a>\u003c/section>\u003c/article>\u003c/div>"}},"tabs":["skills/shenlun","index/topic","strategy/themes","index/event"],"strategy":"strategy/prep"}</script>

<script>(() => {
 'use strict';
 const $=id=>document.getElementById(id), notice=$('pageNotice'), reload=notice.querySelector('button');
 const pending=new Map(), cache=new Map(), legacy=new Set();
 const revision='bac9ef071e37f759';
 const {homes,tabs:tabQueue,strategy}=JSON.parse($('moduleHomes').textContent);
 $('moduleHomes').remove();
 const modulePages=new Set([...Object.keys(homes),...tabQueue]);
 let current,currentView,activeKey,generation=0,waiting=false,fullAt='',pendingPicker,warming=false;
 window.kbParts={};
 window.kbPageData={};
 const vars={graph:'kbGraph',books:'kbBooks',originals:'kbOriginals',library:'kbLibrary',
  'question-figures':'kbQuestionFigures','question-stems':'kbStems','study-app':'kbStartStudy'};
 function status(message,retry){
  if($('studySplash')){
   $('launchStatus').textContent=message||'正在准备学习目录…';
   const button=$('launchRetry');button.hidden=!retry;button.onclick=retry||null;
   return;
  }
  notice.hidden=!message;notice.querySelector('span').textContent=message;
  reload.hidden=!retry;reload.onclick=retry||null;
 }
 function scriptData(name,url,priority){
  return new Promise((resolve,reject)=>{
   const script=document.createElement('script');script.src=url;script.fetchPriority=priority;
   const timer=setTimeout(()=>finish(false),30000);
   function finish(ok){
    clearTimeout(timer);script.onload=script.onerror=null;script.remove();
    const part=name.startsWith('parts/')?window.kbParts[name.slice(6)]:window.kbPageData[name];
    const value=part||window[vars[name]];
    if(!ok||!value){reject(Error(name));return;}
    if(part){delete window.kbPageData[name];delete window.kbParts[name.slice(6)];}
    resolve(value);
   }
   script.onload=()=>finish(true);script.onerror=()=>finish(false);document.head.append(script);
  });
 }
 async function readData(name,url,priority,signal){
  const controller=new AbortController(),cancel=()=>controller.abort();
  const timer=setTimeout(cancel,30000);
  signal?.addEventListener('abort',cancel,{once:true});
  try{
   if(signal?.aborted)cancel();
   const response=await fetch(url,{priority,signal:controller.signal});
   if(!response.ok)throw Object.assign(Error(name),{status:response.status});
   const body=await response.text(),prefix='window.kbPageData['+JSON.stringify(name)+'] = ';
   if(!body.startsWith(prefix)||!body.endsWith(';\n'))throw Error(name);
   return JSON.parse(body.slice(prefix.length,-2));
  }finally{clearTimeout(timer);signal?.removeEventListener('abort',cancel);}
 }
 function asset(name,priority='auto',signal){
  if(name.startsWith('views/')&&Object.hasOwn(homes,name.slice(6)))return Promise.resolve(homes[name.slice(6)]);
  if(cache.has(name))return Promise.resolve(cache.get(name));
  if(pending.has(name)){
   const existing=pending.get(name);
   if(!signal)return existing.catch(error=>{
    if(error.name==='AbortError')return asset(name,priority);throw error;
   });
   return existing;
  }
  const immutable=/^(cards|materials)\//.test(name);
  const version=immutable?'':'?v='+revision;
  const url='assets/'+name.split('/').map(encodeURIComponent).join('/')+'.js'+version;
  const partial=immutable||name.startsWith('views/')||name.startsWith('jumps/');
  const request=partial && location.protocol!=='file:'?readData(name,url,priority,signal):scriptData(name,url,priority);
  const promise=request.then(value=>{
   if(partial && cache.size>=72){
    const oldest=[...cache.keys()].find(k=>/^(views|cards|materials)\//.test(k));
    if(oldest)cache.delete(oldest);
   }
   cache.set(name,value);return value;
  }).finally(()=>pending.delete(name));
  pending.set(name,promise);return promise;
 }
 function address(raw){
  let p;
  try{p=decodeURIComponent(raw.split('?')[0]);}catch{return '';}
  if(!p||p==='content')return 'index/class';
  if(p==='skills'||p==='browse-s')return 'skills/xingce';
  if(p==='strategy')return strategy;
  return p;
 }
 function destination(raw){
  const key=address(raw);
  if(key.startsWith('skills/')||key.startsWith('index/')){
   const [area,kind,pick='',section='']=key.split('/');
   return {route:area+'/'+kind,pick,section,...(kind==='event'&&/^\d{4}$/.test(pick)?{year:pick}:{})};
  }
  if(key.startsWith('practice/')||key.startsWith('entry/')){
   const q=new URLSearchParams(raw.split('?')[1]).get('qid');
   return q?{route:key,question:q,scrollQuestion:true}:{route:key};
  }
  if(/^(search|library)(?:\?|$)/.test(raw))return {route:'library',filters:Object.fromEntries(new URLSearchParams(raw.split('?')[1]))};
  return key==='about'||key.startsWith('sources/')||key==='strategy'||key.startsWith('strategy/')?{route:key}:null;
 }
 function routeKey(){
  const raw=location.hash.slice(1),key=address(raw);
  if(fullAt===key||legacy.has(key))return 'full';
  if(!/^(skills\/(xingce|shenlun)(\/|$)|index\/(class|event|topic)(\/|$)|(?:practice|strategy)\/[\w-]+(\/[\w-]+)?$|entry\/[\w-]+$)/.test(key) ||
     key.split('/').some(s=>!s||s==='.'||s==='..'||s.includes('\\')))return 'full';
  const d=destination(raw),s=history.state;
  const page=/^(skills|index)\//.test(key)&&s?.route===d?.route && (s.pick||'')===(d.pick||'') && (s.section||'')===(d.section||'')?s.page:1;
  return key+(Number.isSafeInteger(page)&&page>1?'~'+page:'');
 }
 async function warmTabs(){
  const connection=navigator.connection;
  if(warming||connection?.saveData||/2g/.test(connection?.effectiveType||''))return;
  warming=true;
  try{
   while(tabQueue.length && modulePages.has(activeKey) && !waiting && !document.hidden){
    const key=tabQueue.shift();
    try{await asset('views/'+key,'low');}catch{/* Selecting the tab will retry. */}
   }
  }finally{warming=false;}
 }
 function ready(){
  const splash=$('studySplash');
  if(!splash){warmTabs();return;}
  const seq=generation,reader=$('entryDialog').open;
  const outlet=$(reader?'entryBody':'content');
  const text='考公突击'+Array.from(outlet.querySelectorAll('h1,h2,h3'),el=>el.textContent).join('');
  function reveal(){
   clearTimeout(deadline);
   if(seq!==generation||!splash.isConnected)return;
   document.documentElement.removeAttribute('data-launching');
   $('studyShell').removeAttribute('inert');splash.remove();
   if(reader)$('closeEntry').focus({preventScroll:true});
   warmTabs();
  }
  // Broken or blocked fonts must still let the user enter a readable, working page.
  const deadline=setTimeout(reveal,1500);
  if(document.fonts)document.fonts.load('400 24px "Huiwen ZhengKai"',text).then(reveal,reveal);
  else reveal();
 }
 function makeGraph(v){
  const nodes={...v.terms},qs={...v.questions};
  if(v.node)nodes[v.node.id]=v.node;
  return {nodes,qs,mats:{},missing:{},catalog:{},reviewSources:v.references||{},redirects:{},
   training:{行测:[],申论:[]},strategies:{groups:[]},study:{topics:v.topics||[],events:[],questionUnits:v.units||{}},
   wording:{groups:[],sources:v.sources||{}},practiceSyllabus:{modules:{},skills:{}},parts:{papers:{},entries:{}}};
 }
 function manualFor(key){
  try{
   const edges=JSON.parse(localStorage.getItem('gongkao.knowledge-training.v1')||'{}').manual||[];
   return edges.some(e=>key.endsWith('/'+e.n)||key==='index/class/all');
  }catch{return false;}
 }
 async function open(){
  const name=address(location.hash.slice(1));
  if(fullAt && fullAt!==name)fullAt='';
  if(manualFor(name))fullAt=name;
  const key=routeKey();
  const raw=location.hash.slice(1);
  if(raw.startsWith('question=') && !legacy.has(raw)){
   let id;try{id=decodeURIComponent(raw.slice(9));}catch{}
   const at=id?.lastIndexOf('#')??-1;
   if(at>0 && !/[\\/]/.test(id)){
    const seq=++generation;waiting=true;status('正在读取题目…');
    try{
     const map=await asset('jumps/'+id.slice(0,at),'high');
     if(seq!==generation)return;
     const target=map[id];
     if(target){history.replaceState(null,'','#'+(target==='library'?'search':target)+'?qid='+encodeURIComponent(id));return open();}
    }catch(error){if(seq!==generation)return;if(error.status && error.status!==404){waiting=false;status('题目读取失败。',open);return;}}
   }
   legacy.add(raw);
  }
  if(current && activeKey===key){generation++;waiting=false;current.render();return;}
  const seq=++generation;waiting=true;current?.cancelPreview();
  status(modulePages.has(key)?'正在准备学习目录…':'正在读取所选页面…');
  try{
   const app=asset('study-app','high');app.catch(()=>{});
   let view,graph,books=[],originals=[],art={questions:{},materials:{}};
   if(key==='full'){
    [graph,books,originals]=await Promise.all(['graph','books','originals'].map(n=>asset(n)));
   }else{
    try{view=await asset('views/'+key,'high');}catch(error){
     // 旧书签交给原路由解析。已登记页面的网络故障留在原处重试。
     if(name.startsWith('entry/')||name.startsWith('practice/s-')||name.startsWith('skills/')||name.startsWith('strategy/')) {
      const aliases=await asset('routes');
      if(aliases[name]){if(seq===generation){history.replaceState(null,'','#'+aliases[name]);return open();}}
     }
     if(error.status===404||location.protocol==='file:'){legacy.add(name);if(seq===generation)return open();}
     throw error;
    }
    graph=makeGraph(view);
   }
   const start=await app;if(seq!==generation)return;
   current?.dispose();current=null;
   if(!currentView && !$('content').firstElementChild && view?.key.startsWith('entry/'))$('content').innerHTML=homes['index/class'].html;
   window.kbGraph=graph;window.kbOriginals=originals;window.kbBooks=books;
   window.kbQuestionFigures=key==='full'&&cache.has('question-figures')?cache.get('question-figures'):art;
   activeKey=key;currentView=view;waiting=false;status('');
   current=start(view||null);
   if(pendingPicker){const [kind,id]=pendingPicker;pendingPicker=null;current.picker(kind,id);}
  }catch(error){if(seq===generation){waiting=false;status('页面资料读取失败。',open);}}
 }
 window.studyPages={asset,remember:(name,value)=>cache.set(name,value),status,address,destination,open,ready,pending:()=>waiting,owns:v=>routeKey()===activeKey&&(!v||v===currentView),
  fullPicker(kind,id){pendingPicker=[kind,id];fullAt=address(location.hash.slice(1));open();}};
 const search=$('globalSearch');
 const compact=matchMedia('(max-width:880px)'),tools=document.querySelector('.headerTools');
 function place(){(compact.matches?$('mobileTools'):search.parentElement).append(tools);}
 place();compact.addEventListener('change',place);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden && !$('studySplash'))warmTabs();});
 let lastUrl='',lastState;
 function moved(){if(lastUrl===location.href&&lastState===history.state)return;lastUrl=location.href;lastState=history.state;open();}
 window.addEventListener('popstate',moved);window.addEventListener('hashchange',moved);
 open();
})();
</script>
