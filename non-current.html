answer":{"text":"123. 正确答案：B\n解析：\n\n根据题干“2021年······占当年······的”，结合材料给出2021年相关数据，可判定本题为现期比重问题。定位图1可得：\n2021年，我国木材进口量为1892万吨。定位图2可得：2021年，我国松木、冷杉、针叶木材进口量分别为575万吨、\n432万吨、209万吨。根据公式：比重            ，则松木、冷杉和针叶木材进口量之和占当年我国木材进口总量的比重\n\n                            ，在B项范围内。\n\n故正确答案为B。\n【考点】\n统计图,现期比重","source":{"doc":"f3ab652d8e31c5bbdabc","first":39,"last":40,"file":"f3ab652d8e31c5bbdabc.pdf","page":39}}},"国考 2023 副省级 行测#128":{"label":"国考 2023 副省级 行测 · 第 128 题","origin":"真题","paper":"国考 2023 副省级 行测","stem":"128. 2019年，中国第三方超算服务市场规模约占同年超算服务总体市场规模的：\n","options":[["A","15%"],["B","18%"],["C","21%"],["D","24%"]],"key":"A","source":{"doc":"503793642e845de9795f","first":27,"last":27,"file":"503793642e845de9795f.pdf","page":27},"materials":[{"label":"题组5","text":"（三）\n\n     超级计算，也被称为高性能计算。从算力资源的需求看，高性能计算可以分为尖端超算、通用超算、业务超算\n和人工智能超算四大类。","source":{"doc":"503793642e845de9795f","first":26,"last":26,"file":"503793642e845de9795f.pdf","page":26}}],"answer":{"text":"128. 正确答案：A\n解析：\n根据题干“2019年······占同年······”，结合材料时间为2019年，可判定本题为现期比重问题。定位统计表可得2019年\n中国尖端超算、通用超算、业务超算和人工智能超算的市场规模；定位统计图可得2019年中国第三方独立超算服务\n商和互联网超算服务商的市场规模。则所求比重\n\n                ，与A项最接近。\n\n故正确答案为A。\n【考点】\n综合资料,现期比重","source":{"doc":"ecade1ff5af69283232e","first":40,"last":40,"file":"ecade1ff5af69283232e.pdf","page":40}}},"国考 2024 行政执法 行测#129":{"label":"国考 2024 行政执法 行测 · 第 129 题","origin":"真题","paper":"国考 2024 行政执法 行测","stem":"129. 已知2022年1~11月我国高新技术产品进出口总额约为14544亿美元，则同期我国工业机器人设备累计进出口总\n额约占高新技术产品累计进出口总额的：\n","options":[["A","0.2%"],["B","0.5%"],["C","1.0%"],["D","1.6%"]],"key":"A","source":{"doc":"dfddc59dc6e7d9da5d71","first":26,"last":26,"file":"dfddc59dc6e7d9da5d71.pdf","page":26},"materials":[{"label":"题组5","text":"（四）\n\n       2023年3月，全国规模以上工业企业的工业机器人完成产量4.4万套，服务机器人完成产量70万套。2023年1~3\n月全国规模以上工业企业的工业机器人累计完成产量10.4万套，服务机器人累计完成产量145万套。\n       2023年3月，我国机器人设备出口金额0.7亿美元，较上年增长110.3%，进口金额2.4亿美元，较上年增长\n68.5%。2023年1~3月我国机器人设备累计出口金额1.9亿美元，较上年增长62.1%，累计进口金额6.9亿美元，较上\n年增长55.1%。\n       2022年12月，全国规模以上工业企业的工业机器人完成产量4万套，服务机器人完成产量49.1万套。2022年\n1~12月全国规模以上工业企业的工业机器人累计完成产量44.3万套，服务机器人累计完成产量645.8万套。\n       2022年12月，我国工业机器人设备出口金额0.5亿美元，进口金额1.8亿美元。2022年1~12月我国工业机器人设\n备累计出口金额6.1亿美元，累计进口金额20亿美元。","source":{"doc":"dfddc59dc6e7d9da5d71","first":26,"last":26,"file":"dfddc59dc6e7d9da5d71.pdf","page":26}}],"answer":{"text":"129. 正确答案：A\n解析：\n根据题干“已知2022年1~11月······占······”，可判定本题为现期比重问题。定位文字材料第四段可得：2022年12月，\n我国工业机器人设备出口金额0.5亿美元，进口金额1.8亿美元；2022年1~12月我国工业机器人设备累计出口金额6.1\n亿美元，累计进口金额20亿美元。则2022年1~11月我国工业机器人设备累计进出口总额为（6.1+20）-（0.5+1.8）\n\n=23.8亿美元，根据公式：比重           ，则2022年1~11月我国工业机器人设备累计进出口总额占高新技术产品累计\n\n进出口总额的比重                       ，与A项最接近。\n\n故正确答案为A。\n【考点】\n文字资料,现期比重","source":{"doc":"6493f3a6a55c38431852","first":42,"last":42,"file":"6493f3a6a55c38431852.pdf","page":42}}},"国考 2023 地市级 行测#64":{"label":"国考 2023 地市级 行测 · 第 64 题","origin":"真题","paper":"国考 2023 地市级 行测","stem":"64. 甲和乙两个工程队共同承担某项工程的施工任务。两队合作时各自的效率均比单独施工时高20%。已知两队合作\n施工需要25天完工；如甲先施工15天后乙加入，两队合作15天后剩余工作乙单独施工还需要10天完成。问甲队的效\n率是乙队的多少倍？\n","options":[["A",""],["B",""],["C",""],["D",""]],"key":"D","source":{"doc":"64bc3a15d27a04e94940","first":11,"last":11,"file":"64bc3a15d27a04e94940.pdf","page":11},"materials":[],"answer":{"text":"64. 正确答案：D\n解析：\n设甲队和乙队单独施工时的效率分别为x、y，根据题意可知：甲队和乙队合作施工时的效率分别为1.2x、1.2y。根据\n工程总量相等，则（1.2x+1.2y）×25=15x+（1.2x+1.2y）×15+10y，解得      ，即甲队的效率是乙队的   。\n\n故正确答案为D。\n【考点】\n工程问题-其他","source":{"doc":"f3ab652d8e31c5bbdabc","first":20,"last":20,"file":"f3ab652d8e31c5bbdabc.pdf","page":20}}},"国考 2024 副省级 行测#72":{"label":"国考 2024 副省级 行测 · 第 72 题","origin":"真题","paper":"国考 2024 副省级 行测","stem":"72. 某工程队接到一项任务，甲、乙合作6天后完成总任务量的25%，乙、丙合作15天后又完成剩余任务量的   ，剩\n\n下全部任务由乙单独工作11天完成。已知乙与他人合作时效率比其单独工作时高10%，问甲、乙、丙合作完成这项\n任务需要多少天？\n","options":[["A","16"],["B","20"],["C","24"],["D","28"]],"key":"B","source":{"doc":"a566fec37e508ca7f975","first":13,"last":14,"file":"a566fec37e508ca7f975.pdf","page":13},"materials":[],"answer":{"text":"72. 正确答案：B\n解析：\n由于“乙与他人合作时效率比其单独工作时高10%”，即乙与他人合作时效率为（1+10%）乙=1.1乙，根据题意则有：\n                  ······①；                                 ······②；\n\n                             ······③。联立①③可得15甲=11乙，赋值甲的效率为11，乙的效率为\n\n15，则工作总量=11×15×4=660，则                    ，所求时间\n\n天。\n故正确答案为B。\n【考点】\n给效率比例型,赋值法","source":{"doc":"a475ecf57d968bc14cd6","first":22,"last":22,"file":"a475ecf57d968bc14cd6.pdf","page":22}}},"江苏 2024 B类 行测#61":{"label":"江苏 2024 B类 行测 · 第 61 题","origin":"真题","paper":"江苏 2024 B类 行测","stem":"61. 一项工程由甲、乙、丙三个工程队合作完成，他们的工作效率之比为5：6：4。已知甲、乙合作需60天完成，现\n两人合作若干天后，剩余工程由丙单独完成，共用74天，则甲、乙合作的天数是：\n","options":[["A","52"],["B","53"],["C","54"],["D","55"]],"key":"A","source":{"doc":"0ae7ac475476e5635bd7","first":10,"last":10,"file":"0ae7ac475476e5635bd7.pdf","page":10},"materials":[],"answer":{"text":"61. 正确答案：A\n解析：\n根据题意，赋值甲、乙、丙三个工程队的工作效率分别为5、6、4，已知甲、乙合作需60天完成，则工作总量为60×\n（5+6）=660。设现甲、乙两人合作x天，则剩余工程由丙单独完成需要（74-x）天，可得：\n                 ，解得：x=52，即甲、乙合作的天数为52天。\n故正确答案为A。\n【考点】\n给效率比例型,赋值法","source":{"doc":"8dd171daee6fc74e9718","first":19,"last":19,"file":"8dd171daee6fc74e9718.pdf","page":19}}},"江苏 2023 A类 行测#61":{"label":"江苏 2023 A类 行测 · 第 61 题","origin":"真题","paper":"江苏 2023 A类 行测","stem":"61. 甲、乙两个工程队合作完成一项工程，甲每工作3天休息1天，乙每工作5天休息2天。若甲先工作，2天后乙加\n入，则再用21天完工；若乙先工作，12天后甲加入，则再用15天完工。甲单独完成该项工程需要的天数是（      ）。\n","options":[["A","43"],["B","44"],["C","47"],["D","48"]],"key":"C","source":{"doc":"22304fe4c340e19d7902","first":11,"last":11,"file":"22304fe4c340e19d7902.pdf","page":11},"materials":[],"answer":{"text":"61. 正确答案：C\n解析：\n第一种情况：甲工程队从开始到完工共经过2+21=23天，23÷（3+1）=5⋯⋯3，即5个周期还余3天，共工作了\n5×3+3=18天；乙工程队共经过21天，21÷（5+2）=3，即3个周期，共工作了3×5=15天。\n第二种情况：乙工程队从开始到完工共经过12+15=27天，27÷（5+2）=3⋯⋯6，即3个周期还余6天，共工作了\n3×5+5=20天；甲工程队共经过15天，15÷（3+1）=3⋯⋯3，即3个周期还余3天，共工作了3×3+3=12天。\n则根据题意可列式：18甲+15乙=12甲+20乙，整理可得：      ，赋值甲的效率为5，则乙的效率为6。则工作总量\n\n为18×5+15×6=180，甲单独完成该项工程需要工作的天数为180÷5=36天，36÷3=12，即需要11个周期再工作3天，\n所以共需11×（3+1）+3=47天。\n故正确答案为C。\n【考点】\n工程问题-其他","source":{"doc":"be17f9afe070cf13a0fb","first":18,"last":18,"file":"be17f9afe070cf13a0fb.pdf","page":18}}},"江苏 2023 A类 行测#100":{"label":"江苏 2023 A类 行测 · 第 100 题","origin":"真题","paper":"江苏 2023 A类 行测","stem":"100. 北方某市有甲、乙两条十字交叉的马路，每年冬季都有成群的乌鸦聚集于甲路边的树上，但乙路边的树上基本\n没有乌鸦。有鸟类爱好者发现，甲路两旁的杨树要比乙路多数倍。据此，该鸟类爱好者断言，乌鸦更喜欢停留在杨\n树多的地方过冬。\n以下哪项如果为真，最能削弱上述鸟类爱好者的断言？\n","options":[["A","在夏秋之交，甲、乙两条路旁的树上都会聚集大量的乌鸦"],["B","近二十年来该市特别重视道路绿化，为鸟类提供了良好的栖息环境"],["C","乙路是南北方向，凛冽的北风长驱直入，而甲路旁边的建筑能有效阻挡北风"],["D","该市有一条与甲路平行的路，杨树的数量与乙路差不多，但冬季几乎没有乌鸦"]],"key":"C","source":{"doc":"22304fe4c340e19d7902","first":21,"last":21,"file":"22304fe4c340e19d7902.pdf","page":21},"materials":[],"answer":{"text":"100. 正确答案：C\n解析：\n第一步：找出论点和论据。\n\n论点：乌鸦更喜欢停留在杨树多的地方过冬。\n论据：北方某市有甲、乙两条十字交叉的马路，每年冬季都有成群的乌鸦聚集于甲路边的树上，但乙路边的树上基\n本没有乌鸦。有鸟类爱好者发现，甲路两旁的杨树要比乙路多数倍。\n本题论点和论据都在讨论乌鸦更喜欢在杨树多的地方过冬，二者话题一致，削弱优先考虑削弱论点。且本题的论证\n过程可理解为：依据每年冬季乌鸦都成群聚集于杨树更多的甲路边的树上，得出乌鸦更喜欢停留在杨树多的地方过\n冬的论点，隐含因果关系，还可以考虑他因削弱。\n第二步：逐一分析选项。\nA项：选项说的是夏秋之交，甲、乙两条路旁树上的乌鸦聚集情况，而题干讨论的是乌鸦在冬季的聚集情况，话题不\n一致，为无关项，无法削弱，排除；\nB项：选项说的是近二十年来该市特别重视道路绿化，与乌鸦是否更喜欢停留在杨树多的地方过冬无关，无法削弱，\n排除；\nC项：选项说的是凛冽的北风能长驱直入乙路，而甲路旁边的建筑能有效阻挡北风，说明冬季乌鸦聚集于甲路旁边的\n树上不一定是因为甲路边杨树更多，也可能是因为甲路旁边的建筑更能避风，他因削弱，当选；\nD项：选项说的是另一条与甲路平行的路，杨树的数量与乙路差不多，但冬季几乎没有乌鸦，说明在道路朝向相同的\n情况下，乌鸦依旧更喜欢停留在杨树多的地方过冬，排除了道路朝向对乌鸦的影响，为加强项，无法削弱，排除。\n故正确答案为C。\n【考点】\n他因削弱,对比实验起点不一致","source":{"doc":"be17f9afe070cf13a0fb","first":30,"last":31,"file":"be17f9afe070cf13a0fb.pdf","page":30}}},"国考 2025 行政执法 行测#105":{"label":"国考 2025 行政执法 行测 · 第 105 题","origin":"真题","paper":"国考 2025 行政执法 行测","stem":"105. 某桃园5月份对其种植的蟠桃进行套袋。6月份，桃果出现异常，50克左右的大果很少；10余克的小果特别多，\n约占75%。正常情况下，此时果实应重50克左右。有人推测，今年出现小果占比过大是由于套袋较早造成的，因为\n过早套袋会使果实失去营养竞争力，在营养供应不足的情况下，果实竞争不过新梢。\n以下哪项如果为真，最能削弱上述推测？\n\n","options":[["A","今年套果袋时果实大小基本一致，并且期间无病虫危害"],["B","纸袋的遮光作用影响果实光合能力，进而影响甜度"],["C","今年在没有分出大小果时就完成了疏除冗余幼果的操作，留下的不一定是优质大果"],["D","今年桃树长得太快，加之萌芽肥、花后肥都没有追施，导致后期果实营养供应不足"]],"key":"D","source":{"doc":"d8efe4e19862104d89c8","first":20,"last":21,"file":"d8efe4e19862104d89c8.pdf","page":20},"materials":[],"answer":{"text":"105. 正确答案：D\n解析：\n第一步：找出论点和论据。\n论点：今年出现小果占比过大是由于套袋较早造成的。\n论据：过早套袋会使果实失去营养竞争力，在营养供应不足的情况下，果实竞争不过新梢。\n本题论据说的是过早套袋会使果实失去营养竞争力，进而导致果实竞争不过新梢，即小果占比大；论点是基于此得\n出的小果占比过大的原因是套袋较早，二者话题一致，削弱优先考虑否定论点，即小果占比过大不是由于套袋较早\n造成的。\n第二步：逐一分析选项。\nA项：该项指出今年套果袋时果实大小基本一致，并且期间无病虫危害，只能说明病虫危害不是导致小果占比过大的\n原因，但是否存在其他的原因导致小果占比过大不明确，为不明确项，无法削弱，排除；\nB项：该项指出纸袋的遮光作用影响果实光合能力，进而影响甜度，只能说明套袋影响甜度，而论点讨论的是小果占\n比过大的原因，话题不一致，无法削弱，排除；\n\nC项：该项指出今年在没有分出大小果时就完成了疏除冗余幼果的操作，留下的不一定是优质大果，说明小果占比过\n大可能是由于没有分出大小果时就完成了疏除冗余幼果的操作造成的，把优质大果去掉了，保留下小果，直接否定\n论点，可以削弱，保留；\nD项：该项指出今年桃树长得太快，加之萌芽肥、花后肥都没有追施，导致后期果实营养供应不足，说明果实营养供\n应不足是桃树长得太快，没有追肥造成的，进而导致小果占比过大，直接否定论点，可以削弱，保留。\n对比C、D两项，C项表述为“不一定”，为可能性削弱，D项为肯定性削弱，削弱力度更强，D项当选。\n故正确答案为D。\n【考点】\n削弱论点","source":{"doc":"e2c4b1970d2b49eac0fd","first":34,"last":35,"file":"e2c4b1970d2b49eac0fd.pdf","page":34}}},"国考 2024 行政执法 行测#103":{"label":"国考 2024 行政执法 行测 · 第 103 题","origin":"真题","paper":"国考 2024 行政执法 行测","stem":"103. W国对咖啡领域的调查显示，过去W国咖啡领域的融资金额高达5亿元，该国许多知名企业跨界进入咖啡领域，\n本土咖啡品牌在快速崛起。然而经过去年一年的销售发现，W国线下咖啡门店的总数量虽然有所增加，但咖啡销量\n与往年相比并未明显增加，因此有人认为：咖啡在W国居民中不是很受欢迎。\n以下哪项如果为真，最能削弱上述观点？\n","options":[["A","W国个别线下门店提供的速溶咖啡添加了植脂末、白砂糖等成分，摄入过多不利于身体健康"],["B","与一些咖啡销量高的国家相比，W国咖啡的单价过高，在一定程度上阻碍了消费欲望"],["C","W国的一些企业开始倾向咖啡液、速溶咖啡、袋泡咖啡等全品类进军"],["D","当前，W国的咖啡文化并不成熟，作为消费主体的年轻人喝咖啡也大多是赶潮流"]],"key":"B","source":{"doc":"dfddc59dc6e7d9da5d71","first":21,"last":21,"file":"dfddc59dc6e7d9da5d71.pdf","page":21},"materials":[],"answer":{"text":"103. 正确答案：B\n解析：\n第一步：找出论点和论据。\n论点：咖啡在W国居民中不是很受欢迎。\n\n论据：经过去年一年的销售发现，W国线下咖啡门店的总数量虽然有所增加，但咖啡销量与往年相比并未明显增\n加。\n本题论据描述了W国线下咖啡门店增加但销量并未增加的现象，论点是基于此得出的咖啡在W国不受欢迎，二者话题\n一致，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：选项指出W国“个别门店”的速溶咖啡添加的某些成分摄入过多对身体健康不利，只是“个别门店”，不确定对整\n体是否有影响，即使产生影响也是对咖啡在W国的受欢迎程度产生不利影响，无法削弱，排除；\nB项：选项指出W国线下咖啡门店增加但销量并未增加是因为咖啡单价过高，说明不是咖啡不受欢迎，而是咖啡太贵\n降低了居民的消费欲望，削弱论点，可以削弱，当选；\nC项：选项指出W国的一些企业“开始倾向”咖啡液等全品类咖啡产品，题干讨论的是“去年一年”的销量，时间不重\n叠，且未说明咖啡液等全品类咖啡产品是否在线下门店销售，无法削弱，排除；\nD项：选项指出W国的咖啡文化不成熟，消费主体喝咖啡大多是赶潮流，这对咖啡在W国的受欢迎程度有不利影响，\n具有加强作用，无法削弱，排除。\n故正确答案为B。\n【考点】\n削弱论点","source":{"doc":"6493f3a6a55c38431852","first":33,"last":34,"file":"6493f3a6a55c38431852.pdf","page":33}}},"国考 2023 副省级 行测#112":{"label":"国考 2023 副省级 行测 · 第 112 题","origin":"真题","paper":"国考 2023 副省级 行测","stem":"112. 近来，国际大宗商品市场中，原油和天然气价格达到近十年以来的高位，锌矿价格也上涨了7%左右，有分析人\n士认为，大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进\n入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也\n预示着当下全球经济正在复苏。\n以下哪项如果为真，最能削弱上述论证？\n","options":[["A","地缘政治的风险加剧了大宗商品供应的紧张局势，引发本轮大宗商品价格上涨"],["B","飙升的天然气价格推高了化肥的主要成分——氨的价格，进而推高全球粮食价格"],["C","全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，进而影响金属和原油产业的发展远景"],["D","全球主要经济体正在加紧出台强有力的救市计划，以寻求本国新的经济增长动力"]],"key":"A","source":{"doc":"503793642e845de9795f","first":22,"last":23,"file":"503793642e845de9795f.pdf","page":22},"materials":[],"answer":{"text":"112. 正确答案：A\n解析：\n第一步：找出论点和论据。\n论点：大宗商品市场将进入“超级周期”（大宗商品价格高于长期平均价格的时期）。从宏观层面看，大宗商品进\n入“超级周期”是全球经济出现新的增长动力的结果。历史上大宗商品进入“超级周期”往往会带动全球经济复苏，这也\n预示着当下全球经济正在复苏。\n论据：无。\n本题的论点的逻辑是“全球经济出现新的增长动力”导致大宗商品市场将进入“超级周期”，进而预示当下全球经济正在\n复苏，本题只有论点，没有论据，削弱优先考虑削弱论点。\n第二步：逐一分析选项。\nA项：论点的逻辑是“全球经济新的增长动力导致大宗商品价格上涨”，该项给出了导致“大宗商品价格上涨”的另一个\n原因，削弱论点，可以削弱，当选；\nB项：该项说的是天然气价格推高了氨的价格，进而推高全球粮食价格，只说明了部分商品之间的价格关联度，而论\n点讨论的是大宗商品价格高于平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nC项：该项说的是全球经济将更注重环保，碳中和与碳达峰将改变能源产业格局，而论点讨论的是大宗商品价格高于\n平均的原因以及产生的结果，话题不一致，无法削弱，排除；\nD项：该项说的是全球主要经济体为寻求本国新的经济增长动力而出台救市计划，而论点讨论的是大宗商品价格高于\n平均的原因以及产生的结果，话题不一致，无法削弱，排除。\n故正确答案为A。\n【考点】\n削弱论点","source":{"doc":"ecade1ff5af69283232e","first":36,"last":36,"file":"ecade1ff5af69283232e.pdf","page":36}}},"国考 2023 地市级 行测#46":{"label":"国考 2023 地市级 行测 · 第 46 题","origin":"真题","paper":"国考 2023 地市级 行测","stem":"46. 我国在改革开放后逐渐认识到保护民间文学艺术作品的重要性，并在1990年著作权法规定保护办法另行规定。但\n时隔三十余年，保护办法仍未出台。尽管如此，在著作权法颁布后，学界就民间文学艺术作品法律保护展开研究讨\n论，提出多种保护方案，涉及权利客体、权利主体、权利内容、保护期限、权利限制等方面的问题。当然，也有个\n\n别学者反对用著作权法保护民间文学艺术作品，主张通过公法加以保护。与此同时，国家版权局也加快推进相关立\n法，但因质疑声音过大而夭折。\n作者可能赞同下列哪一观点？\n","options":[["A","通过公法保护民间文学艺术作品是最可行的路径"],["B","围绕民间文学艺术作品法律保护的争议流于表面"],["C","国家版权局应就民间文学保护倾听多方面意见"],["D","民间文学艺术作品法律保护缺位状态亟须改变"]],"key":"D","source":{"doc":"64bc3a15d27a04e94940","first":7,"last":8,"file":"64bc3a15d27a04e94940.pdf","page":7},"materials":[],"answer":{"text":"46. 正确答案：D\n解析：\n文段开篇指出我国认识到保护民间文学艺术作品的重要性，并在著作权法中规定对保护办法另行规定。随后通\n过“但”表转折，指出当前民间文学艺术作品的保护办法仍然没有出台。接着介绍著作权法颁布后，学界针对民间文学\n艺术作品法律保护曾提出多种保护方案，涉及多方面问题，并指出个别学者主张通过公法加以保护。最后通过“与此\n同时”表示并列，介绍国家版权局也加快推进相关立法，但因受到强烈质疑而夭折。整个文段都是围绕民间文学艺术\n作品法律保护缺失这一问题展开论述，意在强调当前亟须出台民间文学艺术作品的保护法，对应D项。\nA项，“通过公法保护民间文学艺术作品”仅为个别学者的观点，“最可行”表述过于绝对，排除；\nB项，文段指出学界就民间文学艺术作品法律保护展开的研究讨论涉及多方面问题，“流于表面”与文意相悖，排除；\nC项，仅对应“与此同时”之后的内容，表述片面，且文段指出国家版权局的立法工作因受到质疑而夭折，并非没有“倾\n听多方面意见”，排除。\n故正确答案为D。\n【文段出处】《中国特色民间文学艺术作品著作权保护理论的构建》\n【考点】\n中心理解题-关联词-转折,中心理解题-特殊问法-其他","source":{"doc":"f3ab652d8e31c5bbdabc","first":15,"last":15,"file":"f3ab652d8e31c5bbdabc.pdf","page":15}}},"江苏 2024 A类 行测#23":{"label":"江苏 2024 A类 行测 · 第 23 题","origin":"真题","paper":"江苏 2024 A类 行测","stem":"23. 有人认为，知识本来是一个整体，学科拆散了它，跨学科便是将分散的知识重新整合，是对过度专业化的反对。\n不过，我们可能低估了跨学科的难度。使用几个不同学科的概念，或与其他学科的研究者合写一篇论文，把那些本\n无多少新意的内容转换成混杂多个学科术语的表述，并不是真正的跨学科研究。“跨学科”不同于“多学科”，后者指两\n个或两个以上学科的简单组合，例如由不同学科教师团队讲授的特定课程。在这种情况下，学科之间仅是一种相邻\n关系，并没有真正结合。\n这段文字意在说明：\n","options":[["A","跨学科需要对知识重新整合"],["B","跨学科需不同学科的交叉融合"],["C","多学科和跨学科存在着差异"],["D","当下对跨学科的认识存在误区"]],"key":"D","source":{"doc":"f8fec75f67d6d1ba5759","first":4,"last":4,"file":"f8fec75f67d6d1ba5759.pdf","page":4},"materials":[],"answer":{"text":"23. 正确答案：D\n解析：\n文段开篇提出某人的观点，即知识本来是一个整体，学科拆散了它，接着引出“跨学科”的话题，指出跨学科便是将分\n散的知识重新整合，随后通过转折词“不过”强调我们可能低估了跨学科的难度，然后通过使用不同学科的概念和与其\n他学科的研究者合写一篇论文都不是真正的跨学科研究、“跨学科”不同于“多学科”等内容进行具体解释说明。故文段\n意在强调我们当下对跨学科认识不足，低估了跨学科的难度，对应D项。\nA项：“对知识重新整合”属于转折词“不过”之前的内容，非重点，排除。\nB项：“需不同学科的交叉融合”文段未提及，无中生有，排除。\nC项：“存在着差异”属于后文解释说明的内容，非重点，排除。\n故正确答案为D。\n【文段出处】《文科人“跨学科”，一种修辞，一场苦修》\n【考点】\n中心理解题-关联词-转折,分述句特征-引入铺垫,分述句特征-其他","source":{"doc":"0126a1c8aceee632ea2b","first":8,"last":8,"file":"0126a1c8aceee632ea2b.pdf","page":8}}},"国考 2023 行政执法 行测#42":{"label":"国考 2023 行政执法 行测 · 第 42 题","origin":"真题","paper":"国考 2023 行政执法 行测","stem":"42. 在市场经济时期，劳动密集型制造工厂普遍采用流水线技术，工人被高度“去技能化”，几乎不需要技能便可完成\n装配操作，企业没有需求也没有动力去培养中高级技术工人。但是，当一个国家的产业结构向中高端迈进时，高水\n平职业教育的支撑作用就会显现出来。技术进步与人力资本相互影响、相互促进：企业引进的高端生产线，需要技\n术工人去操作和维护，否则技术改造和升级就无法实现；如果没有配套的职业技能培训体系，企业的转型升级就难\n以达到预期效果。\n这段文字意在说明：\n\n","options":[["A","产业结构转型升级需要职业教育的支撑"],["B","技术进步对人力资本提出了更高要求"],["C","“技工荒”会随产业结构升级更趋严重"],["D","职业技能培训需求与经济增长有相关性"]],"key":"A","source":{"doc":"857378cf496f27296500","first":6,"last":7,"file":"857378cf496f27296500.pdf","page":6},"materials":[],"answer":{"text":"42. 正确答案：A\n解析：\n文段开篇介绍了在市场经济时期，流水线上的工人几乎不需要技能便可完成装配操作，企业无需去培养中高级技术\n工人，随后通过转折词“但是”提出观点，即在产业结构向中高端升级时，高水平职业教育会起着支撑作用。尾句通过\n对技术进步和人力资本的双向作用进行阐述，进一步支撑论证了转折后的观点。故文段重点在转折之后，强调高水\n平职业教育对于产业结构升级的支撑作用，对应A项。\nB项，缺少主题词“职业教育”和“产业结构”，偏离文段核心话题，排除；\nC项，“技工荒”无中生有，且缺少主题词“职业教育”，偏离文段核心话题，排除；\nD项，“经济增长”偷换概念，文段重在强调职业教育对于产业结构升级的支撑作用，排除。\n故正确答案为A。\n【文段出处】《向上的阶梯——经济转型时期新技术工人的社会流动》\n【考点】\n中心理解题-关联词-转折,中心理解题-主题词,分述句特征-引入铺垫,分述句特征-其他","source":{"doc":"d23139fe5a0fb3115135","first":14,"last":14,"file":"d23139fe5a0fb3115135.pdf","page":14}}},"国考 2023 行政执法 行测#53":{"label":"国考 2023 行政执法 行测 · 第 53 题","origin":"真题","paper":"国考 2023 行政执法 行测","stem":"53. “高精尖”产业是辐射带动力强的产业集群，对经济具有极强的拉动作用，不仅能实现中心城市的经济高质量发\n展，而且能带动周边地区的产业联动转型。京津冀协同发展中，产业对接协作是区域战略的核心内容之一，产业升\n级是三地的共同任务，在疏解非首都核心功能的过程中，天津和河北是北京产业转移的主要承接者。然而，两地仅\n简单承接北京转移的一般产业是远远不够的，迫切需要发展“高精尖”产业，带动区域科技创新与成果转化，促进区域\n产业联动，形成经济协同发展的格局。\n这段文字意在说明：\n","options":[["A","“高精尖”产业承担着高水平创新的重大使命"],["B","形成“高精尖”产业是城市群建设的长远目标"],["C","我国区域经济发展应以“高精尖”产业为依托"],["D","“高精尖”产业对京津冀协同发展有重要意义"]],"key":"D","source":{"doc":"857378cf496f27296500","first":9,"last":9,"file":"857378cf496f27296500.pdf","page":9},"materials":[],"answer":{"text":"53. 正确答案：D\n解析：\n文段开篇引出话题“高精尖”产业，并指出其对经济的拉动作用，能够带动周边地区的产业联动转型，接着介绍了京津\n冀协同发展中的区域战略和任务，并指出天津和河北是北京产业转移的主要承接者，尾句通过关联词“然而”转折，指\n出两地仅简单承接北京转移的一般产业是远远不够的，接着通过“迫切需要”引出对策，强调要发展“高精尖”产业，以\n实现京津冀地区的协同发展。故文段重点强调尾句对策，即发展“高精尖”产业对实现京津冀地区协同发展的重要性，\n对应D项。\nA项，强调“高精尖”产业对高水平创新的重要性，缺少文段核心话题“京津冀协同发展”，排除；\nB项，“城市群建设的长远目标”文段并未提及，无中生有，且“城市群建设”范围扩大，文段重点讨论“京津冀”地区，排\n除；\nC项，强调我国应如何发展区域经济，文段讨论的话题是如何实现“京津冀”地区的协同发展，表述不够准确，排除。\n故正确答案为D。\n【文段出处】中国共产党新闻网《贾品荣：创新驱动“高精尖”产业发展》\n【考点】\n中心理解题-关联词-转折,中心理解题-关联词-对策,中心理解题-主题词,分述句特征-引入铺垫","source":{"doc":"d23139fe5a0fb3115135","first":17,"last":17,"file":"d23139fe5a0fb3115135.pdf","page":17}}},"江苏 2023 A类 申论#1":{"label":"江苏 2023 A类 申论 · 第 1 题","origin":"真题","paper":"江苏 2023 A类 申论","stem":"1. “给定资料1-4”中，一些地方和部门借鉴传统文化中的相关智慧赋能现代社会治理，在不同领域取得了显著成效，\n请用一段话对此进行归纳概括。（20分）\n要求：紧扣给定资料，全面、准确。篇幅不超过250字。","options":[],"key":"","source":{"doc":"7e42c077e9c847e9914a","first":4,"last":4,"file":"7e42c077e9c847e9914a.pdf","page":4},"materials":[{"label":"材料1","text":"材料1\n  “千里家书只为墙，让他三尺又何妨。万里长城今犹在，不见当年秦始皇。”这首“让墙诗”出自一段历史典故。清\n康熙年间，张英担任文华殿大学士兼礼部尚书。他老家的宅院与吴家为邻，两家院落之间有条巷子，供双方出入使\n用。吴家要建新房，想占这条路，张家人不同意。双方争执不下，将官司打到当地县衙。县官考虑到两家人都是名\n门望族，不敢轻易了断。张家人一气之下写了封加急信送给张英，要求他出面解决。张英看信后，认为应该谦让邻\n里，这首“让墙诗”就是他的回信。家人阅罢，主动让出三尺空地；吴家见状，深受感动，也主动让出三尺房基\n地，“六尺巷”由此得名。\n  “六尺巷”的佳话在中华大地流传甚广。新中国成立后，毛主席在会见苏联驻华大使尤金时，曾经用这四句诗来表\n达两国之间应该谦让、平等。在新时代的基层社会治理中，“六尺巷”的故事仍然散发着持久的魅力与芬芳。在H省D\n县龙门镇大山村活动广场的一面墙上，诗画结合的民间故事“六尺巷”十分醒目。当地党员干部从“六尺巷”故事中得到\n启发，不久前成功化解了一起村民之间的土地纠纷。该村倪姓、莫姓两户人家一直为了一块六分大的土地权属问题\n争执不下。老倪说，这是自家祖地；老莫则称，父辈早就买下了这块地。双方都无凭无据，又都互不相让。久而久\n之，这块位置不错的地，硬是被搁置成了杂草丛生的撂荒地。“为了一块地，邻里间的情分都吵没了。”乡里乡亲都看\n在眼里，无奈又惋惜。2022年9月，大山村启动人居环境改造工程。为了这块地的归属，两家人再起争执，僵持不\n下。这时，有驻村干部提出，古有“六尺巷”美谈，如今两家能否也各让一步，商量将地一同用起来呢？村干部多次分\n头上门，动之以情、晓之以理。“你们两家吵了这么多年，谁得到了好处？”“邻里关系僵了，名声坏了，乡亲们都绕\n着走。”“村里环境变好了，受益的还不是咱自己吗？你们的小账和村里的大账，其实都是一本账。”在大家的劝解\n下，两家人终于想通了。看到倪、莫两家摒弃前嫌，相邻地块的村民们也主动让出了一部分土地，村里借此建成了\n公共绿地。如今，焕然一新的绿地广场成了村民运动休闲的好去处。“六尺巷”美谈，在新时代续写出新的篇章。\n  “礼之用，和为贵。”在Q市小雪街道的“和为贵”调解室，墙上鲜红的行楷字格外醒目，经典名句的点缀，营造出\n和谐温馨的氛围。“这张照片是岳大爷和他邻居为一只猫咪的归属发生纠纷来这里调解，这个是张大爷因为砌墙跟邻\n居发生纠纷前来调解……”街道党工委书记老邢拿出资料册，细数着在“和为贵”调解室里的成功案例。“2013年调解室\n刚成立时，居民来得还比较多，每个月大概处理三四起，后来越来越少，直到现在，已经近半年没人来了。”邻里纠\n纷的减少反映的是民风的改善，“老祖宗传下来的好方法很多，只要能善于活学活用，现代社会治理大有可为。”老邢\n感慨地说。","source":{"doc":"7e42c077e9c847e9914a","first":1,"last":1,"file":"7e42c077e9c847e9914a.pdf","page":1}},{"label":"材料2","text":"材料2\n    河长制，听说过吧？新时代的河长，家喻户晓。那么，在我国几千年的历史长河中，曾经有过河长吗？在Z省S\n县水文博物馆里有六块石碑，碑上的文字告诉世人，“河长”官职古已有之：渠长，始见于唐代；堤长，始见于晚唐五\n代；湖长，始见于元代；坝长、河长……在古代，担任地方行政长官而兼任河长的官员不计其数，他们积极履职，\n为治水防汛抗洪做出了重要贡献。\n    唐宋八大家之一的苏轼就是古代众多“河长”中十分出色的一位。苏轼任杭州知州时发现，居民赖以饮水的“六\n井”近乎瘫痪。一番调查后发现，主要原因是西湖淤塞导致水源不足，于是苏轼便着手对西湖进行疏浚。针对西湖葑\n草横生、湖面萎缩的困局，苏轼结合当时稻田受灾、米价飞涨的实际，采取以工代赈的方式，招募饥民浚治西湖。\n并因势利导，利用葑草、淤泥等物，在湖中堆筑起一道便利南北通行的长堤，堤旁植垂柳，湖中种荷花，这便是今\n日著名的西湖“苏堤”。\n    新时代的“河长制”，由各级党政主要负责人担任“河长”，负责组织领导相应河湖的管护工作。2016年12月，中共\n中央办公厅、国务院办公厅印发了《关于全面推行河长制的意见》，要求各地区各部门结合实际认真贯彻落实。\n2017年元旦，主席在新年贺词中发出了“每条河流要有河长了”的号令。\n    河长一上岗，江河大变样。墩子河是流经J市B县梅林村的一条河流，村支书老陈担任村级河长。“每天出门我都\n先到河边走走看看。墩子河虽小，但通向长江，必须守好‘责任田’。”曾几何时，水质退化困扰村民。清淤泥、连水\n系、治污水，一套组合拳下来，河畅流、水碧清。目前墩子河水质由劣V类变为Ⅲ类。墩子河的变化，村民们看在眼\n里，赞在口边：“风景变好了，大家就都来河边遛弯、跳广场舞了。”5年多来的实践证明，全面推行河湖长制符合国\n情水情，具有强大的制度生命力。","source":{"doc":"7e42c077e9c847e9914a","first":1,"last":1,"file":"7e42c077e9c847e9914a.pdf","page":1}},{"label":"材料3","text":"材料3\n   暮色苍茫，江水奔腾。14头亚洲象缓缓从老213国道跨江桥上走过，消失在元江南岸的丛林中……2021年8月8\n日20时许，当无人机监测的实时画面传回时，十多公里外的北移亚洲象群安全防范工作现场指挥部里爆发出一阵欢\n\n呼。大象走过元江桥，意味着一度北移近500公里的象群跨越了南归的最大障碍，栖息地适宜性从此大幅提升。\n  这群大象是2021年4月16日突然出现在元江县的一座山头上的。大象来了！大象从哪里来？遇到大象怎么办呢？\n公众一时紧张起来，有关部门和地方政府紧急成立各级指挥部，加强监测预警。亚洲象是现存最大和最具代表性的\n陆生脊椎动物。这群拖家带口的“巨无霸”，为啥要离开“老家”X市国家级自然保护区北移活动？它们的一举一动牵动\n着公众的心。\n  “考虑到象群离开栖息地后北移，气温降低、食物匮乏，不利于种群的长远发展。越往北，公众接触象群的经验\n越少，风险很大，我们一路上都在努力让象群南返。”国家林草局亚洲象研究中心于主任说，“无论如何，一定要保障\n人象两平安，这是我们一切工作的底线！”\n  “大象到我们这里啦！”听说大象快到村里了，49岁的村民老唐兴奋得像个孩子，“以前只在电视上见过大象。”他\n担心大象吃不饱，主动联系了乡政府，捐出自家种植的玉米投喂大象。“大象贪吃点儿没事儿，它想吃就吃。我们的\n庄稼被吃掉了明年可以再长，大象如果饿坏了就没有了。”大象所到之处，为了不惊扰象群，人们庆祝传统节日时，\n不搞庆典，不点火祈福。沿途企业在大象经过时，关灯停产，保持静默……一幕幕感人情景，刷爆网络，温暖了全\n球。\n  我国古代有许多可贵的保护生态的理念和做法，《孟子》中“数罟不入洿池，鱼鳖不可胜食也。斧斤以时入山\n林，材木不可胜用也。”的描述生动展现了儒家文化的生态理想。唐玄宗禁绝民间采捕百色鸟兽之风；明弘治年间朝\n廷多次放生野生虎、鹰等，并禁止各属国进献珍禽异兽；清雍正帝禁止进贡象牙制品……这样的事例举不胜举。“这\n次突发事件是一次人与大型野生动物的生动交流，也是宣传的绝好机遇。”Y省林草局王局长说，“我们利用大象北移\n事件加大生态保护宣传，受到沿途百姓的普遍欢迎，仿佛人与自然和谐相处的基因一直深藏在普通中国人的血脉\n里，一碰到合适的契机，就会被激发出来。这场罕见的亚洲象长距离北移，真是对我们野生动物保护理念、应急管\n理水平、人文素养等方面的一次全方位考查和检验。”","source":{"doc":"7e42c077e9c847e9914a","first":1,"last":2,"file":"7e42c077e9c847e9914a.pdf","page":1}},{"label":"材料4","text":"材料4\n  “耕读传家久，诗书继世长。”“既耕亦已种，时还读我书。”……千百年来，这些古训被不少家族奉为家规家训，\n代代相承。如今，我们早已告别那个炊烟袅袅、鸡犬相闻的“乡土中国”，取而代之的是一个个高楼林立、车水马龙的\n信息都市。然而“耕读”的传统并未远走，“耕读”的内涵仍在延伸。\n  近年来，“全国文明典范城市”Z市不断推广全民阅读，精准对接城乡群众需求，在实践中探索出一条符合港城实\n际的“书香城市”建设新路子。百家桥村24小时图书馆驿站“百味书屋”开张已有两年，不少村民成为这里的常客。“两年\n来，通过阅读活动，村民的不良习惯改变了很多。下一步，我们将继续在提升村民文明习惯上下功夫。”村党委书记\n老徐说。坐落在沙洲湖畔的益空间·源书房是Z市打造的首个“捐赠图书馆”，现有市民捐赠图书8700多册。市委宣传部\n李部长介绍，通过制度引领，全民参与，阅读已成为Z市“传播思想、成就梦想”的文明实践新路径。\n  “岂曰无衣，与子同袍”“青山一道同云雨，明月何曾是两乡”，新冠肺炎疫情发生以来，这些源自中华文化的诗\n句，在不同的场合屡屡传诵，让人倍感温暖。5000多年风雨沧桑，中华民族孕育了一方有难、八方支援和团结一\n心、共克时艰的优良传统。疫情防控期间，全国一盘棋。兵“桂”神速、“湘”互扶持、竭“晋”全力、鼓足“赣”劲、\n力“皖”狂澜、“粵”来越好……武汉疫情、南京疫情、上海疫情……最优秀的人员、最急需的资源、最先进的设备总能\n义无反顾地千里驰援，在最短时间内实现医疗资源和物资供应的有序保障。为打赢疫情防控的人民战争，广大党\n员、干部带头拼搏，人民解放军指战员、武警官兵、公安民警奋勇当先，广大科研人员奋力攻关，数百万快递员冒\n疫奔忙，千千万万志愿者和普通人默默奉献……\n   不仅如此，我们在自身疫情防控面临巨大压力的情况下，积极履行国际义务，尽己所能为国际社会提供援助。\n在S大学儒学高等研究院季院长看来，中华优秀传统文化中这种“天下为公”“先集体后个人”的文化自觉，在构建人类\n命运共同体尤其是面对公共卫生危机时，有着不容抹杀的积极意义。","source":{"doc":"7e42c077e9c847e9914a","first":2,"last":2,"file":"7e42c077e9c847e9914a.pdf","page":2}}],"answer":{"text":"一些地方和部门借鉴传统文化的智慧赋能社会治理，在不同领域取得显著成效：大山村借用“六尺巷”故事，化解\n村民间的土地纠纷；小雪街道成立“和为贵”调解室，减少邻里纠纷，改善民风；梅林村贯彻落实“河长制”，畅通河\n道，改善水质，美化风景；Y省贯彻儒家生态理想，保障象群南返，促进人和自然和谐相处；Z市延续“耕读”传统，\n推广全民阅读，精准对接群众需求，建设“书香城市”，提升文明习惯，传播思想、成就梦想；全国上下以“天下为\n公”“先集体后个人”的文化自觉，在疫情防控期间调度人员和物资，为国际社会提供援助。\n   参考答案说明：本参考答案按照“总结性引导语+一些地方和部门借鉴传统文化的智慧赋能社会治理，在不同领域\n取得显著成效”的结构，具体从大山村、小雪街道、梅林村、Y省、Z市、全国上下这六个层面，介绍了地方、部门将\n传统文化中的智慧赋能现代社会治理，取得的显著成效。答案用一段话的形式呈现，符合题目要求。","source":{"doc":"e31432d6e63d78de7465","first":1,"last":1,"file":"e31432d6e63d78de7465.pdf","page":1}}},"江苏 2024 B类 申论#1":{"label":"江苏 2024 B类 申论 · 第 1 题","origin":"真题","paper":"江苏 2024 B类 申论","stem":"1. “给定资料1-4”中，一些地方和部门在智慧执法方面的创新举措产生了显著成效，请用一段话对此进行归纳概括。\n（15分）\n要求：紧扣给定资料，全面、准确，篇幅不超过250字。","options":[],"key":"","source":{"doc":"bed85ff950924671a40c","first":4,"last":4,"file":"bed85ff950924671a40c.pdf","page":4},"materials":[{"label":"材料1","text":"材料1\n  “行政行为码”你听说过吗？这是Z省智慧执法的新举措。该省依托“大综合一体化”执法监管数字应用系统，开发\n了行政执法自动生成监管代码的功能。这个代码就是“行政行为码”，是行政行为全周期的唯一标识。该码2月1日起在\n全省推行，目前已覆盖了全省4700余个执法主体以及行政许可、行政检查、行政处罚等应用环节。它包含行政行为\n类型码（2位）、部门代码（9位）、日期（6位）、序号（4位）、自定义码（5位）和校验码（1位），是行政执法\n不可篡改的“身份码”。\n  近日，H市某景区综合行政执法队员在日常巡查过程中，发现有人在国有山林中堆放建筑垃圾。经核实，当事人\n违反了《城市建筑垃圾管理规定》第十五条，依规予以简易程序处罚。执法队员使用掌上执法端操作，在生成电子\n处罚决定书的同时，27位数值的“行政行为码”同步产生。“当事人可以通过扫码来获取相关文书，了解自己所违反的\n法律法规、所受到的处罚内容及相关执法流程；执法人员扫描该码，整个案件的办理和进展情况也一目了然。”执法\n队王队长介绍，“小到遛狗不拴绳，大到无视燃气安全隐患、污染公共环境，各类违法行为的执法都可以通过‘行政行\n为码’快速查询、实时回溯案件办理情况，全流程相关信息明明白白。”\n  目前，Z省已经完成了对全省相关业务主管部门和业务骨干的“行政行为码”使用专题培训。接下来，该省将以“大\n综合一体化”行政执法改革、整体智治现代法治政府建设等一系列重点工作为抓手，加快“行政行为码”的推广应用，\n努力实现行政行为赋码率、电子签章使用率、平台出件率、执法线索处置率4个100%。\n  Z大学公共政策研究院周研究员认为，“行政行为码”将行政执法所涉及的人员、行政行为及其类型、时间等全要\n素一律数字化、格式化、标准化，通过“一码关联”“一码查询”“一码追踪”，能有效推动执法权力行使全流程在线运\n行，及时预警、精准监督、风险可控、留痕可溯，让执法变得更加阳光高效。","source":{"doc":"bed85ff950924671a40c","first":1,"last":1,"file":"bed85ff950924671a40c.pdf","page":1}},{"label":"材料2","text":"材料2\n  “被列入围栏车辆某A-xxxB9，经检测，超限4.71吨，超限率15.19%。该车将通过北门桥动态检测点，请及时拦\n截。”某日下午，C县综合行政执法局指挥中心的大屏幕上循环播放着一辆超载大货车的画面，还伴随着上面的语音\n提示，货车途经路段的电子屏上也打出了醒目的字幕。该大货车司机杨师傅看到提醒后，将车开到了指定的动态检\n测点，并按规定接受了处罚，处理结果随即上传到了指挥中心。“这是我县为提升货运车辆超载超限执法能力而专门\n研发的‘智慧交通运输管理系统’，这一系统为我们的交通执法插上了‘智慧的翅膀’。”县综合行政执法局高局长介绍。\n  C县拥有丰富的矿产砂石资源，砂石运输行业的源头监管及路面管控一直是当地的“老大难”问题。去年以来，该\n县大力开展相关整顿，并积极探索通过科技赋能提升管理效能。“‘智慧交通运输管理系统’经政府公开招标后，由县综\n合行政执法局与一家科技公司共同研发。”高局长介绍，“整套系统由企业源头管理、路面卡口、不停车检测系统和静\n态称重系统、附件系统组成。进入我县运输砂石的车辆从源头企业装车时，就会通过磅秤形成电子运单。智慧平台\n管理系统能实时读取企业端的磅秤称重数据，从源头上消除超载超限行为的发生。”\n  目前，C县60余家砂石企业都已接入了“智慧交通运输管理系统”，并统一安装源头数据采集系统。每辆车所载货\n物的品种、源头企业和车辆、驾驶员信息等，都能及时上传到平台，纳入统一管理，所有车辆出场时都会自动接受\n相关部门监管。如果哪辆车涉嫌超载，平台就会自动收到信息并立即预警，提醒源头企业和车辆驾驶员现场整改，\n达到标准后才能开始运输。对于行驶中的过路货车，平台也会通过不停车称重系统判断车辆是否存在超载超限情\n况。如果存在问题，沿途的3个LED屏将会对车辆进行复检提示，平台也会第一时间通过语音和弹窗发出提示，相关\n执法人员的手机App都会收到通知，快速锁定车辆信息，在检测点进行复查。货运驾驶员们纷纷表示：“以前遇到抽\n查时，一等就是很长时间，耽误事儿。现在不一样了，什么都是自动的，节约了时间，多跑一趟就是收入啊！”“这个\n系统让驾驶员从‘我想超’变为‘不敢超、不愿超’。”高局长说。","source":{"doc":"bed85ff950924671a40c","first":1,"last":1,"file":"bed85ff950924671a40c.pdf","page":1}},{"label":"材料3","text":"材料3\n  今年元宵节前后，蒙蒙细雨裹挟着丝丝春寒，夜色下的N市夫子庙灯火璀璨，美轮美奂的秦淮灯会让这里成为最\n具年味的地方；人流如织让夫子庙地区也成为春节期间全国热度最高的5A级景区之一。据悉，灯会期间夫子庙地区\n未发生重大刑事、治安案件，未发生踩踏事故，社会治安秩序良好。这其中，警方借用互联网、大数据技术进行严\n格防控发挥了特殊的作用。\n  启用人群热力图检测分析，是秦淮灯会安保的一大特色。据市公安局科信处研发中心李主任介绍，N市警方运用\n最新技术，通过与互联网企业、通讯运营商的合作以及对空间位置信息的聚类分析和挖掘，对灯会核心景区等重点\n部位人群密度进行实时监测。“我们根据设定的临界值和数据模型计算出人群分布密度，配以不同颜色进行标示，形\n\n成人群聚集热力图，颜色越深代表人员越集中、颜色越浅代表人员越稀疏。警方可以据此准确把握治安动态，实现\n对重点地区防拥挤、防踩踏及区域人员流入流出等情况的综合研判，为安保指挥、决策提供科学依据。”李主任说。\n  “智能警务”助阵秦淮灯会安保，手段远不止此。科信部门还创新技术手段，利用4G高清无线图传对灯会景区开\n展“视频巡逻”，使现场高清视频能够及时回传至安保指挥部，有效弥补了固定监控难以完全实现“无死角全覆盖”的缺\n陷。\n  针对灯会中儿童走失、游客走散较多的情况，警方建立起具有开放式景区特色的“防走失系统”。据了解，该系统\n主要由寻人微信群、寻人点、单兵组、寻人广播、智慧夫子庙大屏五大元素构成。元宵节当天下午，位于夫子庙广\n场附近的单兵小组发现一名五六岁的走失女孩，特警借用该系统，没几分钟就帮助孩子找到了家人。","source":{"doc":"bed85ff950924671a40c","first":1,"last":2,"file":"bed85ff950924671a40c.pdf","page":1}},{"label":"材料4","text":"材料4\n  “最强辅助AI来了，感觉不是一个人在战斗！”“AI小秘书”已经成为S市环境执法总队的执法神器。\n  “您已到达A科技公司附近，该公司技术项目环评报告表于2021年1月批复，近两年共有5次现场检查，曾发现危\n废管理不当等问题，通过大数据分析，该企业在线监测疑似存在篡改量程上限的风险……”日前，S市环境执法总队\n一大队俞队长带着执法队员开展了一次执法行动。刚到达目的地，他们随身携带的执法专用手机上，“AI小秘书”就发\n出提示，被检查对象相关检查情况的信息弹窗立即跳了出来。\n  “AI小秘书”是S市环境执法总队将AI大模型与环境执法工作相融合，开发打造的专门用于生态环境移动执法的智\n慧助手。这次执法行动中用到的就是其中的企业信息协查功能，这一功能整合了环评审批、排污许可、自动监控、\n固废危废、执法检查、行政处罚等污染源全生命周期的所有数据，向执法人员提供结构化和非结构文档数据解读、\n智能推送及信息查询等服务。\n  “以往执法时要先去查阅环评、排污许可证等纸质文件，资料携带和查阅不方便，现场检查费时费力。现在，环\n评材料、许可副本等所有信息数据已经整合在‘AI小秘书’这个移动执法App上，执法人员借助企业信息数据助手可以\n提前预习，也可边走边看，边问边查。”俞队长介绍说，他们切切实实地感受到“AI小秘书”极大地提高了日常执法工\n作的效率。\n  根据系统提示完成现场检查后，俞队长在专用手机上轻轻点了几下，一份执法文案已经形成并上传完毕。原\n来，他使用了“AI小秘书”的另外一个功能——“报告助手”，也就是执法文书的自动生成功能。执法人员只需要录入检\n查过程、发现的问题等信息，系统就会结合企业档案信息，自动生成高质量的执法文书文本，有效地保证了执法记\n录的规范性和准确性。\n  “AI小秘书”还是执法人员学习、运用政策法规的好帮手。它整合了海量政策文件、技术规范、行业标准、环境违\n法案由、裁量基准及典型案例数据，利用AI大模型能力进行环保领域行业模型训练，提供环境执法领域专业知识问\n答支持。执法人员对于现场发现的违法行为适用何种法条不确定时，只需提问，就能得到精准的违法和处罚依据及\n典型案例参考，为环境违法案件的精准查处提供可靠的支撑。","source":{"doc":"bed85ff950924671a40c","first":2,"last":2,"file":"bed85ff950924671a40c.pdf","page":2}}],"answer":{"text":"一些地方和部门在智慧执法方面的创新举措产生了显著成效：推出“行政行为码”，推动执法权力行使全流程在线\n运行，及时预警、精准监督、风险可控、留痕可溯，让执法阳光高效；利用“智慧交通运输管理系统”，加强源头监管\n及路面管控，提高货运车辆超载超限执法能力，节约时间，让驾驶员“不敢超、不愿超”；使用“智能警务”，维护社会\n治安，为指挥、决策提供科学依据，实现监控“无死角全覆盖”，解决儿童走失、游客走散问题；利用“AI小秘书”，提\n高执法效率，保证执法记录的规范性和准确性，帮助执法人员学习、运用政策法规。\n  参考答案说明：本参考答案按照“总结性引导语+各类创新举措产生的具体成效”的结构，具体介绍了“推出‘行政行\n为码’”“利用‘智慧交通运输管理系统’”“使用‘智能警务’”“利用‘AI小秘书’”四个方面的创新举措及其成效。答案用一段话的\n形式呈现，符合题目要求。","source":{"doc":"f75bd8f3e117a96a77ba","first":1,"last":1,"file":"f75bd8f3e117a96a77ba.pdf","page":1}}},"江苏 2025 A类 申论#1":{"label":"江苏 2025 A类 申论 · 第 1 题","origin":"真题","paper":"江苏 2025 A类 申论","stem":"1. “给定资料1-4”中，一些地区将各具特色的文化创意与地方旅游深度融合取得了显著成效，请用一段话对此进行归\n纳概括。（20分）\n要求：紧扣给定资料，全面、准确。篇幅不超过250字。","options":[],"key":"","source":{"doc":"b1f59532fef09ba66d75","first":4,"last":4,"file":"b1f59532fef09ba66d75.pdf","page":4},"materials":[{"label":"材料1","text":"材料1\n  开谈不说《红楼梦》，读尽诗书也枉然。文学巨匠曹雪芹用一部怀金悼玉的《红楼梦》，写尽世间盛衰荣辱、\n人生悲欢离合，绵延二百余年而长盛不朽。如今，在“世界文学之都”南京的江宁织造博物馆——红楼文化滥觞之地，\n又有了打开《红楼梦》的另一种方式。\n  “没想到能通过如此独特的方式进入曹雪芹笔下的世界！”2024年8月9日晚，00后观众小田走出南京江宁织造博\n物馆，仍沉浸在深深的震撼之中，特别是在“宝钗”为她披上披风的一刹那，她真切地感受到了文学的力量与温度。\n  小田所体验的是《大梦·红楼》沉浸式展陈空间，这场设置在世界文学之都的别出心裁的文化盛宴，吸引着众多\n年轻市民和游客参与。“仅仅开放两周就已经有观众五刷了，市场展现出的热情远超我们预期！”南京W数字科技公司\n陈经理感慨道，“这便是经典作品独有的魅力。”\n  《大梦·红楼》是全国首个以《红楼梦》为主题的全场域行进式近景沉浸体验项目。它从曹雪芹的视角，引领观\n众以第一人称开启60分钟的太虚幻境之旅。项目采用多线并行、穿插叙事的方式，在2000平方米的空间内设置了3大\n沉浸展区、4条不同的观众动线以及20个原著经典情节的还原。观众先领取披风，依据对应的“木石前盟”（黛\n玉）、“金玉良缘”（宝钗）等主题选择探索路径。体验过程中没有固定座位，观众可以跟随喜爱的角色自由行走并近\n距离互动。“仿佛看着这些角色在自己眼前真实地活了一遍。”有观众在社交平台分享自己的感受。\n  “在2019年南京申报世界文学之都的最后环节，需提交一份300字以内的介绍，其中唯一提及的文学作品就是\n《红楼梦》，而江宁织造府又是曹雪芹的诞生地，我们期望通过数字化的方式、沉浸式的玩法以及艺术化的表现形\n式，让《红楼梦》以全新面貌展现在世人面前。”陈经理表示。自7月20日试运营以来，《大梦·红楼》吸引了众多参\n与者，一些原本对《红楼梦》了解不深的年轻人体验后也决定回去重读原著。目前，该项目在各大平台上均获得较\n高评分，在多个榜单中名列前茅。\n  “您好，我们可以对首诗吗？”当你行走在西安时，遇到有人身着汉服跟你这样打招呼，请不必吃惊，这是古都正\n在兴起的一种“潮玩”方式。只需调动知识储备，你便可与对方来一场酣畅淋漓的诗词比拼。\n  西安，一座诗歌之城。唐代时，无数文人骚客到访长安，或吟诗作赋，或对酒当歌，留下了数不胜数的诗词名\n篇。如今，在西安大唐不夜城、钟鼓楼广场等地，身着古装的“对诗人”不时可见。他们与路人以诗歌之名相逢，共赴\n诗意盎然的时光，激活了心中日用而不觉的文化基因。\n    随着越来越多游客慕名而来，一些西安市民也开始走上街头，自发加入“对诗人”的行列。自去年8月起，原本在\n一家饭店打工的小赵拿起手机，每晚来到大唐不夜城开启对诗直播。他为自己的直播账号取名“小陕西”，希望让游客\n感受三秦大地和古都长安的别样魅力。\n    “向南望，秦岭巍巍，向北看，大雁塔就在眼前。站在这里，和游客一起吟诵‘慈恩塔下题名处，十七人中最少\n年’‘云横秦岭家何在？雪拥蓝关马不前’等诗句，就像古人来到了我们身边，这种感觉非常美妙。”小赵说。\n    “以前，很少有游客知道‘兰陵美酒郁金香’的下句，而现在能回答的人越来越多。有小朋友这次对不上来，会相约\n再来找我对第二次。”扮演李白的演员小董说。据他观察，游客对诗词的兴趣和储备量在显著增长。“诗词能带给人智\n慧与启迪，在快节奏的当下，人们越来越珍视传统文化的力量。”某大学社会学院肖教授说，“对诗贴近年轻人、更接\n地气，让诗词走出课本、活了起来，‘跟着书本去旅行’正成为潮流，诗词文化内涵丰富了旅游的参与与体验，增强了\n游客的情感共鸣。”","source":{"doc":"b1f59532fef09ba66d75","first":1,"last":1,"file":"b1f59532fef09ba66d75.pdf","page":1}},{"label":"材料2","text":"材料2\n  今夏首款国产3A游戏《黑神话：悟空》火爆全球，一同带火的还有山西文旅。游戏里多处场景均来自山西，游\n戏过程仿佛是对古建筑的一次深度还原，让玩家在享受游戏的同时，领略中华文明的深邃与广博。游戏发售以来，\n山西旅游频频冲上热搜，网友纷纷喊话：希望山西能接好这波“泼天的富贵”。\n  8月22日，在山西2024数字文旅品牌创新大会上，山西省文旅厅正式启动“跟着悟空游山西”活动，发布了“天命人\n集结令”及具体线路，邀请《黑神话：悟空》首批通关者免费来山西赏古建、品美食。当日，旅游平台上线了“跟着悟\n空游山西”团队专线。同时联合各大酒店、景区推出住宿、门票优惠以及文创好礼相送等，吸引更多海内外游客走进\n山西。8月26日，山西省文旅厅在微信公众号等社交媒体平台喊话“天命人”领取通关文牒，开启《黑神话：悟空》线\n下副本，并向一名留言的网友回复说：“宠粉，晋宝是认真的。”\n  公众号文章介绍，“跟着悟空游山西——山西古建巡礼活动”从9月1日正式开始，山西省文旅厅在佛光寺、崇福\n寺、小西天、玉皇庙等景区设立了线下存档点（打卡点），恭候各位“天命人”前来领取通关文牒、通关信物，集章打\n\n卡，分享实地打卡体验，还有机会获得主题周边和《黑神话：悟空》实体卡。一名上海网友在公众号留言表示：“游\n戏我买了，电脑我‘高配’了，山西我肯定来。游戏里的27个景点，我都要仔细观看、拍照、游览……”\n  据统计，国庆期间，山西共接待国内游客约3650万人次，较上年同期增长85%；游客旅游消费近230亿元，较上\n年同期翻了一番。在11月初举行的2024届城市品牌大会及“长城奖——文旅好品牌”案例征集大赛发布仪式上，山西文\n旅作为经典案例受到与会人士广泛关注。\n  “我们非常注重听取网友建议。”山西省文旅厅宣传推广处张副处长介绍，“跟着悟空游山西”活动前后的策划执\n行，很多举措都来自网友的建议，特别是通关文牒线下副本打卡活动，从投放数量、发放点、奖励机制等主打听\n劝，迎合市场的需求，受到游客热捧。大同佛小伴、悬空寺文创冰箱贴、晋祠比耶龙、饺子蘸醋、面团团等有品\n质、有意思的文创产品，把“跟着悟空游山西”推上了一条文旅发展的新赛道。","source":{"doc":"b1f59532fef09ba66d75","first":1,"last":2,"file":"b1f59532fef09ba66d75.pdf","page":1}},{"label":"材料3","text":"材料3\n   自贡，一座有盐味的城市。在中央电视台午间黄金档广告时段及各大新媒体传播平台，西南小城自贡市推出城\n市IP宣传片，让全国观众熟悉了这座城市的四张名片：千年盐都，恐龙之乡，中国灯城，特色美食。对外宣传紧跟\n全媒体时代，深挖地域文化价值，自贡市收获了意想不到的传播效应。\n  一年前，自贡市就与F动漫公司开展文旅合作开发，以恐龙元素为核心，融入自贡盐井、彩灯、美食等文化元素\n的动画片《时空龙骑士》，讲述发生于自贡市过去、现在、未来三个不同时空的科幻冒险故事，将自贡市特色元素\n及人文景观贯穿其中，让观众可以全面了解自贡市的深厚文化。这部充满人文和正能量的经典系列动画片已在央视\n等100余家电视台和20余家网络新媒体播出，并从新加坡等“一带一路”沿线国家扩展至欧美国家。\n   如今，自贡市已经由多渠道、多角度开展恐龙超级IP的宣传推广，发展起了以超级IP为载体的主题餐厅、酒店、\n游乐园、体验馆、教育基地等业态，在服装、玩具、游戏、学习用品等领域，开发出系列衍生产品，打通动漫上下\n游产业链条，让超级IP产生了巨大的经济效益。以自贡恐龙IP+其他动漫超级IP为核心，自贡F动漫公司投资30亿元\n打造动漫文旅小镇，构建吃、喝、玩、乐、购、住、学、创为一体的未来生活小镇模式，打造集旅游+动漫全产业链\n的文创商业综合体……恐龙超级IP得到全球旅行者和本市居民的认可，城市的灵魂得到塑造，城市核心竞争力得到\n构筑。","source":{"doc":"b1f59532fef09ba66d75","first":2,"last":2,"file":"b1f59532fef09ba66d75.pdf","page":2}},{"label":"材料4","text":"材料4\n  “是阳澄湖的大闸蟹么？麻烦帮我挑两只肥的哦！”“没问题。这两只都有足足四两，您看可以吗？”常在水产市场\n里听到的对话，却出现在了苏州博物馆文创小铺内。只见店员从“池子”里捞上两只“肥美”的毛绒大闸蟹，端端正正摆\n在台上称重，再用棉绳合拢蟹腿、收起蟹钳，最后把两只体重和颜值都“优秀”的大闸蟹交给来苏州旅游的00后小\n王。“这样的文创和仪式太有趣了！”满载而归的小王在社交平台上发布了“战利品”记录，获得不少点赞和评论。在她\n看来，游客愿意通过这样的文创产品去了解苏州这座城市，通过购买时的互动留下难忘的记忆，就是物超所值。\n  “有特色”“会整活”，是许多消费者对苏州博物馆文创的共同评价，甚至有不少人为了购买毛绒大闸蟹，专程从外\n地坐高铁赶来苏州。吴王夫差剑是苏州博物馆的镇馆之宝，也是苏博文创的热销爆款，设计团队通过将宝剑卡通\n化，做成了抱枕、挂件、玩偶等系列产品，一经推出就激发了游客和网友的购买热情。“为了一座馆，奔赴一座城”正\n成为当下许多年轻人的假期出行选择。“当越来越多的年轻人愿意走进博物馆，文创就是观众和博物馆之间最生动的\n桥梁，我们希望通过文创的桥梁，让大家感受到博物馆也可以很年轻、很活泼、很轻松。”苏州博物馆文化创意部蒋\n主任表示，“人文价值、创意设计和情绪价值是游客，特别是年轻游客购买文创产品的主要动因，我们正是围绕这些\n新需求研发新产品，让更多的年轻人开始深入了解文物和苏州文化。”\n  除了增强互动、给予情绪价值，数实结合、沉浸式体验也成为苏州文创产业的新趋势。在文博会“虎丘秘境”沉浸\n式体验展区，观众只需戴上VR眼镜，即可穿越时空，游览2500年前的壮丽虎丘，探秘千人石、莲花池等历史遗迹。\n在苏州博物馆西馆，今年6月26日开幕的“宇宙猜想·启程”大型宇宙探索VR沉浸体验展，至今已有近3万人参观，门票\n收入达255万元。\n  “文创产品经历了从1.0版本到3.0版本的发展，从最开始注重文化属性，即借助产品传播文化元素，到如今更倡\n导产品的实用性和趣味性，从实物形态演变为虚实结合、不拘一格。”蒋主任表示，在新质生产力的推动下，数字文\n创打通了虚实界限，个性化、定制化、数字化和体验式消费成为文创产品发展的重要方向。苏州积极推进文创产业\n与旅游、科技、金融等其他领域的跨界融合，探索新的产业发展模式，也拓宽了文创产业的发展空间，为产业创新\n发展提供了新动能。","source":{"doc":"b1f59532fef09ba66d75","first":2,"last":2,"file":"b1f59532fef09ba66d75.pdf","page":2}}],"answer":{"text":"文化创意与地方旅游深度融合的显著成效有：南京江宁织造博物馆推出《大梦·红楼》沉浸体验项目，吸引众多\n年轻人参与，激发观众重读原著兴趣；西安开展古装对诗活动，激活人们的文化基因，提升游客对诗词的兴趣和储\n备量，增强游客的旅游参与体验和情感共鸣；山西推出“跟着悟空游山西”活动，迎合游戏带来的市场需求，吸引海内\n外游客，打造文旅新赛道；自贡打造恐龙超级IP，产生巨大经济效益的同时，塑造城市灵魂和核心竞争力；苏州博\n物馆推进文创产业跨界融合，让年轻人了解文物和苏州文化，增加门票收入，扩宽文创产业发展空间。\n   参考答案说明：本参考答案按照“总结性引导语+各地区将文化创意与地方旅游深度融合的成效”的结构，具体介\n绍了“南京江宁织造博物馆推出《大梦·红楼》沉浸体验项目”“西安开展古装对诗活动”“山西推出‘跟着悟空游山西’活\n动”“自贡打造恐龙超级IP”“苏州博物馆推进文创产业跨界融合”五个方面的文化创意与地方旅游深度融合取得的显著成\n效。答案用一段话的形式呈现，符合题目要求。","source":{"doc":"c5e59296c6aaf5bdf3eb","first":1,"last":1,"file":"c5e59296c6aaf5bdf3eb.pdf","page":1}}},"江苏 2024 C类 申论#1":{"label":"江苏 2024 C类 申论 · 第 1 题","origin":"真题","paper":"江苏 2024 C类 申论","stem":"1. “给定资料1-4”中，一些地方采取新举措促进乡村产业发展，取得了可喜成效，请用一段话对此进行归纳概括。\n（20分）\n要求：紧扣给定资料，全面、准确。篇幅不超过250字。","options":[],"key":"","source":{"doc":"a7cfdee83e6ff0de5e71","first":3,"last":3,"file":"a7cfdee83e6ff0de5e71.pdf","page":3},"materials":[{"label":"材料1","text":"材料1\n  稻田里竟然养起了虫子！这桩新鲜事成了W县Z镇村头巷尾热议的话题。什么样的虫子如此受人关注？原来它叫\n禾虫，学名疣吻沙蚕，因富含蛋白质，被称为水中的“冬虫夏草”。禾虫既是美食，又是食疗保健佳品。在我国东南沿\n海和东南亚等地大受追捧，价格不菲。养禾虫的是人称“肥胆儿”的老王，当地有名的种田大户。前些年，他一次性流\n转来500亩水田，种植高端丝苗米香稻。如今，他的胆儿更“肥”了，在稻田里养起了禾虫。\n  “‘水稻+禾虫’是一种绿色生态种养模式，不能用除草剂，农药、化肥也都不能用。”正在察看水稻长势的老王向围\n观的村民介绍说，“禾虫会吃掉腐烂的稻根和茎叶、田里的浮游生物，减少水稻病害。它爱钻洞，可松动土壤，粪便\n是优质有机肥料。”有村民问：“你以前没养过，出现了问题怎么办呢？”“放心，县里很重视，专门给我配备了农技专\n家，一对一指导！”老王自信地说。\n  村民最关心的还是收入问题，老王给大家算了一笔账：不用化肥、农药，稻米产量要低一些，每亩净产大米300\n斤左右，但这样的大米质优价高，每斤能卖20元，而且供不应求，单这一项算下来就不比以前低。养禾虫的收入就\n更不用说了，一亩稻田可产出禾虫200到300斤，目前市场价每斤180元左右。“你们自己算算，看合不合算吧！”听了\n老王的介绍，不少村民跃跃欲试。\n  作为新当选的全国人大代表，老王准备明年“两会”期间提交一份建议，希望推广“高端香稻+禾虫”绿色生态种养模\n式。","source":{"doc":"a7cfdee83e6ff0de5e71","first":1,"last":1,"file":"a7cfdee83e6ff0de5e71.pdf","page":1}},{"label":"材料2","text":"材料2\n  “周某家，土地分红6900元，加上务工补贴等，总计分红7408元。”“赵某家，土地分红3600元，加上务工补贴\n等，总计分红3810元。”……某日，Y县H乡C村的小广场上热闹非凡，继举行农业“大托管”小麦丰收分红后，该村又\n一次举行玉米丰收分红仪式。伴随着村委会工作人员的招呼，村民们一个个喜笑颜开地走上前来，在登记簿上签下\n名字、按上手印，领走了分红款。\n  村党总支李书记介绍，“大托管”是一种集约化农业生产新模式，村集体统一耕、种、防、收、售，托管农户基本\n上就相当于“甩手掌柜”。去年10月份，该村实施了小麦“大托管”，人均分红1261元。今年夏种，村里又对220亩玉米\n实施了密植滴灌分段调控的吨粮田试验示范。除去最后十多亩地尚未称重外，今年C村玉米大丰收，产量达22万多\n斤。“收购方已一次性预转了20万元，今天拿来分红的就是这笔钱，等剩下的钱款到账后，村里会根据每户土地数核\n补余额。”\n  分红仪式吸引了一些邻村的村民赶来看热闹。“说不羡慕是假的。”S庄村民老高说，“没想到还能这样搞农业生\n产，俺们村今年也签了‘大托管协议’，到明年春天收成时，也可以有分红款领了。”\n  Y县农业农村局农技中心吴主任透露，刚推行“大托管”时，可没少做群众的思想工作，如今尝到甜头，越来越多\n的村民接受了这一模式。截至目前，该县已有6个村民组共2100余亩土地实施了“大托管”，明年县里将加快示范推\n广，争取让更多村民的腰包鼓起来。","source":{"doc":"a7cfdee83e6ff0de5e71","first":1,"last":1,"file":"a7cfdee83e6ff0de5e71.pdf","page":1}},{"label":"材料3","text":"材料3\n   何大姐回到了阔别已久的x村。碧水环绕的x村仿佛和从前一样，却又好像有许多不同。十多年前，为了配合水\n利枢纽工程建设，x村整体搬迁。部分村民搬到了城里，何大姐就是其中之一。2018年，何大姐看到有A宿集招聘酒\n店服务人员的信息，挤进人群一看，“工作地点：x村”。何大姐顿觉心头一热，就报了名。\n   应聘成功，过桥，渡河。回到x村，村头的沙枣树还在，废弃的房子却变了模样。黄褐色的夯土墙，原木色的立\n柱，小巧的方形窗子，一切都那么熟悉。走进去，却飘着咖啡香。水磨石地面的浅灰色空间很敞亮，装修自然，细\n看又带着精致。曾经废弃的这片村落，被打造成了集国内众多知名民宿品牌于一体的民宿集群。“北海”“风溯”“长乐未\n岸”……这些品牌一家一个土坯砌的院子，彼此独立，又相互融合。河岸边碧波轻抚的沙柳，围墙边高大笔直的白\n杨，都是A宿集为增加旅行者的体验特意留下来的。2019年4月A宿集开业的时候，何大姐心里还有些忐忑，会有人\n喜欢这样的村子吗？没想到，开业当月，房间就全被订满，订单一下子从5月排到了国庆假期。\n   这几年，在小小的x村里转，何大姐成长为一名路线规划师，带着游客看河湾、访旧村，讲讲这堵矮墙的故事，\n聊聊那家灶台的趣闻。“‘长乐未岸’门口有棵大槐树；‘北海’的标志是沙枣树，院子里种着枸杞苗。”何大姐如数家\n珍，“还有‘风溯’，一棵枣树就长在大厅里，天花板专门为它开了个洞。秋天，外面的叶子黄了，大厅里的叶子还是绿\n的。”晚上，大家烤红薯、煮玉米、数星星，聊着聊着都成了朋友。\n   A宿集成了旅行热门目的地，x村渐渐热闹起来，越来越多的当地人回来了，“你看，那个咖啡师小马就是x村\n人。”“那是从前住村头的程姐，她做的面包可是一绝。”如今，A宿集80%的服务人员都来自当地，旅游的火热也带动\n\n了当地就业增收，“村子里曾经荒废的小卖部也重新开起来了，热闹得很。”","source":{"doc":"a7cfdee83e6ff0de5e71","first":1,"last":2,"file":"a7cfdee83e6ff0de5e71.pdf","page":1}},{"label":"材料4","text":"材料4\n  早上6点，闹钟准时响起，S县L村蒋大娘忙碌的一天开始了。52岁的她在村里经营一家饭馆，常有游客慕名而\n来，只为尝尝地道的柴火饭，“游客多了，生意红火起来啦。”蒋大娘说，忙着准备食材时，蒋大娘随口哼上几句戏\n词。她哼的戏叫平调落子，是她的爱好，也是山乡特色。村口，各色戏剧脸谱悬挂在高高的村标石上；穿过梨园大\n街，两侧房屋墙上挂满戏曲道具；端花街、金枝巷，古香古色的小巷四通八达……\n  平调落子是当地独有的剧种，目前已经成为国家级非物质文化遗产。作为主要传承地，L村至今保留着自己的剧\n场和剧团。2018年，L村建立了S县平调落子博物馆，馆里设有舞台，展示各类道具、戏服，循环播放的视频讲述着\n平调落子数百年的发展之路。“咱们村戏曲传承群众基础很好，能为平调落子培养更多人才。”L村党支部魏书记说。\n在传习所里，平调落子传承人金奶奶带着几个孩子，一边打拍子，一边教他们唱平调落子，唱腔、手势、眼神、台\n步，一遍遍地反复练习，“有人学，有人教，有人听，唱戏的传统在咱们这一代断不了。”金奶奶说。\n  一曲地方戏，唱出了村子的名声，也给村子的发展带来了新生机，原汁原味的平调落子成了当地的“艺苑风景\n线”，吸引了众多山外来客。近年来，S县投资1000多万元，依托戏曲和旅游资源，把L村打造成了一个“戏曲小镇”，\n道路通畅了，风景更美了。除了博物馆和传习所，当地还成立了戏曲文创工坊、戏曲民宿、平调落子酒坊等。\n  “乡村旅游火了，给村民带来不少机会。”魏书记说。村民开起了民宿和农家乐，板栗、连翘、金银花等土特产也\n有了销路，现在村民每年人均纯收入已达到6000多元。站在L村平调广场上，一边是巍巍青山，一边是片片花\n海。“上山可观景，下山可听戏，吃住有特色，特产有销路。”魏书记感慨道，“一曲平调落子，唱出了我们生活的底\n气和希望！”","source":{"doc":"a7cfdee83e6ff0de5e71","first":2,"last":2,"file":"a7cfdee83e6ff0de5e71.pdf","page":2}}],"answer":{"text":"一些地方采取新举措促进乡村产业发展，取得可喜成效：支持“水稻+禾虫”绿色生态种养模式，提升种粮效益，\n增加农户收入，改善稻田生态环境，推动传统农业向绿色转型；实行“大托管”集约化农业生产新模式，转变传统种植\n模式，推动农业提质增效，增加农民收益，转变农民思想；打造民宿集群，盘活闲置资源，推动旅游业发展，吸引\n本地人返乡，带动就业增收；打造“戏曲小镇”，推动文化传承，增加村子名气，带来发展生机，推动文旅产业发展，\n改善人居环境，增加收入，给村民带来机会，让村民对生活充满底气和希望。\n   参考答案说明：本答案在开头部分添加适当引导语，然后围绕“促进乡村产业发展”这一主题，分别介绍了“支\n持‘水稻+禾虫’绿色生态种养模式”“实行‘大托管’集约化农业生产新模式”“打造民宿集群，推动旅游业发展”“打造‘戏曲小\n镇’，推动文旅产业发展”这四个新举措和取得的成效，并按照资料顺序进行罗列。","source":{"doc":"525cbf0b49bf46168baf","first":1,"last":1,"file":"525cbf0b49bf46168baf.pdf","page":1}}},"国考 2025 行政执法 申论#3":{"label":"国考 2025 行政执法 申论 · 第 3 题","origin":"真题","paper":"国考 2025 行政执法 申论","stem":"3. 为使夜市管理工作更加规范，B市大帆夜市综合服务办公室计划编写一份“平安夜市安全巡查工作指南”，供工作人\n员使用。根据“给定资料3”，请你草拟该指南中的工作事项及其相应工作内容。（20分）\n要求：\n（1）紧扣资料，内容全面；\n（2）工作事项明确，工作内容具体；\n（3）层次分明，条目清晰，语言简洁；\n（4）不超过500字。","options":[],"key":"","source":{"doc":"dbb2469ea58338709f40","first":4,"last":4,"file":"dbb2469ea58338709f40.pdf","page":4},"materials":[{"label":"材料3","text":"材料3\n  夜市，管好了就是十里飘香的美食街区，稍有松懈，就可能变成一失万无的安全事故区。为打造“平安夜市”，B\n市公安局大帆分局联合相关部门成立了大帆夜市综合服务办公室，制定了严格的安全管理规定，组成了一支由公\n安、城管、市场监管和街道办事处工作人员构成的管理队伍，分组定时进行巡查。\n  19:00，平安夜市安全巡查第三小组在组长小葛带领下，一行四人从夜市街口开始，展开当天的安全巡查。\n  19:10，巡查小组发现夜市某摊位只有一瓶灭火器。“每个摊位最少配备两瓶灭火器，摊主必须会使用灭火\n器。”为了让烧烤摊的“烟火气”更安全，综合服务办公室要求夜市经营场地必须具备消防安全条件，配置消防设施、\n器材，保障疏散通道、安全出口、消防车通道畅通，设置防火标志。巡查小组对摊主进行了消防安全教育，并责令\n其限期改正。\n  19:40，巡查小组已经检查了10余户商铺的用电安全情况，并已逐一检查排烟管道是否有破损、食品卫生许可证\n是否悬挂到位……对存在问题的地方，小葛用手机拍照，上传到了市场管理平台。在市场入口处管理大屏上，各摊\n点实时安全卫生情况一览无遗。商户的库房装有摄像头，巡查小组可以随时查看库房的食品存放、加工过程和经手\n人员等情况。\n   19:50，巡查小组发现烧烤摊主王某存在从业人员健康证过期问题，做了记录登记，并对其批评教育，要求其尽\n快更换健康证。\n   20:00，巡查小组发现摊主翟某存在生熟、干湿、鲜活食品未分开储存等问题。为规范夜市食品摊贩经营行为，\n保障消费者“舌尖上的安全”，依据有关法律法规，此前夜市综合服务办公室已经专门发布了夜市食品安全告诫提示。\n根据相关规定，巡查小组中来自市场监管局的老张对翟某开具了限期整改通知书。\n   20:15，巡查小组接到综合服务中心信息平台通知，夜市中段有车辆违规停留，阻塞交通并造成了人流拥挤。巡\n查小组及时赶到现场进行交通疏导。针对夜市人流大、治安复杂的情况，夜市中心街道设立了大型显示屏，主干道\n上配备了10余个“云”广播，每个商铺配备口哨，可达到一呼百应、群防群治效果。在人流量大的街道口，发挥警用无\n人机高空视野广、监控范围大、视角灵活多变优势，深度融合警务指挥体系，实时联动街边警力，让路面巡控更高\n效。\n   20:30，夜市中有两名顾客因抢占座位问题而引发纠纷，并有大量群众围观。巡查小组及时赶到现场后，疏散了\n围观群众，对当事人进行现场问询，避免了矛盾进一步激化。之后，将其带至夜市综合服务办公室调解室。“大家相\n互握个手，继续开心吃烧烤，这个事情就让它过去好了。”在调解室内，民警、调解员、律师一起，成功调解了这起\n纠纷。“警察同志，这里的秤不太准”、“这边的摊位应该是我的，他摆过界了”、“刚在这家店买的东西不太新鲜”……\n尽管类似的纠纷时有发生，但都能及时得到妥善处置。对于小的纠纷，巡查小组一般现场加以调解，及时化解矛\n盾；对于较大的纠纷，则将当事人带到调解室专门解决。\n   20:50，巡查小组发现一名和家长走散的儿童。在及时联系家长后，巡查小组中的社区民警老皮将孩子送到了夜\n市综合服务办公室。“我们巡查小组每天来回巡逻夜市，维持市场秩序，最多一天走了4万多步，要让夜市平安，可不\n容易嘞。”老皮感慨地说。\n   21:00，巡查小组在夜市“平安驿站”进行安全知识宣讲。“这几种常见的新型诈骗，注意防范”、“酒后千万不要开\n车”、“我们就在附近巡逻，有问题随时找我们”、“不要打架，打输住院，打赢坐牢”。“平安驿站”也是居民和游客经常\n光顾的地方。防范电信诈骗是“平安驿站”里的重头戏，巡查小组一改过去“单向灌输”的宣传模式，把理财投资习惯、\n\n金融知识测试、常用社交软件等都纳入“反诈体检”项目。作为对投资理财有“高期盼”的“金融小白”，俞女士被列入高\n风险易受损群体。“真没想到，逛夜市还能收获安全防范知识，你们的宣传太接地气了。”又惊又喜的俞女士说道。\n  夏季，夜市一般到凌晨1点才会“降温”，周末和节假日则会更晚。夜市打烊了，巡查小组却不一定能“打烊”。每晚\n例行巡查结束后，他们还要完成当天的巡查记录，做好工作交接。小葛笑着说：“希望通过我们的绵薄之力，让前来\n消费的市民游客安心，也让这些商户放心做生意。”","source":{"doc":"dbb2469ea58338709f40","first":2,"last":3,"file":"dbb2469ea58338709f40.pdf","page":2}}],"answer":{"text":"事项一：19点开始，对各商铺、摊位逐一进行消防卫生巡查。工作内容：1.检查消防安全情况。包括消防设施器\n材、防火标志、疏散通道、安全出口、消防通道、用电安全等。2.检查食品安全卫生情况。查看食品存放、加工过程\n和经手人员等情况，检查食品卫生许可证、从业人员健康证。3.现场处理。发现问题及时登记记录、手机拍照、上传\n平台，并对摊主进行批评教育，责令限期改正。\n  事项二：消防卫生巡查结束后直至夜市打烊前，来回巡逻，维持夜市秩序。工作内容：1.维护交通秩序。在人流\n大的街口，利用警用无人机进行路面巡控；关注信息平台通知，出现交通拥堵问题时，及时赶赴现场疏导。2.加强治\n安防控。遇到矛盾纠纷及时赶赴现场，疏散围观群众，小纠纷现场调解，较大纠纷将当事人带到调解室解决；遇到\n人员走散，送至夜市综合服务办公室，及时联系家属。\n  事项三：21点开始，在“平安驿站”进行安全知识宣讲。工作内容：宣讲常规安全知识；宣讲电信诈骗防范知识，\n开展“反诈体检”，测试理财投资习惯、金融知识、常用社交软件等信息，重点提醒高风险易受损群体。\n  事项四：夜市打烊后，进行巡查工作收尾。工作内容：根据当天工作情况，完成巡查记录，做好交接工作。\n  参考答案说明：本参考答案按照“工作事项+工作内容”的形式，从“消防卫生巡查”“维持夜市秩序”“安全知识宣\n讲”“巡查工作收尾”四个方面展开，各条答案要点之间在内容上相互并列，没有交叉。","source":{"doc":"d1fc3fe21ef6ae3b1ae6","first":2,"last":2,"file":"d1fc3fe21ef6ae3b1ae6.pdf","page":2}}},"guide-market":{"label":"邻里集市服务指南","origin":"据真题材料改编","paper":"江苏 2023 C类 申论","materials":[{"label":"材料6","text":"材料6\n  2022年11月12日，由双桥街道绿园社区青年干部设计的首届“邻里创意集市”火热开市。该创意集市由社区青年\n干部小谭、小张等人提议开设。不久前，小谭在社区的留言信箱看到了居民留言，“如今小区环境好了，但修把伞、\n补双鞋、磨把刀都找不到地方。”“孩子大了，玩具和书籍堆在家里很是头疼，丢了又可惜。”……居民的小事就是社\n区干部的大事，他们一合计，决定创办一个集市，集中解决居民们的细碎需求。以下是集市开张当日几个活动区的\n活动场景。\n  小邻居共享区：“大甩卖、大甩卖！八成新的各类图书买一送一啦！”“走过路过不要错过，抽奥特曼卡送毛绒玩\n具……”几个孩子兴高采烈地在集市上进行物品交换和售卖。在集市开始前，不少孩子家长已经通过社区数字化平\n台“友邻有伴”提前发布了“换一换”信息，所以当天来的孩子特别多，现场热闹非凡。“太过瘾啦，我昨天看好的玩具，\n今天‘换一换’成功啦！下次我还要来！”一位七八岁的小姑娘抱着毛茸茸的“大熊”兴奋地说。孩子们的热情吸引了不少\n家长的目光，“物尽其用，很好！不浪费，还能锻炼了孩子。”小区居民王爷爷说：“我家里也有些‘老物件’，什么时候\n集市也能有个‘老邻居’区，让我也来体验一把。”\n  义剪服务区：志愿者徐阿姨正在为一位老人理发，“我本来也不是专业的，都是退休后慢慢学的，太时尚的我不\n会，但给老人们服务服务还是可以的，能用一技之长为大家服务我感到很开心。”一上午，徐阿姨为18位居民修剪了\n头发。“剪的蛮好，只是只有一位师傅，如果以后能多来几位就好了，也省得我们排长队。”刚理好发的老张说。徐阿\n姨说：“没想到，今天来了这么多人，刚才还有一位居民说，家里有位卧床老人希望我们能上门服务。”\n  政府政策宣传区：“困境儿童及家庭遇到突发问题，应该找谁寻求助？”“想入住区社会福利院怎么申请”……在民\n政政策宣传摊位前，社工为居民答疑解惑，区民政局工作人员小朱说，居民们对民政方面的问题，咨询特别多，我\n们带来的50本宣传手册一会儿就发完了。\n  圆梦行动区：一块钱可以做什么？一块钱可以实现邻里的一个微心愿。前期，绿园社区通过摸排，收集了50多\n个困难居民的微心愿，希望通过在邻里创意集市中鼓励大家一块做公益，帮助邻里圆梦，进而带动全社区居民参与\n志愿服务。“捐一块钱不是啥大事，但用在了哪里，我们也不知道啊！”刚捐完钱的马大姐说。\n  本届集市上，儿童启蒙、非遗簪花、绿植养护等特色服务让人耳目一新，修伞、修鞋、磨刀等传统便民服务，\n也让居民日常“修补难”得到了解决，居民们纷纷“喊话”社区书记：这样的活动要经常搞啊！\n  一天的集市结束后，居民依然意犹未尽，大家在夸赞之余，也有期待。在集市美食区卖甜点的小马说：“这次集\n市的报名都快结束了，我才从小区公告栏上看到招募信息，差点就错过了。”\n  “本次邻里创意集市不仅为社区增添了‘人间烟火气’，也让参与活动的居民们沉浸式体验到了美好和谐的邻里场\n景，让大家幸福感倍增。”绿园社区书记说，“为了顺应居民们的‘呼声’，社区第二届邻里创意集市即将在下个月开\n市，目前各项工作正在筹备之中。”","source":{"doc":"22d3f6f8ead61f1ba343","first":3,"last":3,"file":"22d3f6f8ead61f1ba343.pdf","page":3}}],"stem":"根据材料6，为第二届邻里创意集市的社区工作人员写一份现场服务指南。按筹备、开市、收尾列出操作事项，限220字。","options":[],"key":"","answer":{"text":"筹备：通过公告栏、社区广播和居民群提前公布报名时间，指导居民在“友邻有伴”发布交换信息。按上届需求增配义剪志愿者、咨询人员和宣传手册。\n开市：分区引导儿童和老年居民交换闲置物品。为行动不便者登记上门服务需求，安排社工回答福利政策问题。\n收尾：清点微心愿捐款，公示用途并请居民代表监督。汇总排队时间、未解决的咨询和居民建议，交给下届负责人。"}},"guide-delivery":{"label":"配送员线索处理指南","origin":"据真题材料改编","paper":"江苏 2023 B类 申论","materials":[{"label":"材料5","text":"材料5\n  在N市，外卖小哥除了服务市民生活外，还扮演着安全监督员的角色，他们就像“移动探头”，将安全监管的视野\n延伸到城市的角角落落。\n  食材生熟混放，厨师一边吃东西一边炒菜，吃完用手直接抓豆芽，操作场所苍蝇乱飞……这是今年3月15日N市\n一家网络平台的外卖小哥小华在跑单过程中看到的一幕，他当即用手机拍下来，发到微信朋友圈里，为的是给好友\n们提个醒，不要到这家餐饮店来用餐。没想到朋友转发后引起了商家所在的Y区市场监管部门的关注，执法人员很快\n锁定了目标商家，迅疾赶往现场，核实情况后，责令商家停业整改，并对连锁的其他门店开展摸排检查。\n  这件事引发了Y区市场监管局领导层的思考：餐饮单位量多面广，监管压力很大，平均每位执法人员就要监管\n200多家餐饮单位。外卖小哥队伍庞大，而且直接接触餐饮单位，能够第一时间掌握商家食品安全情况，如果把他们\n组织起来，善加利用，完全可以成为食品安全监管的补充力量。该局组织人员对属地几十个在册的外卖配送站点开\n展走访调研，召开局党委扩大会议进行专题研究，最终决定发布“召集令”，邀请小哥们自愿加入，组成食品安全监管\n志愿者队伍。“召集令”发出后反响热烈。4月10日，140名外卖配送员戴上胸牌，庄严宣誓：“我志愿加入Y区市场监\n管局外卖服务行业食品安全监管志愿者队伍，承担起《食品安全承诺书》中的义务和责任，严格执行行业规范，让\n消费者吃得安心、放心……”从此，该局的食品安全监督员有了志愿分队和处置分队两支队伍。志愿分队由经过遴\n选、培训的各外卖平台配送小哥志愿者组成，负责报告食品安全问题，拍摄照片或视频，通过“食安宝”小程序上传。\n处置分队则由区局及各分局食品科、信用科人员组成，根据食品安全隐患线索及时做出处理，并对每月监督情况进\n行统计分析。\n  Y区市场监管局施行这一做法后，半年的时间里，志愿者们提供的食品安全隐患线索多达735条，这些隐患都得\n到及时处置，该区的食品安全状况得到明显改善。目前，N市市场监管局已在各区推广这一做法，全市已有2000多\n名外卖小哥担任食品安全监管志愿者，一些快递小哥和普通市民也纷纷申请加入这支队伍。9月29日，借鉴市场监管\n局的做法，市应急管理局也组建了一支“应急小哥”队伍，一批外卖小哥成为该市应急处置的“新力量”。“应急小哥遍布\n城市各个角落，容易在第一时间发现突发情况，通过‘应急宝’报送模板，能实时反馈人员伤亡、处置进展等现场图文\n信息。”市应急管理局相关负责人介绍，“N市应急指挥研判调度系统”一旦收到信息提示，就能实时显示应急小哥的点\n位、姓名、联系方式等信息，结合现有应急资源，匹配距离最近的应急力量，实现科学调度，快速协同处置。\n  随着越来越多的志愿者参与到安全监管工作中，如何做到行稳致远成了N市相关部门思考的问题。今年10月，该\n市成立了外卖配送行业党委，3家小哥流动党员党支部正式挂牌，让小哥党员们“流动不流失、离乡不离党”，在志愿\n者队伍中发挥其模范带头作用。为提高志愿者的食品安全监管能力，N市市场监管局举办了多期“小哥先锋·食安卫\n士”培训班，不仅帮助小哥们掌握食品安全监管基础知识，还指导外卖小哥从一名普通消费者的角度出发，加强与商\n家的沟通，积极当好食品安全“宣传员”“监督员”。市应急管理局联合相关部门对应急小哥开展业务技能培训和情景模\n拟，进一步提升其先期应急救援处置能力。\n  为调动志愿者们的积极性，市场监管部门的“食安宝”微信小程序里设置有“嘉许礼遇”功能，对服务达到一定时长\n的志愿者给予“积分打折”及兑换餐饮代金券、景区门票等福利。应急管理部门也制定了应急小哥积分奖励制度。N市\n在商业聚集区、社区等地建立“城市小哥爱心驿站”，为他们提供休憩充电、读书看报等暖心服务。市文明办联手多部\n门、多个外卖平台组织了“外卖小哥随手拍”作品展、外卖小哥和市民“食安找茬”大比拼等特色活动，参与活动的小哥\n们获赠文创礼物、爱心大礼包、非遗文化体验券等。市文明办张主任说，“我们举办这些活动，目的是让外卖小哥们\n感受到自己是城市安全的维护者和文明的建设者，增强他们的归属感。”\n  N市借力外卖小哥的做法经媒体报道，声名远扬。“我们K区是典型的食品生产、流通、消费大区，一直面临食品\n安全监管点多、线长、面广的难题。”前来学习考察的Z市K区市场监管局工作人员小曹向媒体透露，“我们区准备学\n习借鉴这一做法，进一步织密食品安全网。”","source":{"doc":"ff1aae0220054792cb2c","first":3,"last":3,"file":"ff1aae0220054792cb2c.pdf","page":3}}],"stem":"借鉴材料5中Y区的做法，为接收食品安全线索的处置分队写工作指南。用条目写清与配送员志愿者的分工及线索流转，限200字。","options":[],"key":"","answer":{"text":"一、接报。指导志愿者发现食品安全隐患时拍摄照片或视频，通过“食安宝”上传门店位置和现场情况。\n二、核实。处置分队登记线索，由区局或分局相应人员到店核查；涉及连锁门店时同步排查。\n三、处置。执法人员依核查结果处理并跟进整改，配送员负责发现和报告。\n四、复盘。按月统计线索和处置情况，将常见问题用于下一轮志愿者培训。"}},"guide-culture":{"label":"公共文化空间活动指南","origin":"据真题材料改编","paper":"国考 2024 地市级 申论","materials":[{"label":"材料4","text":"材料4\n  公共文化空间是文化交流和创新的重要场所，在塑造和凝聚社会认同方面发挥着重要作用。近年来，S市涌现出\n一大批公共文化空间，涵盖美术、戏曲、写作、音乐等多个门类，其中既有博物馆、图书馆等传统空间，也有时尚\n实体书店、民营美术馆等新型场所。这些公共文化空间运营情况如何？它们在文化建设中如何更好发挥作用？H报记\n者就此展开了调查。\n  “出门就能到，真的太方便了。”自从家门口建起畅雅艺术空间，居民小静有时买完菜或吃过饭就来转转。畅雅艺\n术空间是S市城区建起的第一家文化名家工作室，可辐射周边10个生活小区6200多位居民，成立3个多月来，开展参\n观交流等各类文化活动81场次，以颇具烟火气的姿态接待了1700多名各年龄层次的参观者。\n  畅雅艺术空间活动场面喜人，而有的公共文化空间却冷冷清清，“流量”不足。“公共文化空间要想运营好，离不\n开创始人的人文情怀和企业家精神。畅雅艺术空间之所以经营得好，与创始人麦老师不仅是文化名家还善于经营密\n不可分。”市艺术学院李院长说，“而现实情况是，民营公共文化空间的创始人大部分都是各自领域的从业者，在人文\n底蕴方面没问题，但是否具备经营管理能力就不一定了。”\n  调查过程中记者发现，一些公共文化空间开业时热热闹闹，运营一段时间后，就消失在人们视野中。“现在的公\n共文化空间建设，基本上是由各区主导的。各区基于自身的实际情况，主要考虑的是本区缺啥就建啥。”S市某民办\n美术馆贾理事长介绍说，“我们在区政府的支持下，建起了全市第一家民办美术馆。刚建成时人特别多，其他地方看\n到我们这么火爆，就纷纷效仿。据我了解，S市目前有近10家具备一定规模和档次的民办美术馆，但生存现状不容乐\n观，很多都是勉强维持，我们可能也撑不了多久。”\n  24小时图书馆是近年兴起的一类公共文化空间。记者分别在早、中、晚不同时段，探访了S市主城区某街道的24\n小时社区书院，发现几乎没有阅览的人。物业公司员工称：“很少看到有人使用。”记者以办理借阅卡为由向社区了解\n书院使用情况，工作人员回复：“目前以社区的儿童为主，以后多搞些活动，也许来的人就多了。”\n  记者走进全市规模最大的综合型书店，在书架旁找到了负责人张经理。张经理介绍说：“这几年，传统实体书店\n的经营越来越困难。我们进行了重新装修，从整体布局的设计到书籍的摆放，都花了很大心思，让读者在这里不仅\n能买书，还能轻松愉悦地看书、喝咖啡。刚开始效果特别好，但仅仅过了两年，情况又变差了。”店里的一位读者谈\n道：“现在书店的场景营造模式的确比原来好了很多，但大型的实体书店目前基本都走的这个路子，在设计风格、设\n施等方面没多大差别，特别在服务上，缺乏个性特点和差异化。第一次来的时候觉得新鲜，来过几次就会审美疲劳\n了。”\n  “这里简直太棒了，感觉摸准了我们年轻人的‘脉’。我在朋友圈看到同事发的视频，非常心动，专程过来打卡\n的。”一位参观者说。记者来到市美术馆，发现这里的人很多，尤其以年轻人为主。该馆唐馆长无奈地说：“我们发\n现，大家更多的是将我们精心营造的文化空间场景当作‘网红打卡点’，兴趣仅在拍照‘晒’图上，忽视了空间本身的文化\n内涵、价值观念、特色功能，这偏离了我们的初衷。”\n  抵达市文化馆时，黄馆长正在会议室里给市文旅局干部讲课。会议室中传出黄馆长授课的声音：“A市著名文旅\n夜市地理位置好，而且体量大、创意多，有不少现象级文化IP，年游客量超1亿人次，相关视频播放量高达50亿次。\n这一成功经验我认为值得好好学习和借鉴。”记者在文化馆馆史展板前，等到了授课结束的黄馆长。当被问到对本市\n公共文化空间的看法时，黄馆长说：“我市虽然历史文化遗存较多，但并没能给现有的公共文化空间带来更多影响\n力。成熟的公共文化空间载体规模普遍偏小，也比较分散，一些新建的公共文化空间规模相对较大，但离市区较\n远，去一趟费时费力。而且，我们也缺少主题型和创意创新类的公共文化空间。”\n\n  记者来到市博物馆，这里正在举办非遗表演，观众非常多，喝彩声和掌声不断。经了解，市博物馆针对不同年\n龄段观众，开设定制了市博研学、非遗表演、礼乐专题讲座等各类活动和课程。博物馆公共服务部常主任认为，市\n博物馆人气持续走高，不仅源于藏品和博物馆自身的历史，更因为博物馆通过提供“场所”进行文化价值的“输出”，实\n现了教育功能。","source":{"doc":"a79e2681008a994c88a1","first":3,"last":4,"file":"a79e2681008a994c88a1.pdf","page":3}}],"stem":"利用材料4，为公共文化空间运营人员拟一份活动策划指南。围绕服务对象、内容设计和活动复盘，每项写出可执行的动作，限200字。","options":[],"key":"","answer":{"text":"一、确定对象。分别了解儿童、周边居民和外地参观者的来访时段与需求，据此排出活动和开放时间。\n二、选题排期。盘点本地历史遗存和馆藏，设计分龄研学、非遗表演或礼乐讲座，给每项活动配上讲解和体验环节。\n三、检查效果。记录到场群体、参与体验和再次来访的情况，收集观众意见。对只吸引拍照的活动，调整讲解和互动安排。"}},"江苏 2024 B类 申论#3":{"label":"江苏 2024 B类 申论 · 第 3 题","origin":"真题","paper":"江苏 2024 B类 申论","stem":"3. “给定资料6”中的D市市场监管局拟向全市网络直播从业人员发出倡议。假设你是该局的一名工作人员，请以D市\n市场监管局的名义，撰写一份倡议书。（25分）\n要求：内容充实，针对性强；结构完整，符合文体要求。篇幅400字左右。","options":[],"key":"","source":{"doc":"bed85ff950924671a40c","first":4,"last":4,"file":"bed85ff950924671a40c.pdf","page":4},"materials":[{"label":"材料6","text":"材料6\n  近年来，随着电商活动的日益火爆，在直播间购物正成为广大消费者的一个重要选择。然而，这背后也暗藏风\n险。今年“双11”期间，中消协利用互联网舆情监测系统，对10月20日-11月13日期间的消费维权情况进行了网络大数\n据舆情分析。监测期内，共收集到“直播销售”负面信息50.9万条，“从监测数据看，以往大家熟知的‘规则难倒尾款\n人’‘套路渐欲迷人眼’等乱象有所改善，消费者对电商平台简化促销规则、提升消费体验的评价总体趋向正向，但一些\n经营户的诚信意识还比较淡薄，一些平台在提升消费者满意度和获得感方面做得还不够。”中消协相关负责人介绍\n说。\n  近日，为以案释法、震慑不法商家、规范经营行为、切实维护消费者的合法权益，D市市场监管局公布了一批直\n播带货违法违规典型案例：\n  案例1 以超低价销售多款假冒知名品牌服装\n  2023年8月，T区市场监管局依据监测线索，会同公安机关对B服装有限公司突击执法检查。经查，当事人在直\n播带货中以超低价销售多款知名品牌服装，价格仅为数十元，而官方正品最低价格也要近千元。现场查获侵权服装\n59件，根据直播销量初步计算当事人非法经营额约5.5万元，当事人已涉嫌构成“销售假冒注册商标的商品”罪。\n  案例2 直播间背景标示“专研抗老”构成虚假宣传\n  2023年5月，M区市场监管局依据举报线索，对C护肤品有限公司虚假宣传行为立案调查。经查，当事人在某平\n台直播间推荐、销售化妆品时，直播背景中标示了“专研抗老”等字样。另外，当事人在某平台旗舰店主页面及23款产\n品陈列背景上宣称“专研抗老”。经查明，上述化妆品均无抗老功能，当事人存在虚假宣传的违法行为。\n  案例3 相互串通以虚假价格差诱骗消费者\n  2023年2月，D市市场监管局根据相关线索，对该市F文化传媒有限公司和E电子商务有限公司共同价格欺诈行为\n立案调查。经查，F文化传媒有限公司主播在直播期间，以E电子商务有限公司在某平台同款商品的页面展示价作为\n比较价格进行宣传。另查，两公司商定在不同平台上架同一商品，并标示相差悬殊的价格，供直播带货比价使用。\n执法人员表示，这种通过虚假折价或者价格比较的手段，诱骗消费者与其交易的行为，严重侵犯了消费者的合法权\n益。该行为构成价格欺诈，两公司为共同违法主体。\n  案例4 以虚假信息制造紧张销售氛围\n  2023年3月，T区市场监管局根据相关线索，对K厨具有限公司虚假宣传和价格欺诈行为立案调查。经查，当事\n人在直播销售商品时，主播重复利用“大礼包还剩最后几单现货”“大礼包马上没有了”等宣传话术，在直播间内传递赠\n品“大礼包”所剩不多的不实信息，诱导消费者下单购买。同时，当事人在直播中传递亏本让利的虚假信息。执法机关\n依据相关规定，责令当事人停止违法行为。\n  D市市场监管局还对未成年人和医疗机构工作人员违规参与网络直播带货、直播带货时对商品或服务附加虚假的\n明星信息等问题进行了通报。\n  “依法监管带货直播，正当时。”相关行业专家指出，随着直播带货的日益盛行，“泥沙俱下”的现象屡见不鲜，消\n费者在直播中处于被动接受的地位，如果主播利用自己的影响力进行虚假宣传，不仅会误导消费者、造成损失，甚\n至还可能产生违背公序良俗、与社会主义核心价值观相背离的严重问题。\n  “针对直播带货这样的新模式、新业态，市场监管部门将着力加强相关工作。”D市市场监管局曹局长介绍说，“为\n规范网络直播经营行为、引导直播从业人员自律，我们将加大对相关法规政策的宣传力度；对屡屡出现问题的，将\n通过约谈、责令改正等方式督促其整改落实；对明显违法违规或损害消费者权益的，将依法严厉处罚。”曹局长表\n示，广大网民和社会各界如发现网络直播营销中的违法线索，可以向市各级市场监管部门反映或拨打12315进行举\n报。","source":{"doc":"bed85ff950924671a40c","first":3,"last":3,"file":"bed85ff950924671a40c.pdf","page":3}}],"answer":{"text":"关于D市规范网络直播行为的倡议书\n全市网络直播从业者：\n  近年来电商活动火爆，但一些经营户诚信意识薄弱，直播带货时出现违法违规行为。为维护消费者合法权益，\n规范经营行为，发出如下倡议：\n  一、依法依规经营。自觉抵制销售假冒商品、虚假宣传、相互串通以虚假价格差诱骗消费者、以虚假信息制造\n紧张销售氛围等违法违规行为。\n  二、加强从业自律。杜绝未成年人、医疗机构工作人员等违规参与网络直播带货，禁止对商品或服务附加虚假\n的明星信息，强化自我约束。\n  三、传播正确价值观念。网络主播应诚信经营，遵循公序良俗，传递社会主义核心价值观。\n  市场监管部门将加强相关监管工作，推动问题整改落实，严厉处罚违法违规行为，鼓励社会各界举报违法线\n索。希望相关从业人员能诚信经营，共同营造良好直播环境！\n                                                D市市场监督管理局\n                                                XXXX年XX月XX日\n  参考答案说明：（1）格式方面，本参考答案写到了“标题”“称谓”“正文”“落款”四个部分。（2）正文部分，一方面\n从内容上来看，本参考答案的开头先写到了“D市规范网络直播行为”的背景、目的；主体部分从“依法依规经营”“加强\n从业自律”“传播正确价值观念”三个方面介绍了具体做法；结尾部分介绍了市场监管部门的监管工作并发出呼吁号\n召。另一方面，形式上，本参考答案做到了分段、分条撰写，整体上条理较为清晰。","source":{"doc":"f75bd8f3e117a96a77ba","first":2,"last":2,"file":"f75bd8f3e117a96a77ba.pdf","page":2}}},"appeal-reading":{"label":"共读与分享倡议书","origin":"据真题材料改编","paper":"江苏 2024 A类 申论","materials":[{"label":"材料7","text":"材料7\n  最是书香能致远，从来善政不离书。各级领导干部带头读书、勤于读书，不仅是丰富自己、提升能力素质的有\n效途径，也必然会激发干部、党员和群众读书学习的积极性和主动性，对于书香社会建设有着巨大的推动作用。\n  2023年的夏天，国产动画电影《长安三万里》火爆出圈，大唐盛世中的李白、杜甫、高适等伟大诗人一一登上\n大银幕，不仅带我们感受群星闪耀的大唐风华，也让我们看到大唐诗人们追逐理想、实现人生抱负的恢宏故事。影\n片一上映便很快成为社会热门话题，影片中的48首诗歌也引发了全社会的古典诗歌热。8月中旬，J省文旅厅紫金图\n书馆党支部利用这一热点契机，组织全体党员干部开展“品诗词之美 扬文化自信”主题党日活动。\n  理论学习环节，全体党员集中学习了习近平总书记关于弘扬中华优秀传统文化的重要论述和在文化传承发展座\n谈会上的重要讲话，深刻领会了新时代新的文化使命重要论断的重大意义和内涵要义。诗词品评环节，青年党员代\n表以演讲、角色表演、PPT展示等方式分享自己钟爱的诗词篇章，并联系图书馆工作实际，诠释自己对诗词的解读\n与感悟。\n  文献部小戴：“大鹏一日同风起，扶摇直上九万里……宣父犹能畏后生，丈夫未可轻年少。”影片中李白的这首\n《上李邕》通过对大鹏形象的刻画与颂扬，表达了李白的凌云壮志和强烈的用世之心，全诗语气直率，充满了初生\n牛犊不怕虎的锐气。我觉得这首诗讲出了工作中我们年轻人常想说的心里话，我们生逢伟大年代啊，应当学习诗人\n这种不畏困难、勇于进取的勇气，实际工作中要敢于啃硬骨头，直面困难和挑战，展现青年人的责任和担当。\n  借阅部小吕：“莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒\n醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。”宋代文学大家苏轼的《定风波·莫听穿林打\n叶声》一词，通过野外途中偶遇风雨这一生活中的小事，于简朴中见深意，于寻常处生奇景，表现出一种旷达超脱\n的胸襟，寄寓着超凡脱俗的人生理想。上片着眼于雨中，下片着眼于雨后，全词表现了一位正直文人在坎坷人生中\n的力求解脱之道，篇幅虽短，但意境深邃，内蕴丰富，诠释着作者的人生信念，展现着作者的精神追求。这首词我\n一直很喜欢，对于我们拓展人生境界、正确对待工作生活中的风风雨雨有着很大的启示。\n  “遥望历史风尘中的大唐气象，是无数中国人萦绕心头的文化乡愁。一部《长安三万里》，重现的不仅是昔日的\n时光，更是奔流在中华民族血脉中的诗情回望……”辅导部小万的激情演讲赢得了一片掌声。\n  “诵读唐诗宋词，是一代又一代中国人的个体经验与集体记忆，它是日常性的也是仪式性的。今天各位青年同志\n选取的诗词极富代表性，既有表现青年人伟大抱负的杰作，也有反映人生、仕途变迁感悟的名篇，各位同志不仅能\n对诗词本身丰富的文化蕴含深入阐发，而且能将古今对接，把个人对传统诗词文化的理解融入真切的现实生活\n中……”此次活动特邀嘉宾N大学胡教授对各位青年党员代表的表现进行了精彩点评。活动最后，党支部朱书记借\n\n《长安三万里》中的台词进行了总结：“‘诗在，长安就在’，我想他实际上说的是——文化在，人在，家国就在。中华\n民族历经五千年生生不息，盖源于此。当前广大文艺工作者在习近平总书记关于文艺工作的重要论述指引下，充分\n彰显文化自信，不断推出精品力作。这对于我们文化服务战线也是极大的鼓舞和鞭策，我们唯有不断学习、终生学\n习，人生道路才能更广，社会贡献才能更大。”朱书记还向大家推荐了《唐诗三百首》《习近平用典》两本书，并要\n求在下次活动中大家交流读书心得。\n  “这样的活动在我们文旅系统各部门、各单位比比皆是，我厅每年都会组织‘书香支部 品质阅读’活动，活动中会\n评比‘最美阅读案例’，发布‘最受党员干部欢迎的10本书’书单，目前已连续举办了8届。党员干部读书所产生的‘风成于\n上，俗化于下’的强烈示范效应，已成为引领全民阅读的重要力量。”J省文旅厅机关党委陈书记说。","source":{"doc":"4fbf1d8260d6665235b0","first":3,"last":4,"file":"4fbf1d8260d6665235b0.pdf","page":3}}],"stem":"根据材料7，以紫金图书馆党支部的名义，向本馆全体党员发出参与诗词共读的倡议。写明参与方式与交流安排，限220字。","options":[],"key":"","answer":{"text":"关于参加诗词共读的倡议书\n各位党员同志：\n一次诗词品评，让同事们从《上李邕》读到迎难而上的勇气，也从《定风波》谈到面对风雨的从容。欢迎大家带着自己的感受加入共读。请各选一首喜爱的诗词，结合一次读者服务经历准备分享，可朗读、演讲或作角色展示。请从推荐书单中选读一本，在下次活动中交流心得，也欢迎向支部推荐想一起读的篇目。\n紫金图书馆党支部"}},"appeal-village":{"label":"退藕还稻倡议书","origin":"据真题材料改编","paper":"江苏 2024 C类 申论","materials":[{"label":"材料6","text":"材料6\n  G县W镇F村有3300亩基本农田，以前全种水稻。去年开始，陆续有村民改种莲藕。前年全村自种和出租种植面\n积达1200多亩，去年又新增了600多亩，基本农田种藕现象蔓延之势与国家政策相悖，亟待遏制。近日，驻村第一书\n记小余主持召开了基本农田“非粮化”问题整改座谈会，邀请了村民代表、邻村种粮大户代表参加，镇里有关领导也应\n邀出席指导。以下是座谈会的部分记录：\n  村民梁大姐：我明白保护耕地的重要性，毕竟吃饭是第一大事嘛，要是种粮食赚钱，不用动员，大家都会抢着\n种。之所以种莲藕，无非是因为收益高，我家种了四五年的莲藕，有7亩多，正常年景下每亩利润6000多元，现在叫\n我改种水稻，我的损失谁来补？\n  村民沈大伯：一熟稻一熟麦，种到胡子白。我今年69岁，孩子都进了城，老两口种5亩田挺吃力的，前年把其中\n3亩租给外地老板种水稻，租金每亩每年800元。去年听说莲藕种植户给的租金更高，就把剩下的全租给他们了。省\n力气不说，收入也多不少，我都这把年纪了，要退你们退吧，别折腾我了。\n  村民韩大嫂：我家10亩地都种了莲藕，现在不让种了，那复垦的钱谁出？\n  邻村种粮大户老四：我们村以前大面积推广种植瓜蒌，现在都改种了水稻，为了让大家种稻也能赚钱，镇上请\n来农技专家推行“水稻+”种养模式。刚开始，大多数农户是犹豫观望的，我和另一名党员率先采用新模式，稻田里不\n只是种水稻，还养了禾花鱼、龙虾、泥鳅，水稻为鱼遮阳、泥鳅净化水质，实现了“立体种养、一田多用、一举多\n得、一季多收”，节省农药、化肥等成本不说，收入也不低，每年亩产增收3000元左右。\n  W镇农办雷主任：根据我们掌握的情况，你们村的土壤非常适宜水稻油菜轮作，这样既能保证作物的产量和品\n质，又能提高土地生产能力。附近D村的条件与你们村相似，他们采用水稻油菜轮作，与中科院合作引进了小种米、\n\n紫米等科技稻，同时坚持施用有机绿色肥料，采用物理除草方式，病虫防治也用的是生物农药。今年，他们出产的\n稻米、菜油都取得了有机转换认证证书，行情看涨。如果你们有意轮作，镇里会给予技术支持和保障。\n  W镇孙副镇长：粮食安全是“国之大者”，守住耕地红线是政治责任。党的二十大报告强调“全方位夯实粮食安全\n根基，牢牢守住十八亿亩耕地红线”，今年中央一号文件要求“坚决守牢确保粮食安全底线”“严格控制耕地转为其他农\n用地”，县里也出台了《防止耕地“非粮化”稳定粮食生产工作方案》等文件。F村耕地非粮化问题比较突出，退藕还稻\n工作相对滞后，希望干部群众深刻理解党和政府的方针、政策，统一思想，协调好各方利益，积极借鉴其他村子的\n成功做法，确保退藕还稻工作的圆满完成。","source":{"doc":"a7cfdee83e6ff0de5e71","first":2,"last":3,"file":"a7cfdee83e6ff0de5e71.pdf","page":2}}],"stem":"根据材料6，以F村村“两委”的名义向本村村民写一份退藕还稻倡议书。回应种植收益和劳力顾虑，提出村民可以参与的具体行动，限220字。","options":[],"key":"","answer":{"text":"一起护好村里的粮田\n各位乡亲：\n田里种什么，关系一家人的收入，也关系大家的饭碗。我们倡议种藕户和出租田块的农户一同梳理地块，把复垦成本、缺少劳力等难处告诉村里，共商还稻安排。愿意先试的农户可参加农技指导，向邻村请教稻田综合种养，或了解适合本村的水稻油菜轮作。有经验的种粮户请带头示范、结对帮忙。让我们从一块田做起，把粮田种好。\nF村村“两委”"}},"appeal-market":{"label":"邻里互助倡议书","origin":"据真题材料改编","paper":"江苏 2023 C类 申论","materials":[{"label":"材料6","text":"材料6\n  2022年11月12日，由双桥街道绿园社区青年干部设计的首届“邻里创意集市”火热开市。该创意集市由社区青年\n干部小谭、小张等人提议开设。不久前，小谭在社区的留言信箱看到了居民留言，“如今小区环境好了，但修把伞、\n补双鞋、磨把刀都找不到地方。”“孩子大了，玩具和书籍堆在家里很是头疼，丢了又可惜。”……居民的小事就是社\n区干部的大事，他们一合计，决定创办一个集市，集中解决居民们的细碎需求。以下是集市开张当日几个活动区的\n活动场景。\n  小邻居共享区：“大甩卖、大甩卖！八成新的各类图书买一送一啦！”“走过路过不要错过，抽奥特曼卡送毛绒玩\n具……”几个孩子兴高采烈地在集市上进行物品交换和售卖。在集市开始前，不少孩子家长已经通过社区数字化平\n台“友邻有伴”提前发布了“换一换”信息，所以当天来的孩子特别多，现场热闹非凡。“太过瘾啦，我昨天看好的玩具，\n今天‘换一换’成功啦！下次我还要来！”一位七八岁的小姑娘抱着毛茸茸的“大熊”兴奋地说。孩子们的热情吸引了不少\n家长的目光，“物尽其用，很好！不浪费，还能锻炼了孩子。”小区居民王爷爷说：“我家里也有些‘老物件’，什么时候\n集市也能有个‘老邻居’区，让我也来体验一把。”\n  义剪服务区：志愿者徐阿姨正在为一位老人理发，“我本来也不是专业的，都是退休后慢慢学的，太时尚的我不\n会，但给老人们服务服务还是可以的，能用一技之长为大家服务我感到很开心。”一上午，徐阿姨为18位居民修剪了\n头发。“剪的蛮好，只是只有一位师傅，如果以后能多来几位就好了，也省得我们排长队。”刚理好发的老张说。徐阿\n姨说：“没想到，今天来了这么多人，刚才还有一位居民说，家里有位卧床老人希望我们能上门服务。”\n  政府政策宣传区：“困境儿童及家庭遇到突发问题，应该找谁寻求助？”“想入住区社会福利院怎么申请”……在民\n政政策宣传摊位前，社工为居民答疑解惑，区民政局工作人员小朱说，居民们对民政方面的问题，咨询特别多，我\n们带来的50本宣传手册一会儿就发完了。\n  圆梦行动区：一块钱可以做什么？一块钱可以实现邻里的一个微心愿。前期，绿园社区通过摸排，收集了50多\n个困难居民的微心愿，希望通过在邻里创意集市中鼓励大家一块做公益，帮助邻里圆梦，进而带动全社区居民参与\n志愿服务。“捐一块钱不是啥大事，但用在了哪里，我们也不知道啊！”刚捐完钱的马大姐说。\n  本届集市上，儿童启蒙、非遗簪花、绿植养护等特色服务让人耳目一新，修伞、修鞋、磨刀等传统便民服务，\n也让居民日常“修补难”得到了解决，居民们纷纷“喊话”社区书记：这样的活动要经常搞啊！\n  一天的集市结束后，居民依然意犹未尽，大家在夸赞之余，也有期待。在集市美食区卖甜点的小马说：“这次集\n市的报名都快结束了，我才从小区公告栏上看到招募信息，差点就错过了。”\n  “本次邻里创意集市不仅为社区增添了‘人间烟火气’，也让参与活动的居民们沉浸式体验到了美好和谐的邻里场\n景，让大家幸福感倍增。”绿园社区书记说，“为了顺应居民们的‘呼声’，社区第二届邻里创意集市即将在下个月开\n市，目前各项工作正在筹备之中。”","source":{"doc":"22d3f6f8ead61f1ba343","first":3,"last":3,"file":"22d3f6f8ead61f1ba343.pdf","page":3}}],"stem":"根据材料6，以绿园社区居委会的名义，向居民写一份参加邻里创意集市的倡议书。回应参与渠道和公益捐款去向两个关切，限200字。","options":[],"key":"","answer":{"text":"来集市，给邻里搭把手\n各位居民：\n上次集市上，孩子们换到了心爱的玩具，老师傅为邻居修好了旧物。欢迎大家在下届集市继续交换所需、分享手艺。请留意社区公告，在“友邻有伴”提前发布交换信息；擅长修理或理发的居民也可报名当志愿者。欢迎大家认领困难邻居的微心愿，并推荐居民代表核对捐款去向，和我们一起公开使用情况。期待在集市见到您！\n绿园社区居委会"}}}}</script>

<script>
'use strict';
const $=id=>document.getElementById(id);
$('allSearch').onsubmit=ev=>{ev.preventDefault();location.href='index.html#search?'+new URLSearchParams(new FormData(ev.target));};
const data=JSON.parse($('reader-data').textContent),cards=data.cards,byId=new Map(cards.map(c=>[c.id,c]));
const topics=['资料分析方法','数量关系方法','判断推理方法','言语理解与表达方法','申论方法','经济指标与宏观调控','马克思主义哲学','马克思主义政治经济学','科学社会主义','新时代中国特色社会主义思想','党政制度与理论','发展与治理','产业、科技与对外开放','农业与城乡治理','就业、社保与公共服务','生态环境与能源','历史常识'];
for(const c of cards)if(!topics.includes(c.topic))topics.push(c.topic);
const order=cards.slice().sort((a,b)=>topics.indexOf(a.topic)-topics.indexOf(b.topic));
const norm=s=>String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const index=new Map(cards.map(c=>[c.id,norm(c.label+c.topic+c.text+c.paper)]));
const key='kaogong-basic-reader-v1';let saved={},storageOK=true;
try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{storageOK=false}
const pinned=new Set((Array.isArray(saved.pinned)?saved.pinned:[]).filter(id=>byId.has(id)));
function persist(){if(!storageOK)return;try{localStorage.setItem(key,JSON.stringify({pinned:[...pinned],last:id,attempts:Object.fromEntries(attempts)}))}catch{storageOK=false}}
const first=order.find(c=>c.kind==='knowledge')?.id;
const skillEntry=order.find(c=>c.kind==='skill')?.id;
const hashID=()=>location.hash.slice(1);
let id=byId.has(hashID())?hashID():hashID()==='skills'?skillEntry:hashID()==='knowledge'?first:byId.has(saved.last)?saved.last:first;
let mode=byId.get(id).kind;
const recent={knowledge:first,skill:skillEntry};
const recallButton=$('toggle-recall');
function showReading(visible){$('reading-text').hidden=!visible;recallButton.setAttribute('aria-expanded',String(visible));recallButton.textContent=visible?'遮住正文，试着回忆':'显示正文，核对记忆'}
recallButton.onclick=()=>showReading($('reading-text').hidden);
let onlySaved=false,visible=[];
const attempts=new Map(Object.entries(saved.attempts||{}).filter(([key,a])=>data.practice[key]&&a&&typeof a.draft==='string'));
const selectedPractice=new Map();
const query=document.querySelector('#search'),dialog=$('library-dialog'),mobile=matchMedia('(max-width:760px)');
const make=(tag,text='',cls='')=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
const sourceFolders = {".pdf": "pdfs/lectures/", ".docx": "docs/"};
function originalHref(path) {
  return window.kbProtectedDownloads ? 'download.html?file=' + encodeURIComponent(path.split('/').map(s=>decodeURIComponent(s)).join('/')) : path;
}
function sourceUrl(name) {
  const ext = name.slice(name.lastIndexOf('.')).toLowerCase();
  const folder = /^[0-9a-f]{20}[.]pdf$/.test(name) ? 'pdfs/exams/' : (sourceFolders[ext] || '');
  return originalHref(folder + encodeURIComponent(name));
}
const fileUrl=s=>sourceUrl(s.file)+'#page='+s.page;
const pdfLink=(s,label)=>{const a=make('a',label);a.href=fileUrl(s);a.target='_blank';a.rel='noopener';return a};
const range=(a,b)=>a===b?String(a):a+'–'+b;
function paragraphs(host,text,title){
 host.replaceChildren();
 for(const line of pdfReadingText(text,title).split('\n')){
  if(line)host.append(make('p',line,line.startsWith('——')?'attribution':''))
 }
}
function repositionLibrary(){if(!mobile.matches&&dialog.open)dialog.close();(mobile.matches?dialog:$('library-slot')).append($('library'))}
repositionLibrary();mobile.addEventListener('change',repositionLibrary);
$('open-library').onclick=()=>{dialog.showModal();query.focus()};
$('close-library').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&& !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();if(mobile.matches&&!dialog.open)dialog.showModal();query.focus()}});
function updateMode(){
 const items=order.filter(c=>c.kind===mode);
 const counts=new Map();for(const c of items)counts.set(c.topic,(counts.get(c.topic)||0)+1);
 $('topic').replaceChildren(new Option('全部主题',''));
 for(const topic of topics)if(counts.has(topic))$('topic').add(new Option(topic+'（'+counts.get(topic)+'）',topic));
 $('totals').textContent=mode==='skill'?items.length+' 项技能 · '+items.reduce((sum,c)=>sum+c.groups.length,0)+' 组练习':items.length+' 个知识点 · '+counts.size+' 个主题';
 $('library-title').textContent=mode==='skill'?'技能目录':'知识目录';
 for(const type of ['knowledge','skill'])$('mode-'+type).setAttribute('aria-pressed',String(mode===type));
}
function modeSaved(){return order.filter(c=>c.kind===mode&&pinned.has(c.id)).length}
function switchMode(type,target,push=true){
 mode=type;onlySaved=false;query.value='';updateMode();showList();select(target||recent[mode],push);
}
for(const type of ['knowledge','skill'])$('mode-'+type).onclick=()=>{if(type!==mode)switchMode(type)};
function setAddress(push){try{const u=new URL(location.href);u.hash=id||'';if(u.href!==location.href)history[push?'pushState':'replaceState'](null,'',u)}catch{}}
function showList(){
 $('saved-count').textContent=modeSaved();$('tab-all').setAttribute('aria-pressed',String(!onlySaved));$('tab-saved').setAttribute('aria-pressed',String(onlySaved));
 const t=$('topic').value,q=norm(query.value);visible=order.filter(c=>c.kind===mode&&(!onlySaved||pinned.has(c.id))&&(!t||t===c.topic)&&(!q||index.get(c.id).includes(q)));
 const frag=document.createDocumentFragment();let previous='';
 for(const c of visible){if(c.topic!==previous){const h=make('div',c.topic,'group-name');frag.append(h);previous=c.topic}
 const b=make('button',c.label,'item');b.type='button';b.dataset.id=c.id;b.setAttribute('aria-current',String(c.id===id));b.onclick=()=>select(c.id,true,true);frag.append(b)}
 if(!visible.length)frag.append(make('p','没有匹配的条目','hint'));$('list').replaceChildren(frag);
}
function select(value,push=false,focus=false){
 id=value;for(const b of $('list').querySelectorAll('button'))b.setAttribute('aria-current',String(b.dataset.id===id));
 const item=$('list').querySelector('[aria-current="true"]');if(item){const list=$('list');const delta=item.getBoundingClientRect().top-list.getBoundingClientRect().top;if(delta<0||delta+item.offsetHeight>list.clientHeight)list.scrollTop+=delta-48}
 if(focus&&dialog.open)dialog.close();if(id){recent[mode]=id;setAddress(push);persist()}renderArticle();if(focus){const r=$('reader').getBoundingClientRect();if(r.top<0)window.scrollBy(0,r.top-10)}
}
function refresh(){showList();const active=visible.find(c=>c.id===id)||visible[0];select(active?.id||null)}
$('tab-all').onclick=()=>{onlySaved=false;refresh()};$('tab-saved').onclick=()=>{onlySaved=true;refresh()};
query.oninput=refresh;$('topic').onchange=refresh;
$('reset').onclick=()=>{onlySaved=false;$('topic').value='';query.value='';refresh()};
$('prev').onclick=()=>{const n=visible.findIndex(c=>c.id===id);if(n>0)select(visible[n-1].id,true,true)};
$('next').onclick=()=>{const n=visible.findIndex(c=>c.id===id);if(n+1<visible.length)select(visible[n+1].id,true,true)};
function followAddress(){const hash=hashID(),target=hash==='skills'?skillEntry:hash==='knowledge'?first:hash;if(byId.has(target)&&target!==id){if(byId.get(target).kind!==mode){switchMode(byId.get(target).kind,target,false);return}if(!visible.some(c=>c.id===target)){onlySaved=false;query.value='';$('topic').value='';showList()}select(target)}}
window.addEventListener('popstate',followAddress);window.addEventListener('hashchange',followAddress);
$('bookmark').onclick=()=>{if(!id)return;pinned.has(id)?pinned.delete(id):pinned.add(id);persist();if(onlySaved)refresh();else{updateBookmark();$('saved-count').textContent=modeSaved()}};
function updateBookmark(){const b=$('bookmark');b.setAttribute('aria-pressed',String(pinned.has(id)));b.querySelector('span').textContent=pinned.has(id)?'已收藏':'收藏'}
const formulas={'比较同比增速':['同比增速','现期量 − 上年同期量','上年同期量'],'计算现期比重':['现期比重','现期部分量','现期总体量'],'城镇调查失业率':['调查失业率','失业人口','失业人口 + 就业人口']};
function drawFormula(c){const host=$('formula');host.replaceChildren();const f=formulas[c.label];if(!f)return;const box=make('div','','formula');box.append(make('small','计算公式'));const eq=make('div','','equation');eq.setAttribute('aria-label',f[0]+'等于（'+f[1]+'）除以（'+f[2]+'）乘以百分之百');const frac=make('span','','frac');frac.append(make('span',f[1]),make('span',f[2]));eq.append(make('span',f[0]+' ='),frac,make('span','× 100%'));box.append(eq);host.append(box)}
function renderArticle(){
 const c=byId.get(id);$('article').hidden=!c;$('pager').hidden=!c;$('empty').hidden=!!c;
 if(!c){$('empty-title').textContent=onlySaved&&!modeSaved()?'还没有收藏':'没有匹配的条目';$('empty-message').textContent=onlySaved&&!modeSaved()?'在当前目录打开一条内容，点击「收藏」即可在这里重读。':'试试缩短关键词，或切换到其他主题。';return}
 $('title').textContent=c.label;$('read-topic').textContent=c.topic;$('basis').textContent=c.basis;updateBookmark();
 let text=c.text;const lines=text.split('\n');const label=lines[0].trim().replace(/^\d+[.．、]\s*/,'').replace(/^[一二三四五六七八九十]+、/,'');
 if(lines.length>1&&[norm(c.label),norm(c.label.split(' · ').at(-1))].includes(norm(label)))text=lines.slice(1).join('\n');
 $('recall').hidden=c.kind==='skill';showReading(true);paragraphs($('body'),text,c.label);drawFormula(c);
 $('thumb').src=c.thumb;$('source-name').textContent=c.paper.replace(/\.pdf$/i,'');$('source-page').textContent='来源第 '+range(c.source.first,c.source.last)+' 页';$('source-link').href=fileUrl(c.source);
 $('practice').hidden=c.kind!=='skill';
 if(c.kind==='skill')renderTraining(c);
 const mh=$('mentions');mh.hidden=false;mh.replaceChildren();const linked=make('a','在知识库中查看关联真题 →');linked.href='index.html#source-'+c.id;mh.append(linked);if(c.mentions.length){const d=make('details');d.append(make('summary','题干提及此术语（'+c.mentions.length+'）'));const ul=make('ul');for(const qid of c.mentions){const a=make('a',qid.replace('#',' · 第 ')+' 题');a.href='search.html?qid='+encodeURIComponent(qid);a.target='_blank';a.rel='noopener';const li=make('li');li.append(a);ul.append(li)}d.append(ul);mh.append(d)}
 const n=visible.findIndex(k=>k.id===id);$('prev').disabled=n<=0;$('next').disabled=n===visible.length-1;$('position').textContent=(n+1)+' / '+visible.length;
}
function appendFigures(host,section,alt){
 for(const c of section?.clips||[]){
  const img=make('img','','figure');img.src='assets/figures/'+c.file;img.alt=alt+'（原卷第 '+c.src[1]+' 页）';
  img.width=Math.ceil((c.box[2]-c.box[0])*4/3);img.height=Math.ceil((c.box[3]-c.box[1])*4/3);img.style.height='auto';img.loading='lazy';img.decoding='async';host.append(img);
 }
}
function currentQuestion(c){return selectedPractice.get(c.id)||c.groups[0].questions[0]}
function showQuestion(c,qid){selectedPractice.set(c.id,qid);renderTraining(c)}
function renderTraining(c){
 const active=currentQuestion(c),host=$('groups');host.replaceChildren();
 const all=c.groups.flatMap(g=>g.questions);
 $('practice-progress').textContent=c.groups.length+' 组 · '+all.length+' 题 · 已作答 '+all.filter(k=>attempts.get(k)?.submitted).length+' 题';
 for(const [g,group] of c.groups.entries()){
  const section=make('section','','group');section.append(make('h4','第 '+(g+1)+' 组 · '+group.label));
  for(const [i,qid] of group.questions.entries()){
   const q=data.practice[qid],done=attempts.get(qid)?.submitted;
   const b=make('button',(done?'✓ ':'')+(i+1)+'. '+q.label,'practice-pick');
   b.type='button';b.dataset.qid=qid;b.setAttribute('aria-pressed',String(qid===active));b.onclick=()=>showQuestion(c,qid);section.append(b)
  }
  host.append(section);
 }
 exercise(c,active,all);
}
function exercise(c,qid,all){
 const q=data.practice[qid],host=$('exercise');host.replaceChildren();
 let a=attempts.get(qid);
 if(!a){a={pick:'',draft:'',submitted:false};attempts.set(qid,a)}
 const caption=make('div','','practice-caption');caption.append(make('small',q.origin,'topic-pill'),make('strong',q.label));
 if(!q.source)caption.append(make('small','材料来自'+q.paper+'，题干与参考写法为改编内容。','tiny'));
 host.append(caption);
 const parts=q.source?window.kbQuestionFigures.questions[qid]||{}:{};
 for(const m of q.materials){
  const art=window.kbQuestionFigures.materials[q.paper+'|'+m.label];
  const d=make('details','','ex-material');d.open=!!art;d.append(make('summary','阅读'+m.label));
  if(!art?.inline){const v=make('div','','prose');paragraphs(v,m.text);d.append(v);}
  appendFigures(d,art,m.label);
  d.append(pdfLink(m.source,'查看材料原页'));host.append(d)
 }
 if(!parts.stem?.inline){const stem=make('div','','prose');paragraphs(stem,q.stem.trim());host.append(stem);}
 appendFigures(host,parts.stem,'原卷题图');
 const submit=make('button',q.key?'核对答案':'对照参考写法','primary');submit.type='button';
 if(q.key){
  for(const [letter,text] of q.options){
   const lab=make('label','','option'),input=make('input');input.type='radio';input.name='practice-answer';input.value=letter;
   input.checked=a.pick===letter;input.disabled=a.submitted;
   input.onchange=()=>{a.pick=letter;submit.disabled=false;persist()};
   const art=parts[letter],body=make('span',letter+'　'+(art?.inline||text===letter?'':pdfReadingText(text)));
   appendFigures(body,art,letter+' 项');lab.append(input,body);host.append(lab)
  }
 }else{
  const label=make('label','我的作答');label.htmlFor='essay-draft';
  const ta=make('textarea');ta.id='essay-draft';ta.rows=5;ta.value=a.draft;ta.readOnly=a.submitted;
  ta.oninput=()=>{a.draft=ta.value;submit.disabled=!a.draft.trim();persist()};host.append(label,ta)
 }
 const actions=make('div','','q-actions');actions.style.gap='12px';
 submit.disabled=q.key?!a.pick:!a.draft.trim();submit.hidden=a.submitted;
 submit.onclick=()=>{a.submitted=true;persist();renderTraining(c)};
 actions.append(submit);if(q.source)actions.append(pdfLink(q.source,'查看原题'));host.append(actions);
 if(!a.submitted)return;
 const result=make('div','','ex-result');result.setAttribute('aria-live','polite');
 result.append(make('strong',q.key?(a.pick===q.key?'答对了 · '+q.key:'你选了 '+a.pick+'，参考答案为 '+q.key):(q.source?'原卷参考答案':'改编题参考写法')));
 const d=make('details');d.open=!q.key;d.append(make('summary',q.key?'查看参考解析':'对照要点与行文'));
 const v=make('div','','prose');if(q.source)paragraphs(v,q.answer.text);else v.append(make('p',q.answer.text,'ref-text'));
 d.append(v);if(q.answer.source)d.append(pdfLink(q.answer.source,'查看解析原页'));result.append(d);host.append(result);
 const controls=make('div','','q-actions'),retry=make('button','重新作答','plain-btn');
 retry.type='button';retry.onclick=()=>{attempts.delete(qid);persist();renderTraining(c)};controls.append(retry);
 const next=all[all.indexOf(qid)+1];
 if(next){const b=make('button','下一道同类题','primary');b.type='button';b.onclick=()=>{showQuestion(c,next);$('groups').scrollIntoView({block:'start'})};controls.append(b)}
 host.append(controls);
}
updateMode();refresh();
</script></body></html>
