<script id="reader-data" type="application/json">{"cards":[{"kind":"knowledge","id":"4cff6b03289e95d8","topic":"历史常识","label":"辛亥革命的历史影响","basis":"时政汇编中的史实","paper":"2027年国省考时政热点考前大盘点.pdf","text":"1911 年辛亥革命爆发，推翻了清王\n朝统治，结束了在中国延续两千多年的君主专制制度，是中华民族伟大复兴征程上的一座里程\n碑。","source":{"doc":"4e539a366dce19555ccf","first":32,"last":32,"page":32,"file":"2027年国省考时政热点考前大盘点.pdf"},"thumb":"assets/thumbs/449339144b879d9d204e796c435aa36f8cbad602b503efa3ad56913038c3af57.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"56eb3c6aec7cfe6b","topic":"历史常识","label":"台湾光复与台北受降典礼","basis":"时政汇编中的史实","paper":"2027年国省考时政热点考前大盘点.pdf","text":"1945 年 10 月\n25 日，中国战区台湾省受降典礼在台北举行，台湾及澎湖列岛正式重归中国主权管辖之下，\n结束了台湾被日本殖民统治 50 年的历史。","source":{"doc":"4e539a366dce19555ccf","first":32,"last":32,"page":32,"file":"2027年国省考时政热点考前大盘点.pdf"},"thumb":"assets/thumbs/449339144b879d9d204e796c435aa36f8cbad602b503efa3ad56913038c3af57.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"ad0c15674719fa64","topic":"马克思主义哲学","label":"总论 · 哲学的含义","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、哲学的含义\n哲学是系统化、理论化的世界观，是世界观和方法论的统一。","source":{"doc":"3ccc56f4000d1642c2d1","first":1,"last":1,"page":1,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/c20844e9f26153606663ad360c45f1803e43d5d98573818284d8fd46a8f3dc4b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5cec7f58a6753672","topic":"马克思主义哲学","label":"总论 · 哲学的基本问题","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、哲学的基本问题\n哲学的基本问题是思维和存在的关系问题。这个问题包括以下两个方面：\n第一方面：思维和存在何者是本原的问题，即何者是第一性的问题。对这个问题的不同\n回答，是划分唯物主义和唯心主义两大派别的唯一标准。\n唯物主义认为世界的本原是物质，物质第一性；唯心主义认为世界的本原是意识，意识\n第一性。\n第二方面：思维和存在有无同一性的问题，即人的思维能否正确认识存在的问题。根据\n对这个问题的不同回答，可以将哲学划分为可知论和不可知论。\n（粉笔敲黑板：本考点重点在于区分唯物主义与唯心主义，考试极有可能给一段事例、\n讲话或者古语，要求辨析体现的是唯物主义还是唯心主义）","source":{"doc":"3ccc56f4000d1642c2d1","first":1,"last":1,"page":1,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/c20844e9f26153606663ad360c45f1803e43d5d98573818284d8fd46a8f3dc4b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"44d62ac04bfed395","topic":"马克思主义哲学","label":"唯物论 · 物质","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、物质\n1.物质是标志客观实在的哲学范畴，物质的唯一特性是客观实在性。\n2.物质的根本属性和存在方式是运动。\n（粉笔敲黑板：注意区分物质的唯一特性和根本属性分别对应的内容）\n物质和运动是不可分割的，物质是运动着的物质，运动是物质的运动。\n静止是一种特殊的运动。\n世界上一切事物的存在和发展都是绝对运动和相对静止的统一。\n（粉笔敲黑板：此处常见的考法是题干给出古语或材料，问题干是否体现了绝对运动和\n相对静止的统一。因此，大家需要储备一些常见的古语，例如： ①年年岁岁花相似，岁岁\n年年人不同； ②风定花犹落，鸟鸣山更幽）","source":{"doc":"3ccc56f4000d1642c2d1","first":1,"last":2,"page":1,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/c20844e9f26153606663ad360c45f1803e43d5d98573818284d8fd46a8f3dc4b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"177ce0d26f22cba6","topic":"马克思主义哲学","label":"唯物论 · 意识的本质","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、意识的本质\n人脑对客观存在的主观映象。\n意识是人脑特有的机能。人脑是产生意识的物质器官。\n（粉笔敲黑板：是人脑而非大脑）","source":{"doc":"3ccc56f4000d1642c2d1","first":2,"last":2,"page":2,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/aa6a9c3b0e153e59ee449a5970730e20c8ebca0e0bce4ca246c4e08cc1dd2bb3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8c16fff9f9ff2785","topic":"马克思主义哲学","label":"唯物论 · 物质和意识的辩证关系和方法论要求","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、物质和意识的辩证关系和方法论要求\n辩证关系：物质决定意识；意识对物质具有反作用。\n方法论：一切从实际出发；在尊重客观规律的基础上，充分发挥人的主观能动性。","source":{"doc":"3ccc56f4000d1642c2d1","first":2,"last":2,"page":2,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/aa6a9c3b0e153e59ee449a5970730e20c8ebca0e0bce4ca246c4e08cc1dd2bb3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"3112b0a4ec0af017","topic":"马克思主义哲学","label":"辩证法 · 两大特征","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、两大特征\n1.联系\n（1）含义：联系是指一切事物之间和事物内部各要素之间的相互依赖、相互影响、相\n互制约和相互作用。\n（2）特征：普遍性、客观性、多样性、条件性。\n（粉笔敲黑板：本考点重点要做好对四个特征的区分，常结合案例考查体现或违背联系\n的某个特征）\n（3）整体和部分的关系\n整体对部分起支配、统率、决定的作用。\n部分影响整体，关键部分对整体起决定性作用。\n整体是各个部分的有机结合，整体具有部分所没有的新功能。\n2.发展\n（1）含义：发展是前进的、上升的运动。\n（2）实质：发展的实质是新事物的产生和旧事物的灭亡。\n新旧事物区别的根本标志：是否同事物发展的必然趋势相符合。\n（粉笔敲黑板：判断一个事物是新事物还是旧事 物，并不取决于其形式的新旧与出现\n时间的先后）\n3.联系和发展具有规律性\n规律是客观存在的，是不以人的意志为转移的。","source":{"doc":"3ccc56f4000d1642c2d1","first":2,"last":3,"page":2,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/aa6a9c3b0e153e59ee449a5970730e20c8ebca0e0bce4ca246c4e08cc1dd2bb3.jpg","mentions":["江苏 2023 B类 行测#34"],"groups":[]},{"kind":"knowledge","id":"c394cdef1420fc60","topic":"马克思主义哲学","label":"辩证法 · 三大规律","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、三大规律\n1.对立统一规律\n（1）含义：对立统一规律是唯物辩证法的实质和核心；对立统一规律揭示了事物发展\n的源泉和动力。\n（2）矛盾的基本属性\n同一性是指矛盾双方相互依存、相互贯通，在一定条件下可以相互转化。\n斗争性是指矛盾双方相互排斥的属性，体现着对立双方相互分离的倾向和趋势。\n（3）矛盾的普遍性和特殊性\n矛盾的普遍性是指时时有矛盾、事事有矛盾，矛盾的普遍性要求我们运用矛盾分析法分\n析一切事物。\n矛盾的特殊性是指具体事物包含的矛盾以及每一矛盾的各个方面都有其特点，矛盾的特\n殊性要求我们要具体问题具体分析。\n（粉笔敲黑板：通俗来讲，普遍性强调的是“都有”，特殊性强调的是“不一样”\n）\n（4）矛盾的不平衡性\n①主要矛盾和次要矛盾\n主要矛盾是指在诸多矛盾中处于支配地位、对事物发展起决定作用的矛盾；次要矛盾是\n指处于从属地位、对事物发展不起决定作用的矛盾。\n②矛盾的主要方面和次要方面\n矛盾的主要方面是一个矛盾中处于支配地位、起主导作用的方面；矛盾的次要方面是处\n于被支配地位的方面。\n矛盾发展的不平衡性要求我们做到两点论和重点论的统一。\n（4）内因和外因的关系\n内因是事物变化发展的根据和第一位原因。\n外因是事物变化发展的条件，外因通过内因起作用。\n事物的发展是内外因共同作用的结果。\n（粉笔敲黑板：对立统一规律属于马克思主义哲学中的重要考点，要求能够理解相关哲\n学原理，且能够通过选项案例判断哲理是否对应正确）\n2.质量互变规律\n质量互变规律揭示了事物发展的形式和状态。\n辩证关系：量变是质变的前提和必要准备；质变是量变的必然结果。\n方法论：坚持适度原则；重视量的积累；不失时机地促成质变，实现事物的飞跃。\n3.否定之否定规律\n否定之否定规律揭示了事物发展的方向和道路。\n任何事物的发展都要经历“肯定→否定→否定之否定”的过程。\n事物的发展是前进性和曲折性的统一。\n（粉笔敲黑板：本考点主要结合古语和案例考查，“前进性”强调的是方向美好，曲折\n性强调的是“道路曲折”）","source":{"doc":"3ccc56f4000d1642c2d1","first":3,"last":5,"page":3,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/5140396ec24fbf2d68fb728af38ae7fa7827cb349c52c0f5fd6988b6a27c6974.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"e1b6cab861af4ddb","topic":"马克思主义哲学","label":"认识论 · 实践","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、实践\n含义：实践是人类能动地改造世界的客观物质活动。\n特征：客观物质性、直接现实性、自觉能动性、社会历史性。\n基本形式：生产实践、社会实践、科学实验。","source":{"doc":"3ccc56f4000d1642c2d1","first":5,"last":5,"page":5,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/743049929fd6fb026373645824b7fd42106b5a184f24bceab1252783ce0c1a35.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"212adcd5dd01c1e7","topic":"马克思主义哲学","label":"认识论 · 认识过程的两个阶段","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、认识过程的两个阶段\n感性认识和理性认识。感性认识包括感觉、知觉和表象三种形式，是认识的低级阶段。\n理性认识包括概念、判断和推理三种形式，是认识的高级阶段。\n认识的过程是从感性认识到理性认识，再从理性认识到实践的两次飞跃。","source":{"doc":"3ccc56f4000d1642c2d1","first":5,"last":5,"page":5,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/743049929fd6fb026373645824b7fd42106b5a184f24bceab1252783ce0c1a35.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f2ae00df7a78f44c","topic":"马克思主义哲学","label":"认识论 · 实践和认识的辩证关系","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、实践和认识的辩证关系\n实践决定认识：实践是认识的来源；实践是认识发展的动力；实践是认识的目的和归宿；\n实践是检验认识真理性的唯一标准。\n认识反作用于实践：科学的认识对实践起促进作用，错误的认识对实践起阻碍作用。\n(粉笔敲黑板：在考试中，\n“实践是认识的唯一途径”经常被设计为干扰选项，考生需高\n度注意， 这个表述本身就是错误的）","source":{"doc":"3ccc56f4000d1642c2d1","first":5,"last":5,"page":5,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/743049929fd6fb026373645824b7fd42106b5a184f24bceab1252783ce0c1a35.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"626c91234ca39205","topic":"马克思主义哲学","label":"历史唯物主义 · 社会存在和社会意识的辩证关系","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、社会存在和社会意识的辩证关系\n社会存在决定社会意识；\n社会意识对社会存在具有反作用；\n社会意识具有相对独立性。","source":{"doc":"3ccc56f4000d1642c2d1","first":5,"last":6,"page":5,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/743049929fd6fb026373645824b7fd42106b5a184f24bceab1252783ce0c1a35.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9e62b2622b12e9cc","topic":"马克思主义哲学","label":"历史唯物主义 · 社会的基本矛盾","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、社会的基本矛盾\n社会基本矛盾包括两方面，即生产力和生产关系之间的矛盾、经济基础和上层建筑之间\n的矛盾。\n生产力决定生产关系。生产关系反作用于生产力。生产关系对生产力反作用的性质取决\n于生产关系是否适应生产力的状况。\n◎粉笔拓展\n2023 年 9 月，习近平总书记在黑龙江考察调研期间首次提到“新质生产力”。\n新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、\n高效能、高质量特征，符合新发展理念的先进生产力质态。它由技术革命性突破、生产要素\n创新性配置、产业深度转型升级而催生，以劳动者、劳动资料、劳动对象及其优化组合的跃\n升为基本内涵，以全要素生产率大幅提升为核心标志，特点是创新，关键在质优，本质是先\n进生产力。\n经济基础决定上层建筑。上层建筑反作用于经济基础，这种反作用集中体现在为自己的\n经济基础服务。\n（粉笔敲黑板：明确社会基本矛盾包括什么，其次做题时注意判断这两方面矛盾贯穿于\n社会发展的始终，并不能进行消除）","source":{"doc":"3ccc56f4000d1642c2d1","first":6,"last":6,"page":6,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/978e9babfd3cea7558be30e49b871ab740a7de1ac96c4e3f4e66bad4e70c4ded.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9ec7d9223ff326b6","topic":"马克思主义哲学","label":"历史唯物主义 · 社会发展的动力","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、社会发展的动力\n社会基本矛盾是社会发展的根本动力；\n阶级斗争是阶级社会发展的直接动力；\n改革是社会发展的重要动力；\n科技革命是推动社会发展的强大杠杆。","source":{"doc":"3ccc56f4000d1642c2d1","first":6,"last":7,"page":6,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/978e9babfd3cea7558be30e49b871ab740a7de1ac96c4e3f4e66bad4e70c4ded.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"d684a6870c190aec","topic":"马克思主义哲学","label":"历史唯物主义 · 人民群众是历史的主体和创造者","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"四、人民群众是历史的主体和创造者\n人民群众是社会物质财富的创造者；\n人民群众是社会精神财富的创造者；\n人民群众是实现社会变革的决定力量。\n（粉笔敲黑板：记忆人民群众对历史的作用都有哪些方面，做题时注意判断选项正误）","source":{"doc":"3ccc56f4000d1642c2d1","first":7,"last":7,"page":7,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/20b9a1252e9771c51d215c7bd9dfb0f35bc724079a93f1b525ba1889dc5fb0d6.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8c2bf41475ff9995","topic":"马克思主义政治经济学","label":"商品经济理论 · 商品","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、商品\n商品是用来交换的能满足人们某种需要的劳动产品，具有使用价值和价值两种属性。\n1.使用价值：能满足人们某种需要的物品的效用，即物品的有用性。这是商品本身就有、\n天生自带的属性，叫作自然属性。\n2.价值：凝结在商品中的无差别的人类劳动。是商品的社会属性。\n3.商品二因素之间的关系\n统一性：作为一个商品，必须同时拥有使用价值和价值，其中使用价值是价值的物质承\n担者，没有使用价值的物品则没有价值，价值寓于使用价值之中。\n对立性：生产者只能让渡商品的使用价值来获得其价值，而消费者要让渡商品的价值来\n获得其使用价值，故二者相互排斥，不可兼得。\n（粉笔敲黑板：通过关键词理解商品的含义，区分价值和使用价值）","source":{"doc":"3ccc56f4000d1642c2d1","first":8,"last":8,"page":8,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/756bb88d37877a64c0ddb0ca516166ecec29f53b94a377dc5db74b4a7ad1f16b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8b483b708f211e74","topic":"马克思主义政治经济学","label":"商品经济理论 · 劳动二重性","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、劳动二重性\n商品是劳动产品，生产商品的劳动可区分为具体劳动和抽象劳动。\n1.具体劳动：各种形式的有用劳动，生产使用价值。\n2.抽象劳动：无差别的人类劳动，形成价值实体。","source":{"doc":"3ccc56f4000d1642c2d1","first":8,"last":8,"page":8,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/756bb88d37877a64c0ddb0ca516166ecec29f53b94a377dc5db74b4a7ad1f16b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"14620c148b758944","topic":"马克思主义政治经济学","label":"商品经济理论 · 商品价值量","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、商品价值量\n商品的价值量是指商品价值的大小，是由社会必要劳动时间决定的。\n单位商品的价值量与生产该商品的社会必要劳动时间成正比，与社会劳动生产率成反比。","source":{"doc":"3ccc56f4000d1642c2d1","first":8,"last":8,"page":8,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/756bb88d37877a64c0ddb0ca516166ecec29f53b94a377dc5db74b4a7ad1f16b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9797b4728bd5c89f","topic":"马克思主义政治经济学","label":"商品经济理论 · 价值规律","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"四、价值规律\n1.基本内容：价值规律是商品经济的基本规律。它的基本内容是：商品的价值量由生产\n该商品的社会必要劳动时间决定；商品交换以价值量为基础实行等价交换。\n2.表现形式：价格围绕价值上下波动。","source":{"doc":"3ccc56f4000d1642c2d1","first":9,"last":9,"page":9,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/806c49197e002226d22b17f0774183676f92a047ac8bb2c1d2a78cecfac6ef99.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"db4a7e019f79c6eb","topic":"马克思主义政治经济学","label":"商品经济理论 · 货币的含义和职能","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"五、货币的含义和职能\n1.含义：货币是在长期交换过程中形成的固定地充当一般等价物的特殊商品。\n2.职能：价值尺度（不需要现实的货币，只需要观念上的货币，常见形式为标价）、流\n通手段（币充当商品交换的媒介）、支付手段（赊购赊销）、贮藏手段（必须是足值的金属货\n币或金属条块）、世界货币。其中价值尺度和流通手段是货币的两种最基本职能。\n（粉笔敲黑板：区分并记忆货币的五大职能，考试中给相关案例需要区分出体现的是货\n币的哪个职能）","source":{"doc":"3ccc56f4000d1642c2d1","first":9,"last":9,"page":9,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/806c49197e002226d22b17f0774183676f92a047ac8bb2c1d2a78cecfac6ef99.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"71cb8452916f2c46","topic":"马克思主义政治经济学","label":"剩余价值理论 · 剩余价值","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、剩余价值\n1.含义：剩余价值是雇佣工人所创造的并被资本家无偿占有的超过劳动力价值的那部分\n价值。\n2.生产方法：绝对剩余价值是指在必要劳动时间不变的条件下，通过延长工作时间所获\n得的剩余价值；\n相对剩余价值是指在工作时间不变的条件下，由于缩短必要劳动时间而相对延长剩余劳\n动时间所生产的剩余价值。相对剩余价值是各个资本家追逐超额剩余价值而实现的。\n（超额剩余价值是指单个资本家通过提高劳动生产率使商品的个别价值低于社会价值\n而比一般资本家多得的那部分价值。）\n（粉笔敲黑板：理解并能够区分绝对剩余价值、相对剩余价值和超额剩余价值）","source":{"doc":"3ccc56f4000d1642c2d1","first":9,"last":9,"page":9,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/806c49197e002226d22b17f0774183676f92a047ac8bb2c1d2a78cecfac6ef99.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"33f9e33191c8bd04","topic":"马克思主义政治经济学","label":"剩余价值理论 · 资本","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、资本\n资本在资本主义生产过程中以生产资料和劳动力两种形态存在。根据这两部分资本在剩\n余价值生产中所起的不同作用，可将资本分为不变资本和可变资本。\n不变资本，是指以生产资料形态存在的那部分资本，其价值在生产过程中一次或多次转\n移到新产品中去，不会发生增殖。\n可变资本，是指以劳动力价值形态存在的那部分资本，在生产过程中可以使价值增殖。\n可变资本只有劳动力。\n（粉笔敲黑板：明确不变资本和可变资本以什么形态存在，会不会产生增殖）","source":{"doc":"3ccc56f4000d1642c2d1","first":10,"last":10,"page":10,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/35dfea41036c42ec1ea0ba131f62bfa479ff0ec2e55843b16f2f71b728211661.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"78cbd99234fbb2c0","topic":"马克思主义政治经济学","label":"剩余价值理论 · 资本积累的含义和实质","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、资本积累的含义和实质\n1.含义：资本积累就是剩余价值的资本化。把榨取的剩余价值作为资本再次投入生产，\n可以给资本家带来更多的剩余价值，简单理解就是“钱生钱”的过程。\n2.实质：资本积累的实质是资本家通过无偿占有工人劳动的一部分，来扩大无偿占有工\n人劳动的权力。","source":{"doc":"3ccc56f4000d1642c2d1","first":10,"last":10,"page":10,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/35dfea41036c42ec1ea0ba131f62bfa479ff0ec2e55843b16f2f71b728211661.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"76a25bf74326334c","topic":"马克思主义政治经济学","label":"剩余价值理论 · 经济危机","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"四、经济危机\n根本原因：资本主义经济危机爆发的根本原因，在于资本主义固有的基本矛盾，即生产\n资料资本主义私人占有和生产社会化之间的矛盾。\n本质特征：生产相对过剩。","source":{"doc":"3ccc56f4000d1642c2d1","first":10,"last":10,"page":10,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/35dfea41036c42ec1ea0ba131f62bfa479ff0ec2e55843b16f2f71b728211661.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"029304ab608f49e2","topic":"科学社会主义","label":"社会主义的产生和发展 · 空想社会主义的进步性和局限性","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、空想社会主义的进步性和局限性\n19 世纪初期以圣西门、傅立叶、欧文为代表的空想社会主义是科学社会主义的直接思\n想来源。\n1.空想社会主义的进步性：\n（1）在理论上致力于社会制度的分析；\n（2）对资本主义旧制度的批判包含着许多击中要害的见解；\n（3）对社会主义新制度的描绘，闪烁着诸多天才的火花。\n2.空想社会主义的局限性：\n（1）看到了资本主义必然灭亡的命运，却未能揭示资本主义必然灭亡的经济根源；\n（2）要求埋葬资本主义，却看不到埋葬资本主义的力量；\n（3）憧憬取代资本主义的理想社会，却找不到通往理想社会的现实道路。","source":{"doc":"3ccc56f4000d1642c2d1","first":11,"last":11,"page":11,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/11b2a7c96cc909b388e0f353583fbffe593561f3cc14c056b92113fb829cc36e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"763ab0bec449c368","topic":"科学社会主义","label":"社会主义的产生和发展 · 科学社会主义的创立","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、科学社会主义的创立\n马克思和恩格斯在新的历史条件下创立了唯物史观和剩余价值学说，揭示了人类历史发\n展的奥秘和资本主义剥削的秘密，论证了无产阶级的历史使命，把争取无产阶级和全人类解\n放的斗争建立在社会发展客观规律的基础上，从而超越了空想社会主义，创立了科学社会主\n义。\n1848 年 2 月，《共产党宣言》的发表标志着科学社会主义的产生。","source":{"doc":"3ccc56f4000d1642c2d1","first":11,"last":11,"page":11,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/11b2a7c96cc909b388e0f353583fbffe593561f3cc14c056b92113fb829cc36e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9e894341679ad7f0","topic":"科学社会主义","label":"社会主义的产生和发展 · 社会主义制度对人类历史发展的巨大贡献","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"三、社会主义制度对人类历史发展的巨大贡献\n1.社会主义开始作为一种新的社会制度发挥出历史作用。\n2.社会主义国家的存在及其在经济、政治、外交、军事上的影响，改变了世界的政治格\n局，在很大程度上遏制了资本主义和霸权主义在全世界的扩张。\n3.社会主义力量坚定地支持被压迫民族和被压迫人民，推动着世界和平与发展的时代潮\n流。\n4.社会主义在当代引导着世界人民的前进方向。","source":{"doc":"3ccc56f4000d1642c2d1","first":11,"last":12,"page":11,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/11b2a7c96cc909b388e0f353583fbffe593561f3cc14c056b92113fb829cc36e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"2ff92042ed2ab285","topic":"科学社会主义","label":"科学社会主义的基本原则 · 科学社会主义基本原则的主要内容","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、科学社会主义基本原则的主要内容\n1.人类社会发展规律和资本主义基本矛盾是“资本主义必然灭亡、社会主义必然胜利的”\n根本依据。\n2.无产阶级是最先进最革命的阶级，肩负着推翻资本主义旧世界、建立社会主义和共产\n主义新世界的历史使命。\n3.无产阶级革命是无产阶级进行斗争的最高形式，以建立无产阶级专政的国家为目的。\n4.在生产资料公有制基础上组织生产，满足全体社会成员的需要是社会主义生产的根本\n目的。\n5.对社会生产进行有计划的指导和调节，实行等量劳动领取等量产品的按劳分配原则。\n6.社会主义社会要合乎自然规律地改造和利用自然，努力实现人与自然的和谐共生。\n7. 社会主义必须坚持科学理论指导，发展先进文化。\n8.无产阶级政党是无产阶级的先锋队，社会主义事业必须始终坚持无产阶级政党的领导。\n9.通过无产阶级专政和社会主义高度发展，最终实现向消灭阶级、消灭剥削、实现人的\n而自由发展的共产主义社会的过渡。","source":{"doc":"3ccc56f4000d1642c2d1","first":12,"last":12,"page":12,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/cdfada1b4953590e1aa799515b9b37fcc5128c65241d4856bef86aa0cedbf0eb.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"e74b6f6eccbb2cb5","topic":"科学社会主义","label":"科学社会主义的基本原则 · 正确把握科学社会主义的基本原则","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、正确把握科学社会主义的基本原则\n1.作为无产阶级政党理论与实践的基本准则，科学社会主义基本原则指出了社会主义的\n发展方向和本质规定，任何时候都不能违背。\n2.科学社会主义基本原则揭示了未来社会的发展过程、发展方向的一般特征，在实践中\n不能僵化地教条地对待它。","source":{"doc":"3ccc56f4000d1642c2d1","first":12,"last":13,"page":12,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/cdfada1b4953590e1aa799515b9b37fcc5128c65241d4856bef86aa0cedbf0eb.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5cf247789ac94b5b","topic":"科学社会主义","label":"在实践中探索社会主义发展的一般规律 · 社会主义发展道路的多样性","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"一、社会主义发展道路的多样性\n1.各个国家的生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特\n点。\n2.历史文化传统的差异性是造成社会主义发展道路多样性的重要条件。\n3.时代和实践的不断发展，是造成社会主义发展道路多样性的现实原因。","source":{"doc":"3ccc56f4000d1642c2d1","first":13,"last":13,"page":13,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/33a3de8199fd89fb558123a0d4e5a39a4cf280a1c6a13167242136a9a8d03a2f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"302f10aea9c05f59","topic":"科学社会主义","label":"在实践中探索社会主义发展的一般规律 · 社会主义在实践探索中曲折前进","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"二、社会主义在实践探索中曲折前进\n1.社会主义作为新生事物，其成长不会一帆风顺。\n2.社会主义社会的基本矛盾推动社会发展，是作为一个过程而展开的，人们对它的认识\n也有一个逐渐发展的过程。\n3.经济全球化对于社会主义的发展既有机遇又有挑战。","source":{"doc":"3ccc56f4000d1642c2d1","first":13,"last":13,"page":13,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/33a3de8199fd89fb558123a0d4e5a39a4cf280a1c6a13167242136a9a8d03a2f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"96042e2e2eb458e7","topic":"新时代中国特色社会主义思想","label":"地位、形成与发展","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，\n是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃。习近平同志是习近\n平新时代中国特色社会主义思想的主要创立者。\n党的十九大把习近平新时代中国特色社会主义思想确立为我们党必须长期坚持的指导\n思想，并在党章中把习近平新时代中国特色社会主义思想确立为党的行动指南，将这一思想\n的核心内容概括为“八个明确”“十四个坚持”。\n党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》，\n用“十个明确”对习近平新时代中国特色社会主义思想的核心内容作了进一步概括，并从十\n三个方面分领域总结成就、概括原创性理念和思想，提出“两个确立”重要论断：确立习近\n平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地\n位。\n党的十九大、十九届六中全会提出的“十个明确”、“十四个坚持”、\n“十三个方面成就”\n概括了习近平新时代中国特色社会主义思想的主要内容。\n党的二十大提出“六个必须坚持”\n，概括阐述了习近平新时代中国特色社会主义思想的\n世界观、方法论和贯穿其中的立场观点方法。","source":{"doc":"3ccc56f4000d1642c2d1","first":14,"last":14,"page":14,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/0cce8b0abc2ef7360dedf6ad5dd4ae16dd9fb7b9d7e715ee1ae78c2d0ddb2937.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a0c146865ffe032b","topic":"新时代中国特色社会主义思想","label":"十个明确","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.明确中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最\n大优势是中国共产党领导，中国共产党是最高政治领导力量，全党必须增强“四个意识”、\n坚定“四个自信”、做到“两个维护”；\n◎粉笔拓展\n“四个意识”是指政治意识、大局意识、核心意识、看齐意识；“四个自信”即中国特\n色社会主义道路自信、理论自信、制度自信、文化自信；“两个维护”是中国共产党的最高\n政治原则和根本政治规矩，是指坚决维护习近平总书记党中央的核心、全党的核心地位，坚\n决维护以习近平同志为核心的党中央权威和集中统一领导。\n2.明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复\n兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社\n会主义现代化强国，以中国式现代化推进中华民族伟大复兴；\n3.明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发\n展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发\n展、全体人民共同富裕取得更为明显的实质性进展；\n4.明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、\n生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面深化改革、全面依\n法治国、全面从严治党四个全面；\n5.明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和\n治理能力现代化；\n6.明确全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治\n国家；\n7.明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更\n好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加\n快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统\n筹发展和安全；\n8.明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，\n把人民军队建设成为世界一流军队；\n9.明确中国特色大国外交要服务民族复兴、促进人类进步，推动建设新型国际关系，推\n动构建人类命运共同体；\n10.明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建\n设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗\n争，落实管党治党政治责任，以伟大自我革命引领伟大社会革命。","source":{"doc":"3ccc56f4000d1642c2d1","first":14,"last":16,"page":14,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/0cce8b0abc2ef7360dedf6ad5dd4ae16dd9fb7b9d7e715ee1ae78c2d0ddb2937.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b15007b5024adbae","topic":"新时代中国特色社会主义思想","label":"十四个坚持","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.坚持党对一切工作的领导。党政军民学，东西南北中，党是领导一切的。\n2.坚持以人民为中心。人民是历史的创造者，是决定党和国家前途命运的根本力量。\n3.坚持全面深化改革。只有社会主义才能救中国，只有改革开放才能发展中国、发展社\n会主义、发展马克思主义。\n4.坚持新发展理念。发展是解决我国一切问题的基础和关键，发展必须是科学发展，必\n须坚定不移贯彻创新、协调、绿色、开放、共享的发展理念。\n5.坚持人民当家作主。坚持党的领导、人民当家作主、依法治国有机统一是社会主义政\n治发展的必然要求。\n6.坚持全面依法治国。全面依法治国是中国特色社会主义的本质要求和重要保障。\n7.坚持社会主义核心价值体系。文化自信是一个国家、一个民族发展中更基本、更深沉、\n更持久的力量。\n8.坚持在发展中保障和改善民生。增进民生福祉是发展的根本目的。\n9.坚持人与自然和谐共生。建设生态文明是中华民族永续发展的千年大计。\n10.坚持总体国家安全观。统筹发展和安全，增强忧患意识，做到居安思危，是我们党\n治国理政的一个重大原则。\n11.坚持党对人民军队的绝对领导。建设一支听党指挥、能打胜仗、作风优良的人民军\n队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。\n12.坚持“一国两制”和推进祖国统一。保持香港、澳门长期繁荣稳定，实现祖国完全\n统一，是实现中华民族伟大复兴的必然要求。\n13.坚持推动构建人类命运共同体。中国人民的梦想同各国人民的梦想息息相通，实现\n中国梦离不开和平的国际环境和稳定的国际秩序。\n14.坚持全面从严治党。勇于自我革命，从严管党治党，是我们党最鲜明的品格。","source":{"doc":"3ccc56f4000d1642c2d1","first":16,"last":17,"page":16,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/4386a59277af52c3bad9009e8a6dda052d358ad9a3f8cf5d94d463533f816410.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b1e90e5af2babd00","topic":"新时代中国特色社会主义思想","label":"六个必须坚持","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"必须坚持人民至上，必须坚持自信自立，必须坚持守正创新，必须坚持问题导向，必须\n坚持系统观念，必须坚持胸怀天下。","source":{"doc":"3ccc56f4000d1642c2d1","first":17,"last":17,"page":17,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/ab4482f36679f8f70def79fd483944e7184e92318be30aef1b4d97c445aa8b7f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"42a47d5d5bab1be1","topic":"新时代中国特色社会主义思想","label":"中国式现代化理论体系","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.中国式现代化 5 个方面的中国特色：\n第一，人口规模巨大的现代化。这是中国式现代化的显著特征。\n第二，全体人民共同富裕的现代化。这是中国式现代化的本质特征，也是区别于西方现\n代化的显著标志。\n第三，物质文明和精神文明相协调的现代化。既要物质富足、也要精神富有，是中国式\n现代化的崇高追求。\n第四，人与自然和谐共生的现代化。尊重自然、顺应自然、保护自然，促进人与自然和\n谐共生，是中国式现代化的鲜明特点。\n第五，走和平发展道路的现代化。坚持和平发展，在坚定维护世界和平与发展中谋求自\n身发展，又以自身发展更好维护世界和平与发展，推动构建人类命运共同体，是中国式现代\n化的突出特征。\n2.推进中国式现代化需要处理好若干重大关系\n一是顶层设计与实践探索的关系。二是战略与策略的关系。三是守正与创新的关系。四\n是效率与公平的关系。五是活力与秩序的关系。六是自立自强与对外开放的关系。","source":{"doc":"3ccc56f4000d1642c2d1","first":17,"last":18,"page":17,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/ab4482f36679f8f70def79fd483944e7184e92318be30aef1b4d97c445aa8b7f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f207988023f76a97","topic":"新时代中国特色社会主义思想","label":"经济思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2022 年 6 月，由中共中央宣传部、国家发展和改革委员会组织编写的《习近平经济思\n想学习纲要》，将习近平经济思想基本内容梳理归纳为十三个方面：\n（1）加强党对经济工作的全面领导是我国经济发展的根本保证；\n（2）坚持以人民为中心的发展思想是我国经济发展的根本立场；\n（3）进入新发展阶段是我国经济发展的历史方位；\n（4）坚持新发展理念是我国经济发展的指导原则；\n◎粉笔拓展\n新发展理念包括：创新、协调、绿色、开放、共享。其中，创新是引领发展的第一动力。\n协调是持续健康发展的内在要求。绿色是永续发展的必要条件和人民对美好生活追求的重要\n体现。开放是国家繁荣发展的必由之路。共享是中国特色社会主义的本质要求。\n（5）构建新发展格局是我国经济发展的路径选择；\n（6）推动高质量发展是我国经济发展的鲜明主题；\n（7）坚持和完善社会主义基本经济制度是我国经济发展的制度基础；\n（8）坚持问题导向部署实施国家重大发展战略是我国经济发展的战略举措；\n（9）坚持创新驱动发展是我国经济发展的第一动力；\n（10）大力发展制造业和实体经济是我国经济发展的主要着力点；\n（11）坚定不移全面扩大开放是我国经济发展的重要法宝；\n（12）统筹发展和安全是我国经济发展的重要保障；\n（13）坚持正确工作策略和方法是做好经济工作的方法论。","source":{"doc":"3ccc56f4000d1642c2d1","first":19,"last":20,"page":19,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/be1f1e1f67c3e3507bf81dbc18bc2e8a60151b1f0d44db8b18b02d91d4c1d947.jpg","mentions":["国考 2023 副省级 行测#5","国考 2023 地市级 行测#4"],"groups":[]},{"kind":"knowledge","id":"1910afb83c30fe28","topic":"新时代中国特色社会主义思想","label":"法治思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2020 年 11 月 16 日至 17 日，中央全面依法治国工作会议首次提出并用“十一个坚持”\n系统阐述了习近平法治思想。即：\n（1）坚持党对全面依法治国的领导。党的领导是推进全面依法治国的根本保证。\n（2）坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民，必须坚持为了\n人民、依靠人民。\n（3）坚持中国特色社会主义法治道路。中国特色社会主义法治道路本质上是中国特色\n社会主义道路在法治领域的具体体现。\n（4）坚持依宪治国、依宪执政。党领导人民制定宪法法律，领导人民实施宪法法律，\n党自身要在宪法法律范围内活动。\n（5）坚持在法治轨道上推进国家治理体系和治理能力现代化。法治是国家治理体系和\n治理能力的重要依托。\n（6）坚持建设中国特色社会主义法治体系。中国特色社会主义法治体系是推进全面依\n法治国的总抓手。\n（7）坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会\n一体建设。全面依法治国是一个系统工程，要整体谋划，更加注重系统性、整体性、协同性。\n（8）坚持全面推进科学立法、严格执法、公正司法、全民守法。公平正义是司法的灵\n魂和生命。\n（9）坚持统筹推进国内法治和涉外法治。\n（10）坚持建设德才兼备的高素质法治工作队伍，\n（11）坚持抓住领导干部这个“关键少数”。","source":{"doc":"3ccc56f4000d1642c2d1","first":20,"last":20,"page":20,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/9cc413c4eb4cfddbe2cc4051295b3aefa05a5db371b26d6dd5750aef1f9bfe8c.jpg","mentions":["政治理论必刷100题#94","政治理论必刷100题#96"],"groups":[]},{"kind":"knowledge","id":"cf56e6f75d9f6705","topic":"新时代中国特色社会主义思想","label":"文化思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.宣传思想工作的根本任务\n2013 年 8 月 19 日至 20 日，全国宣传思想工作会议强调，意识形态工作是党的一项极\n端重要的工作，明确“两个巩固”作为宣传思想工作的根本任务，即：巩固马克思主义在意\n识形态领域的指导地位，巩固全党全国人民团结奋斗的共同思想基础。\n2.两个结合\n2021 年 7 月 1 日，在庆祝中国共产党成立 100 周年大会上，习近平总书记首次正式提\n出“两个结合”重大论断，即“坚持把马克思主义基本原理同中国具体实际相结合、同中华\n优秀传统文化相结合”。“第二个结合”\n，是我们党对马克思主义中国化时代化历史经验的深\n刻总结，是对中华文明发展规律的深刻把握。\n2023 年 6 月 2 日，习近平总书记在文化传承发展座谈会上指出，历史正反两方面的经\n验表明，“两个结合”是我们取得成功的最大法宝。\n第一，“结合”的前提是彼此契合；第二，“结合”的结果是互相成就；第三，“结合”\n筑牢了道路根基；第四，“结合”打开了创新空间；第五，\n“结合”巩固了文化主体性。\n3.新的文化使命\n2023 年 6 月 2 日，习近平总书记在文化传承发展座谈会上指出，在新的起点上继续推\n动文化繁荣、建设文化强国、建设中华民族现代文明，是我们在新时代新的文化使命。\n4.中华文明的突出特性\n2023 年 6 月 2 日，习近平总书记在文化传承发展座谈会上指出，中华文明具有突出的\n连续性（中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明）、创新性、统\n一性、包容性、和平性。\n5.首要政治任务与七个着力\n2023 年，习近平总书记对宣传思想文化工作作出重要指示，将“用党的创新理论武装\n全党、教育人民”作为宣传思想文化工作的首要政治任务，并提出“七个着力”重要要求，\n即：（1）着力加强党对宣传思想文化工作的领导，（2）着力建设具有强大凝聚力和引领力\n的社会主义意识形态，（3）着力培育和践行社会主义核心价值观，（4）着力提升新闻舆论\n传播力引导力影响力公信力，（5）着力赓续中华文脉、推动中华优秀传统文化创造性转化\n和创新性发展，（6）着力推动文化事业和文化产业繁荣发展，（7）着力加强国际传播能力\n建设、促进文明交流互鉴。","source":{"doc":"3ccc56f4000d1642c2d1","first":21,"last":22,"page":21,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/fb8ace5d3f4e4288423f193cc6ce32c0e806b09733772cfa9cad7f77299b202d.jpg","mentions":["政治理论必刷100题#58","政治理论必刷100题#59","政治理论必刷100题#61"],"groups":[]},{"kind":"knowledge","id":"49e1ee3f5a2cb325","topic":"新时代中国特色社会主义思想","label":"生态文明思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.十个坚持\n2022 年 8 月 18 日，习近平生态文明思想研究中心在人民日报刊文，将习近平生态文\n明思想的基本内容概括为“十个坚持”。即：\n（1）坚持党对生态文明建设的全面领导，（2）\n坚持生态兴则文明兴，\n（3）坚持人与自然和谐共生，\n（4）坚持绿水青山就是金山银山，\n（5）\n坚持良好生态环境是最普惠的民生福祉，（6）坚持绿色发展是发展观的深刻革命，（7）坚\n持统筹山水林田湖草沙系统治理，（8）坚持用最严格制度最严密法治保护生态环境，（9）\n坚持把建设美丽中国转化为全体人民自觉行动，\n（10）坚持共谋全球生态文明建设之路。\n（粉\n笔敲黑板：2005 年，时任浙江省委书记习近平同志来到安吉余村考察调研，首次提出“绿\n水青山就是金山银山”科学论断。2025 年是两山理念提出的 20 周年。）\n2.四个重大转变与五个重大关系\n2023 年 7 月 17 日至 18 日，习近平总书记在全国生态环境保护大会上全面总结新时代\n生态文明建设实现“四个重大转变”的历史性成就，深刻阐述新征程上推进生态文明建设需\n要处理好的“五个重大关系”。\n“四个重大转变”即：（1）实现由重点整治到系统治理的重大转变，（2）实现由被动\n应对到主动作为的重大转变，（3）实现由全球环境治理参与者到引领者的重大转变，（4）\n实现由实践探索到科学理论指导的重大转变。\n“五个重大关系”即：（1）高质量发展和高水平保护的关系，（2）重点攻坚和协同治\n理的关系，\n（3）自然恢复和人工修复的关系，\n（4）外部约束和内生动力的关系，\n（5）\n“双碳”\n承诺和自主行动的关系。","source":{"doc":"3ccc56f4000d1642c2d1","first":22,"last":23,"page":22,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/fb7aeb0be2037b8be6aff1b665be36199ee420c803fab299bf526464a995de41.jpg","mentions":["政治理论必刷100题#2","政治理论必刷100题#80","国考 2025 副省级 行测#48","国考 2025 地市级 行测#51","江苏 2024 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"fd51587340a36b0e","topic":"新时代中国特色社会主义思想","label":"强军思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"习近平强军思想以“强军目标”为牵引，以“十一个明确”为主干，以“五个坚持”为\n精髓，涵盖新时代军队建设、改革和军事斗争准备各领域各方面，贯通军事力量建设和运用\n全过程，形成了一个内涵丰富、结构严谨、与时俱进的思想体系。\n1.“十一个明确”\n（1）明确党对人民军队的绝对领导是人民军队建军之本、强军之魂。\n（2）明确强国必须强军，巩固国防和强大人民军队是新时代坚持和发展中国特色社会\n主义、实现中华民族伟大复兴的战略支撑，人民军队必须有效履行新时代使命任务。\n（3）明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军\n队，到 2027 年实现建军一百年奋斗目标，到 2035 年基本实现国防和军队现代化，到本世\n纪中叶把人民军队建成世界一流军队。\n（4）明确军队是要准备打仗的，必须聚焦能打仗、打胜仗。\n（5）明确推进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治\n军，坚持边斗争、边备战、边建设。\n（6）明确改革是强军的必由之路，必须推进军队组织形态现代化，构建中国特色现代\n军事力量体系，完善中国特色社会主义军事制度。\n（7）明确科技是核心战斗力，必须坚持自主创新战略基点，推进高水平科技自立自强。\n（8）明确强军之道要在得人，必须贯彻新时代军事教育方针。\n（9）明确依法治军是我们党建军治军基本方式。\n（10）明确军民融合发展是兴国之举、强军之策，必须巩固提高一体化国家战略体系\n和能力。\n（11）明确作风优良是我军鲜明特色和政治优势，必须全面从严治党、全面从严治军。\n2.五个坚持\n即：\n（1）坚持政治引领，\n（2）坚持以武止戈，\n（3）坚持积极进取，\n（4）坚持统筹兼顾，\n（5）坚持敢打必胜。\n3.新时代政治建军方略\n明确政治建军是人民军队立军之本，明确政治工作永远是我军的生命线，明确政治整训\n要突出政治上的正本清源，明确掌握思想领导是掌握一切领导的基础，明确党的力量来自组\n织、部队凝聚力战斗力来自组织，明确枪杆子要始终掌握在对党忠诚可靠的人手中，明确严\n才能正纲纪、严才能肃军威、严才能出战斗力，明确军中绝不能有腐败分子藏身之地，明确\n作风优良才能塑造英雄部队，明确军政军民团结是我军胜利法宝。","source":{"doc":"3ccc56f4000d1642c2d1","first":23,"last":24,"page":23,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/2163d0964290920c02afeab35ea74c7364f0b6c60ebb73044adee8a17f76d093.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"11334b77ee634395","topic":"新时代中国特色社会主义思想","label":"外交思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"1.十个坚持\n2018 年 6 月 22 日至 23 日，中央外事工作会议确立习近平外交思想的指导地位，并用\n“十个坚持”阐释习近平外交思想的丰富内涵。即：\n（1）坚持以维护党中央权威为统领加强党对对外工作的集中统一领导；\n（2）坚持以实现中华民族伟大复兴为使命推进中国特色大国外交；\n（3）坚持以维护世界和平、促进共同发展为宗旨推动构建人类命运共同体；\n（4）坚持以中国特色社会主义为根本增强战略自信；\n（5）坚持以共商共建共享为原则推动“一带一路”建设；\n（6）坚持以相互尊重、合作共赢为基础走和平发展道路；\n（7）坚持以深化外交布局为依托打造全球伙伴关系；\n（8）坚持以公平正义为理念引领全球治理体系改革；\n（9）坚持以国家核心利益为底线维护国家主权、安全、发展利益；\n（10）坚持以对外工作优良传统和时代特征相结合为方向塑造中国外交独特风范。\n2.六个必须\n2023 年 12 月 27 日至 28 日，中央外事工作会议系统总结新时代中国特色大国外交的\n历史性成就和宝贵经验。历史性成就涵盖十个方面，排在第一的是“创立和发展了习近平外\n交思想”。\n会议将新时代外交工作的宝贵经验总结为“六个必须”，即：（1）必须做到坚持原则，\n（2）必须体现大国担当，\n（3）必须树立系统观念，\n（4）必须坚持守正创新，\n（5）必须发扬\n斗争精神，（6）必须发挥制度优势。","source":{"doc":"3ccc56f4000d1642c2d1","first":24,"last":25,"page":24,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/dbc2d1e51baa4e1326d7ee1c4d9a8c90c37528caa3dee8523f6523caebd6fe42.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"36adc9013d4bb8fe","topic":"新时代中国特色社会主义思想","label":"关于坚持和完善人民代表大会制度的重要思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2024 年 9 月 14 日，中共中央、全国人大常委会隆重举行庆祝全国人民代表大会成立\n70 周年大会。习近平总书记出席会议并发表重要讲话，深刻阐述人民代表大会制度具有的\n五个方面显著政治优势：（1）坚持中国共产党领导、保证党领导人民依法有效治理国家的\n显著优势，（2）践行全过程人民民主、保障人民当家作主的显著优势，（3）贯彻民主集中\n制、保证国家政治生活既充满活力又安定有序的显著优势，（4）保障全面依法治国、实现\n国家各方面工作法治化的显著优势，（5）维护国家统一、保障国家长治久安的显著优势。\n同时，习近平总书记在会上系统总结新时代人民代表大会制度理论和实践创新重大成果，\n提出“八个必须坚持”：\n（1）必须坚持中国共产党领导，\n（2）必须坚持用制度体系保障人民\n当家作主，（3）必须坚持全面依法治国，（4）必须坚持民主集中制，（5）必须坚持走中国\n特色社会主义政治发展道路，（6）必须坚持推进国家治理体系和治理能力现代化，（7）必\n须坚持充分发挥人大代表作用，（8）必须坚持按照“四个机关”要求加强各级人大建设。\n（粉笔敲黑板：“四个机关”是指人民代表大会作为政治机关、国家权力机关、工作机\n关和代表机关的四重定位，体现了其政治属性、民主属性、法治属性和人民属性。）\n◎粉笔拓展\n1.国体，即国家性质\n我国宪法规定：“中华人民共和国是工人阶级领导的，以工农联盟为基础的人民民主专\n政的社会主义国家。”这是我国国体的明确规定。\n“社会主义制度是中华人民共和国的根本制\n度。”\n2.政体，即政权组织形式\n我国宪法规定：“中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全\n国人民代表大会和地方各级人民代表大会。”也即，我国的政体是人民代表大会制度。","source":{"doc":"3ccc56f4000d1642c2d1","first":25,"last":26,"page":25,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/b95a89b25f667a2408c14bb3d1ca66d1057cd17e221be3b037f3c0c22697af4b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5cce5ae5c14b4273","topic":"新时代中国特色社会主义思想","label":"关于加强和改进人民政协工作的重要思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2024 年 9 月 20 日，在庆祝中国人民政治协商会议成立 75 周年大会上，习近平总书记\n用“十个坚持”系统总结我们党关于加强和改进人民政协工作的重要思想，即：\n（1）坚持中国共产党对人民政协的全面领导，\n（2）坚持人民政协性质定位，\n（3）坚持\n发挥人民政协作为专门协商机构作用，（4）坚持和完善我国社会主义新型政党制度，（5）\n坚持大团结大联合，（6）坚持把加强思想政治引领、广泛凝聚共识作为中心环节，（7）坚\n持聚焦党和国家中心任务履职尽责，（8）坚持人民政协为人民，（9）坚持强化委员责任担\n当，（10）坚持以改革创新精神推进履职能力建设。","source":{"doc":"3ccc56f4000d1642c2d1","first":26,"last":26,"page":26,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/506977b566227b54f7f4ecfa7e75e9ae35d6c393a3181efa821464693ceb6175.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"51fe3945894a24fd","topic":"新时代中国特色社会主义思想","label":"关于加强和改进民族工作的重要思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2021 年 8 月召开的中央民族工作会议，用“十二个必须”提炼概括习近平总书记关于\n加强和改进民族工作的重要思想，即：\n（1）必须从中华民族伟大复兴战略高度把握新时代党的民族工作的历史方位，\n（2）必\n须把推动各民族为全面建设社会主义现代化国家共同奋斗作为新时代党的民族工作的重要\n任务，（3）必须以铸牢中华民族共同体意识为新时代党的民族工作的主线，（4）必须坚持\n正确的中华民族历史观，（5）必须坚持各民族一律平等，（6）必须高举中华民族大团结旗\n帜，（7）必须坚持和完善民族区域自治制度，（8）必须构筑中华民族共有精神家园，（9）\n必须促进各民族广泛交往交流交融，（10）必须坚持依法治理民族事务，（11）必须坚决维\n护国家主权、安全、发展利益，（12）必须坚持党对民族工作的领导。","source":{"doc":"3ccc56f4000d1642c2d1","first":27,"last":27,"page":27,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/6cb93dcb089cf7bdd00f3d63e2a55485eab2445b3179841ce752db3894d0d913.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"158e87308e99f225","topic":"新时代中国特色社会主义思想","label":"关于党的建设的重要思想","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"2023 年 6 月 28 日至 29 日召开的全国组织工作会议，用“十三个坚持”集中概括了习\n近平总书记关于党的建设的重要思想，即：\n（1）坚持和加强党的全面领导；\n（2）坚持以党的自我革命引领社会革命（相关论述：党的自我革命是“跳出治乱兴衰\n历史周期率的第二个答案）；\n（3）坚持以党的政治建设统领党的建设各项工作（相关论述：党的政治建设决定党的\n建设方向和效果；党的政治建设是党的根本性建设；把党的政治建设摆在首位）；\n（4）坚持江山就是人民、人民就是江山（相关论述：站稳人民立场、把握人民愿望、\n尊重人民创造、集中人民智慧）；\n（5）坚持思想建党、理论强党（相关论述：思想建设是党的基础性建设）；\n（粉笔敲黑\n板：注意党的根本性建设是政治建设，基础性建设是思想建设）\n（6）坚持严密党的组织体系；\n（7）坚持造就忠诚干净担当的高素质干部队伍（相关论述：坚持把政治标准放在首位，\n做深做实干部政治素质考察，突出把好政治关、廉洁关）；\n（8）坚持聚天下英才而用之；\n（9）坚持持之以恒正风肃纪（相关论述：作风问题本质上是党性问题）；\n（10）坚持一体推进不敢腐、不能腐、不想腐（相关论述：腐败是最彻底的自我革命）；\n（11）坚持完善党和国家监督体系（相关论述：构建党统一指挥、全面覆盖、权威高\n效的监督体系，把党内监督同国家机关监督、民主监督、司法监督、群众监督、舆论监督贯\n通起来）；\n（12）坚持制度治党、依规治党（相关论述：加强党内法规制度建设是全面从严治党\n的长远之策、根本之策）；\n（13）坚持落实全面从严治党政治责任（相关论述：明确党委（党组）全面从严治党\n主体责任，明确各级纪委的监督责任，明确党委（党组）书记第一责任人责任，明确领导班\n子成员的管党治党责任，明确党员、干部的具体责任）。","source":{"doc":"3ccc56f4000d1642c2d1","first":27,"last":28,"page":27,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/6cb93dcb089cf7bdd00f3d63e2a55485eab2445b3179841ce752db3894d0d913.jpg","mentions":["江苏 2025 A类 行测#2","江苏 2025 B类 行测#2","江苏 2025 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"499077802f3e9111","topic":"新时代中国特色社会主义思想","label":"总体国家安全观","basis":"理论手册","paper":"政治理论必学手册.pdf","text":"党的十八届三中全会《决定》提出：“设立国家安全委员会，完善国家安全体制和国家\n安全战略，确保国家安全。”\n2014 年 4 月 15 日，中央国家安全委员会召开第一次会议，习近平总书记创造性地提\n出总体国家安全观。\n党的十九大将“坚持总体国家安全观”纳入新时代坚持和发展中国特色社会主义的基本\n方略并写入党章。\n2020 年 12 月 11 日，十九届中央政治局举行第二十六次集体学习，习近平总书记就\n贯彻总体国家安全观提出“十个坚持”的重要要求，标志着总体国家安全观理论体系的正式\n确立。\n“十个坚持”是指：\n（1）坚持党对国家安全工作的绝对领导，\n（2）坚持中国特色国家\n安全道路，（3）坚持以人民安全为宗旨，（4）坚持统筹发展和安全，（5）坚持把政治安全\n放在首要位置，（6）坚持统筹推进各领域安全，（7）坚持把防范化解国家安全风险摆在突\n出位置，\n（8）坚持推进国际共同安全，\n（9）坚持推进国家安全体系和能力现代化，\n（10）坚\n持加强国家安全干部队伍建设。\n党的二十大对国家安全工作进行专章部署，提出：“坚持以人民安全为宗旨、以政治安\n全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托，\n统筹外部安全和内部安全、国土安全和国民安全、传统安全和非传统安全、自身安全和共同\n安全，统筹维护和塑造国家安全，夯实国家安全和社会稳定基层基础，完善参与全球安全治\n理机制，建设更高水平的平安中国，以新安全格局保障新发展格局。”\n（粉笔敲黑板：注意总\n体国家安全关 5 个安全的地位，尤其是政治安全为根本）\n总体国家安全观的关键是“总体”。强调大安全理念，涵盖政治、军事、国土、经济、\n金融、文化、社会、科技、网络、粮食、生态、资源、核、海外利益、太空、深海、极地、\n生物、人工智能、数据等诸多领域，而且将随着社会发展不断动态调整。总体国家安全观的\n核心要义，集中体现为“十个坚持”。\n“一个总体”、\n“十个坚持”有机融合、有机统一，凝结\n着我们党坚持和发展中国特色国家安全的宝贵经验，反映了以习近平同志为核心的党中央对\n国家安全工作规律性认识的深化、拓展、升华。","source":{"doc":"3ccc56f4000d1642c2d1","first":28,"last":29,"page":28,"file":"政治理论必学手册.pdf"},"thumb":"assets/thumbs/fa790c4ffa921d0ddbe6c668068df0333e73cf50eee895137937a785e5ad337f.jpg","mentions":["政治理论必刷100题#64","政治理论必刷100题#99"],"groups":[]},{"kind":"knowledge","id":"0daa793a65a0589f","topic":"经济指标与宏观调控","label":"国内生产总值（GDP）","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.国内生产总值（GDP）\n国内（地区）生产总值是一个国家或地区的所有常住单位在一定时期内生产活动的全部\n最终产品的价值总和，是反映经济总体状况最重要的指标。\n——国家统计局","source":{"doc":"6cbfb01fe723bba64b75","first":3,"last":3,"page":3,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/fca10ae2914ee1aab3bac40550b5889119d2fba2770dd8b64d20c1faf21a23e9.jpg","mentions":["国考 2023 副省级 行测#2","国考 2023 地市级 行测#1","江苏 2023 A类 行测#117","江苏 2023 B类 行测#117"],"groups":[]},{"kind":"knowledge","id":"cb5ae3322fd2f638","topic":"经济指标与宏观调控","label":"城镇调查失业率","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.城镇调查失业率\n调查失业率指根据抽样调查方法测算得到的失业人口占就业人口与失业人口之和的百\n分比，计算方法为：调查失业率=失业人口/（失业人口+就业人口）×100%。调查失业率与\n经济增长率、物价指数和国际收支平衡状况并称为四大宏观经济指标，是分析宏观经济走\n势和就业形势变化的重要依据，在各个国家均是最重要的经济指标之一。\n——国家统计局","source":{"doc":"6cbfb01fe723bba64b75","first":3,"last":3,"page":3,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/fca10ae2914ee1aab3bac40550b5889119d2fba2770dd8b64d20c1faf21a23e9.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"6eecb3118a2cd503","topic":"经济指标与宏观调控","label":"逆周期调节","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.逆周期调节\n逆周期调节，是一种针对经济周期波动进行反向调节的政策手段。从具体思路看，逆周\n期调节主要是针对影响经济趋势的短期负面因素，通过及时采取逆向举措来对冲和消除负面\n影响，进而实现稳定经济目标的调控模式。\n跨周期调节则是立足于系统思维，更加注重经济的长期健康运行和有序增长，强调宏观\n调控应围绕影响周期的长期因素来持续发力。\n——人民日报","source":{"doc":"6cbfb01fe723bba64b75","first":5,"last":5,"page":5,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a615e9706772e95227a3abed1f6ce8127f594391abe0fe445ce2015782f5a0c0.jpg","mentions":["国考 2023 副省级 行测#26"],"groups":[]},{"kind":"knowledge","id":"72cb04e5254bdb99","topic":"发展与治理","label":"既“放得活”又“管得好”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.既“放得活”又“管得好”\n2025 年 12 月召开的中央经济工作会议，将“必须做到既‘放得活’又‘管得好’”列\n入做好新形势下经济工作的新认识，以辩证思维理顺政府与市场的关系，意在实现经济活而\n不乱、活跃有序。“放”不是一放了之，“管”也不是捆住手脚。“放得活”目的在于破除\n影响生产力发展的体制机制障碍；“管得好”本质要求是建设社会主义法治经济、信用经\n济。二者并不矛盾，而是统一于高水平社会主义市场经济体制中，共同指向高质量发展这一\n首要任务。\n放，是把该放归市场的放足、放到位，充分发挥市场在资源配置中的决定性作用。管，\n是把该政府管理的管好、管到位，更好发挥政府作用。\n——中国共产党新闻网","source":{"doc":"6cbfb01fe723bba64b75","first":5,"last":5,"page":5,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a615e9706772e95227a3abed1f6ce8127f594391abe0fe445ce2015782f5a0c0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"2b7ba85592536217","topic":"经济指标与宏观调控","label":"投资于物和投资于人紧密结合","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.投资于物和投资于人紧密结合\n投资于物是指对实物资产进行投资，比如基础设施、房屋建筑、机器设备等，可以为经\n济社会发展夯实物质技术基础。\n投资于人是指对全人群、全生命周期人的能力提升和潜力开发的投入，比如育幼、养\n老、健康、教育、技能培训等。\n——新华社（学习规划建议每日问答）","source":{"doc":"6cbfb01fe723bba64b75","first":5,"last":5,"page":5,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a615e9706772e95227a3abed1f6ce8127f594391abe0fe445ce2015782f5a0c0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a36f06caa3089ea0","topic":"经济指标与宏观调控","label":"存款准备金率","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.存款准备金率\n存款准备金是指金融机构为保证客户提取存款和资金清算需要而准备的资金，金融机构\n按规定向中央银行缴纳的存款准备金占其存款总额的比例就是存款准备金率。\n——中国人民银行","source":{"doc":"6cbfb01fe723bba64b75","first":6,"last":6,"page":6,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/69552f71abc39d67ccaa31a0e07ef85ea57bb2e35aa28e85e9ed6b99fbffd27c.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"4c18d7c76ff0f014","topic":"发展与治理","label":"全国统一大市场建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.全国统一大市场建设\n建设全国统一大市场，不仅是构建新发展格局、推动高质量发展的需要，而且是赢得国\n际竞争主动权的需要。我国作为全球第二大消费市场，必须把全国统一大市场建设好，增强\n我们从容应对风险挑战的底气。\n纵深推进全国统一大市场建设，基本要求是“五统一、一开放”。“五统一”，就是统\n一市场基础制度，特别是实现产权保护、公平竞争、质量标准等制度的统一；统一市场基础\n设施，打通物流、资金流、信息流，健全现代商贸流通体系；统一政府行为尺度，地方在推\n动经济发展特别是招商引资时，哪些能干哪些不能干有明确规矩，不能各行其是；统一市场\n监管执法，明确市场监管行政处罚裁量基准，一把尺子量到底；统一要素资源市场，促进自\n由流动、高效配置，减少资源错配和闲置浪费。“一开放”，就是持续扩大开放，实行对内\n对外开放联通，不搞封闭运行。\n——《求是》杂志","source":{"doc":"6cbfb01fe723bba64b75","first":7,"last":8,"page":7,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/cce510f35189f4bf28194c1ef83e0169b6538b399f389af7fb2859e1df57fa0e.jpg","mentions":["政治理论必刷100题#16"],"groups":[]},{"kind":"knowledge","id":"5507b615e6d18124","topic":"发展与治理","label":"市场准入负面清单","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.市场准入负面清单\n市场准入负面清单分为禁止和许可两类事项。对禁止准入事项，经营主体不得进入，政\n府依法不予审批、核准，不予办理有关手续；对许可准入事项，地方各级政府要公开法律法\n规依据、技术标准、许可要求、办理流程、办理时限，制定市场准入服务规程，由经营主体\n按照规定的条件和方式合规进入；对市场准入负面清单以外的行业、领域、业务等，各类经\n营主体皆可依法平等进入。对未实施市场禁入或许可准入但按照备案管理的事项，不得以备\n案名义变相设立许可。\n——《市场准入负面清单（2025 年版）》","source":{"doc":"6cbfb01fe723bba64b75","first":8,"last":8,"page":8,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/17167f198cfd233988e90709d7824f88e4075887f948e54d4785c0fde4556988.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9a577840592b8b76","topic":"发展与治理","label":"“内卷式”竞争","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.“内卷式”竞争\n“内卷式”竞争本质是市场失灵下的资源错配，当所有经营主体的收益改进空间消失，\n经营主体便陷入了低水平均衡困境，只能在有限市场中进行同质化竞争，最终使得社会资源\n配置的整体效率降低。\n——求是网","source":{"doc":"6cbfb01fe723bba64b75","first":8,"last":8,"page":8,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/17167f198cfd233988e90709d7824f88e4075887f948e54d4785c0fde4556988.jpg","mentions":["政治理论必刷100题#36"],"groups":[]},{"kind":"knowledge","id":"cbe2b045c4cc446b","topic":"农业与城乡治理","label":"现代化都市圈","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.现代化都市圈\n城市群是新型城镇化主体形态，是支撑全国经济增长、促进区域协调发展、参与国际竞\n争合作的重要平台。都市圈是城市群内部以超大特大城市或辐射带动功能强的大城市为中\n心、以 1 小时通勤圈为基本范围的城镇化空间形态。\n坚持以供给侧结构性改革为主线，坚持市场化改革、扩大高水平开放，以促进中心城市\n与周边城市（镇）同城化发展为方向，以创新体制机制为抓手，以推动统一市场建设、基\n础设施一体高效、公共服务共建共享、产业专业化分工协作、生态环境共保共治、城乡融合\n发展为重点，培育发展一批现代化都市圈，形成区域竞争新优势，为城市群高质量发展、经\n济转型升级提供重要支撑。\n到 2022 年，都市圈同城化取得明显进展，基础设施一体化程度大幅提高，阻碍生产要\n素自由流动的行政壁垒和体制机制障碍基本消除，成本分担和利益共享机制更加完善，梯次\n形成若干空间结构清晰、城市功能互补、要素流动有序、产业分工协调、交通往来顺畅、\n公共服务均衡、环境和谐宜居的现代化都市圈。到 2035 年，现代化都市圈格局更加成熟，\n形成若干具有全球影响力的都市圈。\n——《国家发展改革委关于培育发展现代化都市圈的指导意见》","source":{"doc":"6cbfb01fe723bba64b75","first":9,"last":9,"page":9,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/f2c2894d2d374b90d4ad644094aab602837de10bb6a69dc753750faed5b38222.jpg","mentions":["政治理论必刷100题#27"],"groups":[]},{"kind":"knowledge","id":"24f01d3f17f9f72f","topic":"农业与城乡治理","label":"巩固拓展脱贫攻坚成果同乡村振兴有效衔接","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.巩固拓展脱贫攻坚成果同乡村振兴有效衔接\n巩固拓展脱贫攻坚成果同全面推进乡村振兴有效衔接，是激发脱贫地区内生发展动力\n的根本途径与持久之策。巩固拓展脱贫攻坚成果，其工作重心之一就是从过去的“输血”为\n主，转向更加注重培育“造血”功能。通过发展壮大特色优势产业、加强职业技能培训、提\n升人力资本、完善基层治理体系等方式，全面提升脱贫地区和脱贫群众的自我发展能力，引\n导他们用自己的辛勤劳动创造美好生活，从而实现从“要我脱贫”到“我要振兴”的深刻转\n变，为乡村振兴注入最深厚、最持久的力量。\n——中国共产党新闻网","source":{"doc":"6cbfb01fe723bba64b75","first":9,"last":10,"page":9,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/f2c2894d2d374b90d4ad644094aab602837de10bb6a69dc753750faed5b38222.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"d6c31e0b2d2626ab","topic":"就业、社保与公共服务","label":"个人养老金制度","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.个人养老金制度\n个人养老金是指政府政策支持、个人自愿参加、市场化运营、实现养老保险补充功能\n的制度。个人养老金实行个人账户制，缴费完全由参加人个人承担，自主选择购买符合规\n定的储蓄存款、理财产品、商业养老保险、公募基金等金融产品，实行完全积累，按照国家\n有关规定享受税收优惠政策。\n个人养老金的参加人应当是在中国境内参加城镇职工基本养老保险或者城乡居民基本\n养老保险的劳动者。\n参加人每年缴纳个人养老金额度上限为 12000 元，参加人每年缴费不得超过该缴费额度\n上限。\n——《个人养老金实施办法》","source":{"doc":"6cbfb01fe723bba64b75","first":11,"last":11,"page":11,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/372a6a4f098ecfb06dba11df611a4a21d807fe5b1ad063b607c7d60133d6e652.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"798fc8a6855938e2","topic":"生态环境与能源","label":"美丽中国先行区建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"美丽中国先行区建设\n建设美丽中国先行区是全面推进美丽中国建设的重要抓手，是构建美丽中国建设新格\n局的关键支撑。要以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二\n十届二中、三中全会精神，全面贯彻习近平生态文明思想，牢固树立和践行绿水青山就是金\n山银山的理念，落实全国生态环境保护大会要求，聚焦全面推进美丽中国建设中心任务，以\n深化污染防治攻坚、改善生态环境质量、增进民生福祉为着力点，坚持改革创新、重点突\n破、示范带动，在区域、省域、城市、县域各层级，聚焦推动绿色低碳发展、促进生态环境\n根本好转、加强生态保护修复、筑牢生态安全底线、深化生态文明体制改革等目标任务，分\n级分类建设美丽中国先行区（以下简称先行区），到 2027 年底前形成一批实践创新和制度\n创新成果，久久为功建成若干各美其美、群众满意的示范样板，为全面推进美丽中国建设积\n累经验、树立标杆。\n——《关于建设美丽中国先行区的实施意见》","source":{"doc":"6cbfb01fe723bba64b75","first":12,"last":12,"page":12,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/24f9e959fe532cd3690590fbaee703b24d673a6419828b500106788e76019c3d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"99df742877aae930","topic":"发展与治理","label":"全球治理倡议","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"全球治理倡议\n2025 年 9 月 1 日，习近平总书记在“上海合作组织+”会议上郑重提出全球治理倡议，\n这是继全球发展倡议、全球安全倡议、全球文明倡议之后，习近平总书记提出的第四个全球\n倡议，为破解“世界怎么了，我们怎么办”之问进一步贡献中国智慧、提出中国方案。\n全球治理倡议核心理念包括：\n（一）坚持主权平等。这是全球治理的首要前提。\n（二）坚持国际法治。这是全球治理的根本保障。\n（三）坚持多边主义。这是全球治理的基本路径。\n（四）坚持以人为本。这是全球治理的价值取向。\n（五）坚持力求实效。这是全球治理的重要原则。\n——中国共产党新闻网、外交部","source":{"doc":"6cbfb01fe723bba64b75","first":13,"last":13,"page":13,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/b4dbeefa0cd66bc8e22c688dcebdcbeaae8999310f1c96d909224b93673e9eb7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8df8d4353be4feb1","topic":"经济指标与宏观调控","label":"全社会研发经费投入","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.全社会研发经费投入\n全社会研发经费投入，不仅是一个国家和地区科技投入的重要构成，也是衡量其对创新\n重视程度的关键指标，更能从侧面反映整体科技发展水平和创新竞争力。2025 年，我国全\n社会研究与试验发展经费投入达 39262 亿元，研发经费投入强度达 2.8%，比上年提高 0.11\n个百分点。“十四五”时期，我国全社会研发经费投入年均增长 10%，研发经费投入强度提\n高 0.44 个百分点。","source":{"doc":"6cbfb01fe723bba64b75","first":15,"last":15,"page":15,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/452eda6ed3d90548896ba4a561aa3d5fb7730411384d7c1a7aca8a596bb91f6f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"db5cf4ee399bbb83","topic":"生态环境与能源","label":"国家自主贡献目标","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.国家自主贡献目标\n2025 年 9 月 24 日，中国新一轮国家自主贡献目标发布。我国新一轮国家自主贡献目标\n是，到 2035 年，中国全经济范围温室气体净排放量比峰值下降 7%—10%，力争做得更好。\n非化石能源消费占能源消费总量的比重达到 30%以上，风电和太阳能发电总装机容量达到\n2020 年的 6 倍以上，力争达到 36 亿千瓦，森林蓄积量达到 240 亿立方米以上，新能源汽车\n成为新销售车辆的主流，全国碳排放权交易市场覆盖主要高排放行业，气候适应型社会基本\n建成。","source":{"doc":"6cbfb01fe723bba64b75","first":15,"last":15,"page":15,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/452eda6ed3d90548896ba4a561aa3d5fb7730411384d7c1a7aca8a596bb91f6f.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"cd67a12c3d0c8d5b","topic":"产业、科技与对外开放","label":"新质生产力","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.新质生产力\n新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、\n高效能、高质量特征，符合新发展理念的先进生产力质态。\n（1）催生：由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生。\n（2）基本内涵：以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵。\n（3）核心标志：以全要素生产率大幅提升为核心标志。\n（4）关键：关键在质优。\n（5）特点：特点是创新。\n（6）本质：本质是先进生产力。\n（7）显著特点：新质生产力的显著特点是创新，既包括技术和业态模式层面的创新，\n也包括管理和制度层面的创新。\n（8）核心要素：科技创新能够催生新产业、新模式、新动能，是发展新质生产力的核\n心要素。\n（9）本身：新质生产力本身就是绿色生产力。\n（10）基本路径：科技创新和产业创新，是发展新质生产力的基本路径。","source":{"doc":"6cbfb01fe723bba64b75","first":16,"last":16,"page":16,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/9ce01970a87a76f053a8314b72d12ed4d73e8726c37fdce988f73c62f483cb93.jpg","mentions":["政治理论必刷100题#5","政治理论必刷100题#25","政治理论必刷100题#28","政治理论必刷100题#32","国考 2025 副省级 行测#39","国考 2025 行政执法 行测#50","江苏 2024 B类 行测#3","江苏 2025 A类 申论#4","江苏 2025 A类 行测#36","江苏 2025 B类 行测#36"],"groups":[]},{"kind":"knowledge","id":"d28abd67bac9d0d3","topic":"产业、科技与对外开放","label":"实体经济","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.实体经济\n实体经济指物质的、精神的产品和服务的生产、流通等经济活动，包括农业、工业、交\n通运输业、商业、建筑业等物质生产和服务部门，是国民经济的根基，区别于金融、房地产\n等虚拟经济领域，实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的\n重要支柱。习近平总书记强调，经济发展任何时候都不能脱实向虚。要处理好实体经济与虚\n拟经济的关系，推动虚拟经济服务于实体经济，促进两者协同发展。","source":{"doc":"6cbfb01fe723bba64b75","first":16,"last":16,"page":16,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/9ce01970a87a76f053a8314b72d12ed4d73e8726c37fdce988f73c62f483cb93.jpg","mentions":["政治理论必刷100题#28","政治理论必刷100题#48","政治理论必刷100题#73","国考 2023 副省级 行测#5","国考 2023 地市级 行测#4","国考 2025 副省级 行测#55","国考 2025 地市级 行测#65","江苏 2024 B类 行测#8"],"groups":[]},{"kind":"knowledge","id":"af8bc6ff1a9b111f","topic":"产业、科技与对外开放","label":"现代化产业体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.现代化产业体系\n现代化产业体系以实体经济为根基，以科技创新为核心驱动，以先进制造业为骨干，涵\n盖优化提升的传统产业、壮大的新兴产业和未来产业、优质高效的服务业，以及现代化基础\n设施体系的有机整体，具备智能化、绿色化、融合化特征，是支撑高质量发展的产业支撑。","source":{"doc":"6cbfb01fe723bba64b75","first":16,"last":17,"page":16,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/9ce01970a87a76f053a8314b72d12ed4d73e8726c37fdce988f73c62f483cb93.jpg","mentions":["政治理论必刷100题#32","江苏 2025 A类 行测#3","江苏 2025 B类 行测#3","江苏 2025 C类 行测#3"],"groups":[]},{"kind":"knowledge","id":"08fbc6d8405a3842","topic":"产业、科技与对外开放","label":"高水平科技自立自强","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.高水平科技自立自强\n在关键核心技术领域实现自主可控，不依赖外部技术供给，同时具备持续创新能力，能\n够引领科技发展方向，为经济社会发展提供坚实科技支撑，是国家发展的战略支撑。","source":{"doc":"6cbfb01fe723bba64b75","first":17,"last":17,"page":17,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/59b3715f7bd8b7fc8fc32f5d8b71a79e87248fd5222132f739cca94aad2787d5.jpg","mentions":["政治理论必刷100题#40","政治理论必刷100题#74","国考 2023 副省级 行测#2","国考 2023 地市级 行测#1"],"groups":[]},{"kind":"knowledge","id":"838dc34ef13b66d0","topic":"产业、科技与对外开放","label":"数字中国建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.数字中国建设\n数字中国建设按照“2522”的整体框架进行布局，即夯实数字基础设施和数据资源体系\n“两大基础”，推进数字技术与经济、政治、文化、社会、生态文明建设“五位一体”深度\n融合，强化数字技术创新体系和数字安全屏障“两大能力”，优化数字化发展国内国际“两\n个环境”。","source":{"doc":"6cbfb01fe723bba64b75","first":17,"last":17,"page":17,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/59b3715f7bd8b7fc8fc32f5d8b71a79e87248fd5222132f739cca94aad2787d5.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1143bb02e8e25bae","topic":"生态环境与能源","label":"碳达峰目标","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"6.碳达峰目标\n2020 年，我国向世界作出承诺：二氧化碳排放力争于 2030 年前达到峰值，努力争取 2060\n年前实现碳中和。","source":{"doc":"6cbfb01fe723bba64b75","first":17,"last":17,"page":17,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/59b3715f7bd8b7fc8fc32f5d8b71a79e87248fd5222132f739cca94aad2787d5.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b524569d860543e7","topic":"经济指标与宏观调控","label":"国内大循环","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.国内大循环\n面对外部环境的不确定性，习近平总书记提出的“以国内大循环为主体、国内国际双循\n环相互促进”的新发展格局，既是应对全球治理体系变革的战略选择，更是发挥大国经济内\n生优势的必然要求。做强国内大循环，就是将发展的立足点牢牢置于扩大内需战略基点。","source":{"doc":"6cbfb01fe723bba64b75","first":17,"last":17,"page":17,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/59b3715f7bd8b7fc8fc32f5d8b71a79e87248fd5222132f739cca94aad2787d5.jpg","mentions":["政治理论必刷100题#26","国考 2024 行政执法 行测#7"],"groups":[]},{"kind":"knowledge","id":"094aafde10da7bfb","topic":"经济指标与宏观调控","label":"扩大内需这个战略基点","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.扩大内需这个战略基点\n扩大内需是开新局之要，是大国经济发展到特定阶段的必然选择。我国已经成长为世界\n第二大经济体、第一制造业大国，2025 年工业增加值 41.7 万亿元，约为 2000 年的 10 倍、\n1985 年的 120 倍，制造业大国的发展后劲需要强大的国内需求支撑。大国经济优势之一是\n内部可循环，扩大内需的重要意义就在于把大国这一优势充分发挥出来。\n扩大内需是激发超大规模市场潜能的必然要求。我国拥有 14 亿多人口的超大规模市场，","source":{"doc":"6cbfb01fe723bba64b75","first":17,"last":17,"page":17,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/59b3715f7bd8b7fc8fc32f5d8b71a79e87248fd5222132f739cca94aad2787d5.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"c1c181c77df0cdd7","topic":"发展与治理","label":"全体人民共同富裕","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.全体人民共同富裕\n党的二十大报告指出，到二〇三五年，全体人民共同富裕取得更为明显的实质性进展。\n全体人民共同富裕是一个总体概念，它不是也不可能是所有人都同时富裕，不同人群不\n仅实现富裕的程度有高有低，时间上也会有先有后；它不是也不可能是所有地区同时达到一\n个富裕水准，不同地区富裕程度还会存在一定差异，而不是齐头并进。","source":{"doc":"6cbfb01fe723bba64b75","first":18,"last":18,"page":18,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d65271b76090708fa259147d5dea52a2b8311093ea3784d3feceb4b8156cc03e.jpg","mentions":["国考 2023 地市级 行测#5","江苏 2024 C类 行测#5"],"groups":[]},{"kind":"knowledge","id":"f35814de334992f6","topic":"发展与治理","label":"中国式现代化是全体人民共同富裕的现代化","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.中国式现代化是全体人民共同富裕的现代化\n中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有\n基于自己国情的中国特色。\n（1）中国式现代化是人口规模巨大的现代化。\n（2）中国式现代化是全体人民共同富裕的现代化。\n（3）中国式现代化是物质文明和精神文明相协调的现代化。\n（4）中国式现代化是人与自然和谐共生的现代化。\n（5）中国式现代化是走和平发展道路的现代化。","source":{"doc":"6cbfb01fe723bba64b75","first":18,"last":18,"page":18,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d65271b76090708fa259147d5dea52a2b8311093ea3784d3feceb4b8156cc03e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5cbd9b1179a2a2b6","topic":"就业、社保与公共服务","label":"收入分配制度","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.收入分配制度\n分配制度是促进共同富裕的基础性制度。党的二十届三中全会提出，“完善收入分配制\n度。构建初次分配、再分配、第三次分配协调配套的制度体系，提高居民收入在国民收入分\n配中的比重，提高劳动报酬在初次分配中的比重”。这为完善收入分配制度提供了基本遵循。\n要正确处理好初次分配、再分配、第三次分配的关系。\n初次分配是指在社会生产活动中，企业作为分配主体，将国民收入在国家、企业、个人\n之间进行分配，是最基本的分配关系，主要是在市场机制中形成的。再分配是指在初次分配\n结果的基础上，政府对收入分配进行再次调节的过程，目的在于调节城乡、区域、部门和劳\n动者之间的收入分配关系，保障社会公平。第三次分配是指企业、社会组织和个人在自愿基\n础上向他人进行捐赠或无偿提供帮助。初次分配是基础，再分配是保障，第三次分配是必要\n的补充。","source":{"doc":"6cbfb01fe723bba64b75","first":18,"last":19,"page":18,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d65271b76090708fa259147d5dea52a2b8311093ea3784d3feceb4b8156cc03e.jpg","mentions":["国考 2025 副省级 行测#10","国考 2025 地市级 行测#10","国考 2025 行政执法 行测#10"],"groups":[]},{"kind":"knowledge","id":"39ebe4485fa4e480","topic":"就业、社保与公共服务","label":"社会保障体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.社会保障体系\n社会保障主要由社会保险、社会救助、社会福利、社会优抚组成，还包括其他社会保障\n形式，它们共同构成我国的社会保障体系。社会保障体系是人民生活的安全网和社会运行的\n稳定器。健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系。","source":{"doc":"6cbfb01fe723bba64b75","first":19,"last":19,"page":19,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a73c9fca26fb8de9dc45e19a0d0e7749bdee3682e300ab7a0fab46500c92ed5d.jpg","mentions":["江苏 2025 A类 行测#3","江苏 2025 B类 行测#3","江苏 2025 C类 行测#3"],"groups":[]},{"kind":"knowledge","id":"266cb54b20bf6a24","topic":"发展与治理","label":"社会主义核心价值观","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.社会主义核心价值观\n党的十八大提出，倡导富强、民主、文明、和谐，倡导自由、平等、公正、法治，倡导\n爱国、敬业、诚信、友善，积极培育和践行社会主义核心价值观。这与中国特色社会主义发\n展要求相契合，与中华优秀传统文化和人类文明优秀成果相承接，是我们党凝聚全党全社会\n价值共识作出的重要论断。富强、民主、文明、和谐是国家层面的价值目标，自由、平等、\n公正、法治是社会层面的价值取向，爱国、敬业、诚信、友善是公民个人层面的价值准则，\n这 24 个字是社会主义核心价值观的基本内容，为培育和践行社会主义核心价值观提供了基\n本遵循。","source":{"doc":"6cbfb01fe723bba64b75","first":19,"last":19,"page":19,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a73c9fca26fb8de9dc45e19a0d0e7749bdee3682e300ab7a0fab46500c92ed5d.jpg","mentions":["国考 2023 副省级 行测#25","国考 2023 行政执法 行测#29"],"groups":[]},{"kind":"knowledge","id":"b5a8ce163b7c8412","topic":"发展与治理","label":"总体国家安全观","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.总体国家安全观\n2014 年 4 月 15 日，习近平总书记在中央国家安全委员会第一次会议上首次提出总体国\n家安全观。\n我们要坚持以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文\n化社会安全为保障、以促进国际安全为依托，统筹外部安全和内部安全、国土安全和国民安\n全、传统安全和非传统安全、自身安全和共同安全，统筹维护和塑造国家安全，夯实国家安\n全和社会稳定基层基础，完善参与全球安全治理机制，建设更高水平的平安中国，以新安全\n格局保障新发展格局。","source":{"doc":"6cbfb01fe723bba64b75","first":19,"last":19,"page":19,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a73c9fca26fb8de9dc45e19a0d0e7749bdee3682e300ab7a0fab46500c92ed5d.jpg","mentions":["政治理论必刷100题#64","政治理论必刷100题#99"],"groups":[]},{"kind":"knowledge","id":"fb6306d8b8dc4559","topic":"农业与城乡治理","label":"粮食综合生产能力","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.粮食综合生产能力\n粮食综合生产能力是指在一定技术条件和生产要素投入下国内可以稳定达到的粮食产\n出能力，是反映国家粮食安全保障能力的重要指标。新设置该指标，有利于引导各方面把提\n高粮食供应保障能力摆在突出位置，守住“谷物基本自给、口粮绝对安全”的底线。","source":{"doc":"6cbfb01fe723bba64b75","first":19,"last":19,"page":19,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a73c9fca26fb8de9dc45e19a0d0e7749bdee3682e300ab7a0fab46500c92ed5d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f463c54df15594b2","topic":"生态环境与能源","label":"能源综合生产能力","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.能源综合生产能力\n能源综合生产能力指国内煤炭、石油、天然气、非化石能源等一次能源的综合生产能力，\n是反映国家能源安全保障能力的重要指标。设置该指标，有利于引导提高国内能源供给能力，\n将能源自给率稳定在合理水平。","source":{"doc":"6cbfb01fe723bba64b75","first":19,"last":20,"page":19,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a73c9fca26fb8de9dc45e19a0d0e7749bdee3682e300ab7a0fab46500c92ed5d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f9bf3190221d88e4","topic":"产业、科技与对外开放","label":"新产业新赛道","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.新产业新赛道\n新赛道新产业是新质生产力的载体，发展新质生产力必然落实到与之相适应的新赛道和\n新产业上。如以国家标准提升和引领传统产业优化升级，必然要以传统产业为基础载体，融\n合智能化、绿色化新技术；完善新一代信息技术、人工智能、新能源、高端装备等战略性新\n兴产业的发展政策和治理体系，建立未来产业投入增长机制，目的是顺畅新质生产力发展的\n体制机制。","source":{"doc":"6cbfb01fe723bba64b75","first":20,"last":20,"page":20,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/b513c40fa5b78f477ff5bb331d8d6b1e8addee91abcb4fde3840f201c8ce7627.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"13ce7b4cf5dc114f","topic":"生态环境与能源","label":"新型能源体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.新型能源体系\n建设新型能源体系，就是在传统能源体系基础上，逐步建立以非化石能源为供应主体、\n化石能源为兜底保障、新型电力系统为关键支撑、绿色智慧节约为用能导向，清洁低碳安全\n高效的能源体系。","source":{"doc":"6cbfb01fe723bba64b75","first":20,"last":20,"page":20,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/b513c40fa5b78f477ff5bb331d8d6b1e8addee91abcb4fde3840f201c8ce7627.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"0a7fde78b5c0c464","topic":"产业、科技与对外开放","label":"新型基础设施","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.新型基础设施\n新型基础设施是指提供数字转型、智能升级、融合创新等服务的基础设施体系，主要包\n括信息基础设施、融合基础设施和创新基础设施。信息基础设施是指基于新一代信息技术演\n化生成的基础设施，如第五代移动通信技术、物联网、数据中心、人工智能、卫星通信、区\n块链基础设施等。融合基础设施是指传统基础设施应用新一代信息技术进行智能化改造后所\n形成的基础设施形态，包括以工业互联网、智慧交通物流设施、智慧能源系统为代表的新型\n生产性设施，和以智慧民生基础设施、智慧环境资源设施、智慧城市基础设施等为代表的新\n型社会性设施。创新基础设施是指支撑科学研究、技术开发、新产品和新服务研制的具有公\n益属性的基础设施，包括重大科技基础设施、科教基础设施、产业技术基础设施等。","source":{"doc":"6cbfb01fe723bba64b75","first":20,"last":21,"page":20,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/b513c40fa5b78f477ff5bb331d8d6b1e8addee91abcb4fde3840f201c8ce7627.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"7f66b4d633e357e5","topic":"经济指标与宏观调控","label":"“硬投资”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.“硬投资”\n“硬投资”是指必需的基础设施建设，比如，要逐步增加普通高中学位就需要相应的教\n学场所，要实现老有所养、养有所乐，就需要增加养老场所等。","source":{"doc":"6cbfb01fe723bba64b75","first":21,"last":21,"page":21,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/5182e8b9a71272f7eb8687bc57a93d2c6ac8c6c69ad7a22daffbe94c729a2404.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"aa3fd0193fc07bf0","topic":"经济指标与宏观调控","label":"“软建设”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.“软建设”\n“软建设”是指为保障项目建设而推进的制度建设，并根据需要制定出台相关专项规划\n和实施方案。","source":{"doc":"6cbfb01fe723bba64b75","first":21,"last":21,"page":21,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/5182e8b9a71272f7eb8687bc57a93d2c6ac8c6c69ad7a22daffbe94c729a2404.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"ffebdd7a058652ba","topic":"发展与治理","label":"新发展理念","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.新发展理念\n党的十八届五中全会提出了创新、协调、绿色、开放、共享的新发展理念。\n创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要\n条件和人民对美好生活追求的重要体现，开放是国家繁荣发展的必由之路，共享是中国特色\n社会主义的本质要求。\n创新发展注重的是解决发展动力问题，协调发展注重的是解决发展不平衡问题，绿色发\n展注重的是解决人与自然和谐问题，开放发展注重的是解决发展内外联动问题，共享发展注\n重的是解决社会公平正义问题。","source":{"doc":"6cbfb01fe723bba64b75","first":21,"last":21,"page":21,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/5182e8b9a71272f7eb8687bc57a93d2c6ac8c6c69ad7a22daffbe94c729a2404.jpg","mentions":["政治理论必刷100题#25","国考 2023 副省级 行测#5","国考 2023 地市级 行测#4","国考 2024 副省级 行测#2","国考 2024 地市级 行测#5","国考 2025 副省级 行测#7","国考 2025 副省级 行测#48","国考 2025 地市级 行测#7","国考 2025 地市级 行测#51","国考 2025 行政执法 行测#7"],"groups":[]},{"kind":"knowledge","id":"93ad81128acfcedd","topic":"经济指标与宏观调控","label":"财政政策","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.财政政策\n财政政策是指政府运用国家预算和税收等财政手段，通过对国民收入的分配和再分配，\n来实现社会总供给和社会总需求平衡的一种经济政策。","source":{"doc":"6cbfb01fe723bba64b75","first":23,"last":23,"page":23,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/1ebd2c2458f3d5a7e641c553cfbe7f572acdcdea14b009f1f31e03cd7637b075.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"565171d1d657d930","topic":"经济指标与宏观调控","label":"赤字率","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.赤字率\n财政赤字率，是指财政赤字与同期国内生产总值（GDP）的比例。从近年我国赤字率安\n排来看，2024 年为 3%，2025 年提高到 4%左右，今年继续按 4%左右安排。\n赤字率延续 4%左右，是历史上比较高的水平，体现了今年财政政策继续更加积极的取\n向。虽然今年赤字率和去年一样，但由于 GDP 这个分母变大了，所以今年赤字规模比上年增\n加 2300 亿元。","source":{"doc":"6cbfb01fe723bba64b75","first":23,"last":23,"page":23,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/1ebd2c2458f3d5a7e641c553cfbe7f572acdcdea14b009f1f31e03cd7637b075.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"d1d03e4f5f7e9094","topic":"经济指标与宏观调控","label":"一般公共预算支出","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.一般公共预算支出\n一般公共预算支出指国家财政将筹集起来的资金进行分配使用，以满足经济建设和各项\n事业的需要。主要包括：一般公共服务、外交、国防、公共安全、教育、科学技术、文化体\n育与传媒、社会保障和就业、医疗卫生与计划生育、节能环保、城乡社区、农林水、交通运\n输、资源勘探信息等、商业服务业等、金融、援助其他地区、国土海洋气象等、住房保障、\n粮油物资储备、债务付息、债务发行费用等方面的支出。财政支出根据政府在经济和社会活\n动中的不同职权，划分为中央财政支出和地方财政支出。","source":{"doc":"6cbfb01fe723bba64b75","first":23,"last":23,"page":23,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/1ebd2c2458f3d5a7e641c553cfbe7f572acdcdea14b009f1f31e03cd7637b075.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"3cf134cec16fa339","topic":"经济指标与宏观调控","label":"超长期特别国债","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.超长期特别国债\n超长期特别国债，包含三个关键词，超长期、特别、国债。\n超长期，指的是期限。在债券市场上，一般认为发行期限在 10 年以上的利率债为“超\n长期债券”。和普通国债相比，超长期债券能够缓解中短期偿债压力，以时间换空间。\n特别，说的是资金用途。它是为特定目标发行的、具有明确用途的国债，资金需要专款\n专用。\n国债，是国家为了筹集财政资金而发行的一种政府债券，具有最高的信用度，被公认为\n是最安全的投资工具。","source":{"doc":"6cbfb01fe723bba64b75","first":23,"last":24,"page":23,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/1ebd2c2458f3d5a7e641c553cfbe7f572acdcdea14b009f1f31e03cd7637b075.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"05ec04047198eda6","topic":"发展与治理","label":"“两新”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.“两新”\n指大规模设备更新和消费品以旧换新。","source":{"doc":"6cbfb01fe723bba64b75","first":24,"last":24,"page":24,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e000ca1bc33eaad519e2fefb19d37800b9d526496e0b8148fa193571bf92b451.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"17600fc85ffadfaa","topic":"经济指标与宏观调控","label":"基层“三保”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"6.基层“三保”\n基层“三保”，即保基本民生、保工资、保运转，是推动政府履职和各项政策实施的基\n础条件，直接关系经济运行秩序、社会大局稳定以及人民群众切身利益。","source":{"doc":"6cbfb01fe723bba64b75","first":24,"last":24,"page":24,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e000ca1bc33eaad519e2fefb19d37800b9d526496e0b8148fa193571bf92b451.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"977fe73b1089a8fd","topic":"经济指标与宏观调控","label":"货币政策","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"7.货币政策\n货币政策是指中央银行通过控制和调节货币供应量以保持社会总供给和社会总需求平\n衡的一种经济政策。","source":{"doc":"6cbfb01fe723bba64b75","first":24,"last":24,"page":24,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e000ca1bc33eaad519e2fefb19d37800b9d526496e0b8148fa193571bf92b451.jpg","mentions":["江苏 2024 B类 行测#8","江苏 2025 A类 行测#29","江苏 2025 B类 行测#32","江苏 2025 C类 行测#30"],"groups":[]},{"kind":"knowledge","id":"d38a8ce0241af167","topic":"经济指标与宏观调控","label":"结构性货币政策工具","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"8.结构性货币政策工具\n我国的结构性货币政策工具是人民银行引导金融机构信贷投向，发挥精准滴灌、杠杆撬\n动作用的工具，通过提供再贷款或资金激励的方式，支持金融机构加大对特定领域和行业的\n信贷投放，降低企业融资成本。","source":{"doc":"6cbfb01fe723bba64b75","first":24,"last":24,"page":24,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e000ca1bc33eaad519e2fefb19d37800b9d526496e0b8148fa193571bf92b451.jpg","mentions":["江苏 2024 B类 行测#8"],"groups":[]},{"kind":"knowledge","id":"1c1d38d153317062","topic":"产业、科技与对外开放","label":"传统产业","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.传统产业\n传统产业是基本盘、老家底，是现代化产业体系的基底。从各地实践来看，不少传统制\n造业经过技术改造，就转变成了新兴产业，如新材料、新能源汽车正展现出前所未有的发展\n前景。","source":{"doc":"6cbfb01fe723bba64b75","first":26,"last":26,"page":26,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/de51c9c22c6ca31bb23d935e0330e3b04f57db6829d450d90f146147342ddce2.jpg","mentions":["政治理论必刷100题#28","国考 2023 地市级 行测#29","国考 2023 行政执法 行测#31","国考 2025 地市级 行测#62","江苏 2024 A类 行测#20","江苏 2024 B类 行测#3","江苏 2025 A类 行测#3","江苏 2025 B类 行测#3","江苏 2025 C类 行测#3"],"groups":[]},{"kind":"knowledge","id":"f5b282a655709f81","topic":"产业、科技与对外开放","label":"新兴产业和未来产业","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.新兴产业和未来产业\n新兴产业技术含量高、附加值高、资源集约，成长潜力大，综合效益好，对经济社会全\n局和长远发展具有重大引领带动作用，是当前各地争相布局的领域，如 5G、先进计算、智\n能网联汽车等。\n未来产业代表着科技和产业的发展方向，科技含量高、绿色发展足、产业关联强、市场\n空间大，是抢占未来竞争制高点的关键，如人工智能、人形机器人、元宇宙等领域，但与新\n兴产业不同，未来产业更前沿，发展成熟度相对较低，产业成长的不确定性更大，培育周期\n更长，不能急功近利。","source":{"doc":"6cbfb01fe723bba64b75","first":26,"last":26,"page":26,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/de51c9c22c6ca31bb23d935e0330e3b04f57db6829d450d90f146147342ddce2.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"2d18c5c2ed0e2deb","topic":"产业、科技与对外开放","label":"服务业","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.服务业\n第一产业是指农、林、牧、渔业（不含农、林、牧、渔专业及辅助性活动）。第二产业\n是指采矿业（不含开采专业及辅助性活动），制造业（不含金属制品、机械和设备修理业），\n电力、热力、燃气及水生产和供应业，建筑业。第三产业即服务业，是指除第一产业、第二\n产业以外的其他行业，包括：批发和零售业，交通运输、仓储和邮政业，住宿和餐饮业，信\n息传输、软件和信息技术服务业，金融业，房地产业，租赁和商务服务业，科学研究和技术\n服务业，水利、环境和公共设施管理业，居民服务、修理和其他服务业，教育，卫生和社会\n工作，文化、体育和娱乐业，公共管理、社会保障和社会组织，国际组织，以及农、林、牧、\n渔业中的农、林、牧、渔专业及辅助性活动，采矿业中的开采专业及辅助性活动，制造业中\n的金属制品、机械和设备修理业。","source":{"doc":"6cbfb01fe723bba64b75","first":26,"last":26,"page":26,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/de51c9c22c6ca31bb23d935e0330e3b04f57db6829d450d90f146147342ddce2.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b1849da23e5bae07","topic":"发展与治理","label":"高质量发展","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.高质量发展\n高质量发展是能够满足人民日益增长的美好生活需要的发展，是体现新发展理念的发\n展，是创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、\n共享成为根本目的的发展。\n习近平总书记在党的二十大报告中强调，“高质量发展是全面建设社会主义现代化国家\n的首要任务。发展是党执政兴国的第一要务。没有坚实的物质技术基础，就不可能全面建成\n社会主义现代化强国。”","source":{"doc":"6cbfb01fe723bba64b75","first":27,"last":27,"page":27,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/47c431bb5253bb5d05241e5b3bcba0b6ea59a15b3a27b38b3c83b7280751ef5d.jpg","mentions":["政治理论必刷100题#7","政治理论必刷100题#11","政治理论必刷100题#12","政治理论必刷100题#16","政治理论必刷100题#29","政治理论必刷100题#38","政治理论必刷100题#65","政治理论必刷100题#71","政治理论必刷100题#75","政治理论必刷100题#76","政治理论必刷100题#79","国考 2023 副省级 行测#5","国考 2023 副省级 行测#7","国考 2023 地市级 行测#4","国考 2023 行政执法 行测#5","国考 2023 行政执法 行测#30","国考 2023 行政执法 行测#53","国考 2024 副省级 行测#2","国考 2024 副省级 行测#6","国考 2024 副省级 行测#49","国考 2024 地市级 行测#2","国考 2024 地市级 行测#5","国考 2024 地市级 行测#21","国考 2024 地市级 行测#48","国考 2024 地市级 行测#55","国考 2024 地市级 行测#58","国考 2024 行政执法 行测#2","国考 2024 行政执法 行测#22","国考 2024 行政执法 行测#44","国考 2024 行政执法 行测#47","国考 2025 副省级 行测#5","国考 2025 副省级 行测#20","国考 2025 副省级 行测#48","国考 2025 副省级 行测#55","国考 2025 地市级 行测#5","国考 2025 地市级 行测#20","国考 2025 地市级 行测#51","国考 2025 地市级 行测#65","国考 2025 行政执法 行测#5","国考 2025 行政执法 行测#20","江苏 2023 A类 行测#20","江苏 2024 A类 行测#16","江苏 2024 A类 行测#24","江苏 2024 A类 行测#29","江苏 2024 B类 行测#3","江苏 2024 B类 行测#21","江苏 2024 B类 行测#27","江苏 2024 C类 行测#16","江苏 2024 C类 行测#17","江苏 2024 C类 行测#21","江苏 2025 A类 行测#3","江苏 2025 B类 行测#3","江苏 2025 C类 行测#3"],"groups":[]},{"kind":"knowledge","id":"af1bf95a1262a21a","topic":"产业、科技与对外开放","label":"新型举国体制","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.新型举国体制\n新型举国体制是以国家发展和国家安全为目标，通过统筹资源配置与跨领域协同攻关，\n集中力量突破关键核心技术的国家战略组织模式。","source":{"doc":"6cbfb01fe723bba64b75","first":27,"last":27,"page":27,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/47c431bb5253bb5d05241e5b3bcba0b6ea59a15b3a27b38b3c83b7280751ef5d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"bc07e3e31a3a719f","topic":"产业、科技与对外开放","label":"科学家精神","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.科学家精神\n科学家精神是胸怀祖国、服务人民的爱国精神，勇攀高峰、敢为人先的创新精神，追\n求真理、严谨治学的求实精神，淡泊名利、潜心研究的奉献精神，集智攻关、团结协作的\n协同精神，甘为人梯、奖掖后学的育人精神。2021 年 9 月科学家精神被纳入为第一批中国\n共产党人精神谱系的伟大精神。","source":{"doc":"6cbfb01fe723bba64b75","first":27,"last":27,"page":27,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/47c431bb5253bb5d05241e5b3bcba0b6ea59a15b3a27b38b3c83b7280751ef5d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"c8060276eb2d793b","topic":"发展与治理","label":"高水平社会主义市场经济体制","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.高水平社会主义市场经济体制\n党的二十届三中全会鲜明提出进一步全面深化改革要“以经济体制改革为牵引”、“高\n水平社会主义市场经济体制是中国式现代化的重要保障”等重大论断，明确“到二〇三五\n年，全面建成高水平社会主义市场经济体制”。高水平社会主义市场经济体制，是我们党对\n市场经济理论的发展与深化，是推进中国式现代化的重要保障。以保障中国式现代化为重要\n目标构建高水平社会主义市场经济体制，必须坚持系统集成方法，处理好经济和社会、政府\n和市场、效率和公平、活力和秩序、发展和安全等重大关系，更好推动经济建设、政治建\n设、文化建设、社会建设、生态文明建设取得更大成效。","source":{"doc":"6cbfb01fe723bba64b75","first":28,"last":28,"page":28,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8311eeafcc97ad321d1b0f98b47ecfce028ad8b3498f007e2616268a7ed44e59.jpg","mentions":["国考 2025 副省级 行测#17","国考 2025 地市级 行测#17","国考 2025 行政执法 行测#17","江苏 2025 A类 行测#6","江苏 2025 B类 行测#6","江苏 2025 C类 行测#6"],"groups":[]},{"kind":"knowledge","id":"a8fb7fb9427e00cc","topic":"发展与治理","label":"推进全国统一大市场建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.推进全国统一大市场建设\n《中共中央 国务院关于加快建设全国统一大市场的意见》于 2022 年 4 月 10 日发布。\n《意见》指出，建设全国统一大市场是构建新发展格局的基础支撑和内在要求。《意见》指\n出，加快建设全国统一大市场的工作原则是：立足内需，畅通循环；立破并举，完善制度；\n有效市场，有为政府；系统协同，稳妥推进；主要目标是：持续推动国内市场高效畅通和\n规模拓展，加快营造稳定公平透明可预期的营商环境，进一步降低市场交易成本，促进科\n技创新和产业升级，培育参与国际竞争合作新优势。","source":{"doc":"6cbfb01fe723bba64b75","first":28,"last":28,"page":28,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8311eeafcc97ad321d1b0f98b47ecfce028ad8b3498f007e2616268a7ed44e59.jpg","mentions":["政治理论必刷100题#16"],"groups":[]},{"kind":"knowledge","id":"91979075c3e6c911","topic":"发展与治理","label":"“内卷式”竞争","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.“内卷式”竞争\n内卷式竞争，主要表现为在同一领域内过度竞争、资源消耗大但效益提升有限的现象。","source":{"doc":"6cbfb01fe723bba64b75","first":28,"last":28,"page":28,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8311eeafcc97ad321d1b0f98b47ecfce028ad8b3498f007e2616268a7ed44e59.jpg","mentions":["政治理论必刷100题#36"],"groups":[]},{"kind":"knowledge","id":"a99150c81cc39c7c","topic":"发展与治理","label":"国有资本","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.国有资本\n国有资本是指国家对企业各种形式的出资所形成的权益，包括国有独资企业、国有控\n股及参股企业的所有者权益中国家享有的份额。","source":{"doc":"6cbfb01fe723bba64b75","first":29,"last":29,"page":29,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8029bb302ec825aa9bd37cbc479e6b35ab3027e6a6c51b2a7811ff6a6ff3b725.jpg","mentions":["江苏 2025 B类 行测#12"],"groups":[]},{"kind":"knowledge","id":"8f207ee51f5e40d8","topic":"经济指标与宏观调控","label":"零基预算","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.零基预算\n零基预算是不考虑过去的预算项目和收支水平，以零为基点编制的预算，具体指不受以\n往预算安排情况的影响，一切从实际需要出发，逐项审议预算年度内各项费用的内容及其开\n支标准，结合财力状况，在综合平衡的基础上编制预算的一种科学的现代预算编制方法。","source":{"doc":"6cbfb01fe723bba64b75","first":29,"last":29,"page":29,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8029bb302ec825aa9bd37cbc479e6b35ab3027e6a6c51b2a7811ff6a6ff3b725.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"39174200a2f5f745","topic":"发展与治理","label":"“两个毫不动摇”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.“两个毫不动摇”\n即“毫不动摇巩固和发展公有制经济”“毫不动摇鼓励、支持、引导非公有制经济发\n展”。\n党的十六大提出：“必须毫不动摇地巩固和发展公有制经济”“必须毫不动摇地鼓励、\n支持和引导非公有制经济发展”。党的十八大进一步提出：“毫不动摇鼓励、支持、引导非\n公有制经济发展，保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受\n到法律保护。”\n党的十九大把“两个毫不动摇”写入新时代坚持和发展中国特色社会主义的基本方略，\n作为党和国家一项大政方针进一步确定下来。党的二十大提出：“坚持和完善社会主义基本\n经济制度，毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发\n展”。","source":{"doc":"6cbfb01fe723bba64b75","first":29,"last":29,"page":29,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8029bb302ec825aa9bd37cbc479e6b35ab3027e6a6c51b2a7811ff6a6ff3b725.jpg","mentions":["政治理论必刷100题#43","江苏 2025 A类 行测#6","江苏 2025 B类 行测#6","江苏 2025 C类 行测#6"],"groups":[]},{"kind":"knowledge","id":"213cbd4fab59c3ce","topic":"产业、科技与对外开放","label":"民营经济","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.民营经济\n民营经济是我国经济制度的内在要素。民营经济是社会主义市场经济发展的重要成果，\n是推动社会主义市场经济发展的重要力量，是推进供给侧结构性改革、推动高质量发展、建\n设现代化经济体系的重要主体，也是我们党长期执政、团结带领全国人民实现“两个一百年”\n奋斗目标和中华民族伟大复兴中国梦的重要力量。\n习近平总书记在民营企业座谈会上的讲话中指出，我国民营经济已经成为推动我国发展\n不可或缺的力量，成为创业就业的主要领域、技术创新的重要主体、国家税收的重要来源，\n为我国社会主义市场经济发展、政府职能转变、农村富余劳动力转移、国际市场开拓等发挥\n了重要作用。\n——2018 年 11 月习近平在民营企业座谈会上的讲话","source":{"doc":"6cbfb01fe723bba64b75","first":29,"last":30,"page":29,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/8029bb302ec825aa9bd37cbc479e6b35ab3027e6a6c51b2a7811ff6a6ff3b725.jpg","mentions":["政治理论必刷100题#12","国考 2024 副省级 行测#2","国考 2024 地市级 行测#5"],"groups":[]},{"kind":"knowledge","id":"ac232bb3da2166c7","topic":"产业、科技与对外开放","label":"中国特色现代企业制度","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.中国特色现代企业制度\n党的十九届四中全会提出“深化国有企业改革，完善中国特色现代企业制度”，这是中\n央文件首次提出了“中国特色现代企业制度”的概念。习近平总书记指出“坚持党对国有企\n业的领导是重大政治原则，必须一以贯之；建立现代企业制度是国有企业的方向，也必须一\n以贯之。”现代企业制度定义为以市场经济为基础，以企业法人制度为主体，以公司制度\n为核心，以产权清晰、权责明确、政企分开、管理科学为条件的新型企业制度。“中国特\n色现代国有企业制度，‘特’就特在把党的领导融入公司治理各环节，把企业党组织内嵌到\n公司治理结构之中，明确和落实党组织在公司法人治理结构中的法定地位，做到组织落实、\n干部到位、职责明确、监督严格。”","source":{"doc":"6cbfb01fe723bba64b75","first":30,"last":30,"page":30,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d9220f67d9c334f294249857eebe1584a148047b2d094e8c3c15c74adbe6c739.jpg","mentions":["政治理论必刷100题#46"],"groups":[]},{"kind":"knowledge","id":"7e4f8c5b6fe5331b","topic":"产业、科技与对外开放","label":"企业家精神","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.企业家精神\n增强爱国情怀，勇于创新，诚信守法，承担社会责任，拓展国际视野。\n企业家要带领企业战胜当前的困难，走向更辉煌的未来，就要弘扬企业家精神，在爱国、\n创新、诚信、社会责任和国际视野等方面不断提升自己，努力成为新时代构建新发展格局、\n建设现代化经济体系、推动高质量发展的生力军。\n——2020 年 7 月 21 日，习近平在企业家座谈会上的讲话","source":{"doc":"6cbfb01fe723bba64b75","first":30,"last":30,"page":30,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d9220f67d9c334f294249857eebe1584a148047b2d094e8c3c15c74adbe6c739.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"31699340f47012e7","topic":"产业、科技与对外开放","label":"制度型开放","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.制度型开放\n“制度型开放”是 2018 年中央经济工作会议关于开放的新表述。会议要求，推动全方\n位对外开放。要适应新形势、把握新特点，推动由商品和要素流动型开放向规则等制度型开\n放转变。党的十九届四中全会、二十大、二十届三中全会以及第十四届全国人民代表大会\n《2025 年国务院政府工作报告》均强调“稳步扩大制度型开放”。\n制度型开放的核心要义是通过系统性、高质量的制度供给，增强开放的包容性、兼容\n性和可预期性，为各类市场主体营造稳定公平的发展环境。制度型开放为国家治理现代化提\n供了外部动力与实践路径，通过对接国际高标准规则倒逼国内制度改革创新，破解治理体系\n中的堵点难点","source":{"doc":"6cbfb01fe723bba64b75","first":31,"last":31,"page":31,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a0e579e40ada75a88163b36e0bf8592533058fc5ddfa465a9461525e66a5572d.jpg","mentions":["政治理论必刷100题#13","政治理论必刷100题#31","政治理论必刷100题#35","政治理论必刷100题#39","政治理论必刷100题#42","国考 2025 副省级 行测#12","国考 2025 地市级 行测#12","国考 2025 行政执法 行测#12"],"groups":[]},{"kind":"knowledge","id":"58be95d753eb210f","topic":"产业、科技与对外开放","label":"国家服务业扩大开放综合示范区","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.国家服务业扩大开放综合示范区\n国家服务业扩大开放综合示范区（简称“综合示范区”），是党中央、国务院着眼于构\n建以国内大循环为主体、国内国际双循环相互促进的新发展格局，着眼于建设迈向中华民\n族伟大复兴的社会主义大国首都，作出的重大战略决策，充分体现了以习近平同志为核心的\n党中央对北京工作的高度重视和亲切关怀，为本市进一步深化改革、扩大开放，推动服务业\n高质量发展提供了根本遵循。","source":{"doc":"6cbfb01fe723bba64b75","first":31,"last":31,"page":31,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a0e579e40ada75a88163b36e0bf8592533058fc5ddfa465a9461525e66a5572d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b82351c495067b45","topic":"产业、科技与对外开放","label":"《数字经济伙伴关系协定》","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.《数字经济伙伴关系协定》\n《数字经济伙伴关系协定》由新加坡、智利、新西兰三国于 2020 年 6 月 12 日线上签署，\n是旨在加强三国间数字贸易合作并建立相关规范的数字贸易协定。","source":{"doc":"6cbfb01fe723bba64b75","first":31,"last":31,"page":31,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a0e579e40ada75a88163b36e0bf8592533058fc5ddfa465a9461525e66a5572d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b59026e7637ea40b","topic":"产业、科技与对外开放","label":"《全面与进步跨太平洋伙伴关系协定》","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.《全面与进步跨太平洋伙伴关系协定》\n《全面与进步跨太平洋伙伴关系协定》（CPTPP），是在 TPP 基础上构建的一个自由化\n水平高、涵盖领域广、纪律要求严的自贸协定。该协定致力于维护开放市场，增加世界贸易，\n为不同收入水平和经济背景的人民创造新的经济机会；促进缔约方之间进一步区域经济一体\n化与合作；为加快区域贸易自由化和投资增加机会；2021 年 9 月 16 日，中国正式提出申请\n加入《全面与进步跨太平洋伙伴关系协定》。","source":{"doc":"6cbfb01fe723bba64b75","first":31,"last":31,"page":31,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a0e579e40ada75a88163b36e0bf8592533058fc5ddfa465a9461525e66a5572d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"c9009f5add19e0d6","topic":"产业、科技与对外开放","label":"数字贸易","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.数字贸易\n数字贸易是指以数据为关键生产要素、数字服务为核心、数据订购与交付为主要特征的\n贸易，是数字经济和高水平对外开放的重要组成部分。","source":{"doc":"6cbfb01fe723bba64b75","first":31,"last":31,"page":31,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a0e579e40ada75a88163b36e0bf8592533058fc5ddfa465a9461525e66a5572d.jpg","mentions":["政治理论必刷100题#22","政治理论必刷100题#48","国考 2024 行政执法 行测#7"],"groups":[]},{"kind":"knowledge","id":"3c5bec9cce016d1d","topic":"产业、科技与对外开放","label":"绿色贸易","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.绿色贸易\n发展绿色贸易，既要加快发展绿色货物贸易，也要加快发展绿色服务贸易。发展绿色货\n物贸易，就是要在货物生产的整个生命周期中，从原材料生产、货物研发设计、加工制造、\n运输、使用，到最终处置，对环境影响最小化。","source":{"doc":"6cbfb01fe723bba64b75","first":32,"last":32,"page":32,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a369b4a949f829186ce86f6c81e33777f07cefaaf3bcc7f2be0804c9ce3ab6e7.jpg","mentions":["政治理论必刷100题#22"],"groups":[]},{"kind":"knowledge","id":"10bee87fb2da039b","topic":"产业、科技与对外开放","label":"“一带一路”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.“一带一路”\n“一带一路”是“丝绸之路经济带”和“21 世纪海上丝绸之路”的简称。中国支持高\n质量共建“一带一路”的八项行动：\n①构建“一带一路”立体互联互通网络。②支持建设开放型世界经济。③开展务实合作。\n④促进绿色发展。⑤推动科技创新。⑥支持民间交往。⑦建设廉洁之路。⑧完善“一带一路”\n国际合作机制。","source":{"doc":"6cbfb01fe723bba64b75","first":32,"last":32,"page":32,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a369b4a949f829186ce86f6c81e33777f07cefaaf3bcc7f2be0804c9ce3ab6e7.jpg","mentions":["政治理论必刷100题#13","政治理论必刷100题#89","国考 2023 副省级 行测#135","国考 2023 行政执法 行测#130","国考 2025 地市级 行测#128","江苏 2024 A类 行测#2","江苏 2024 C类 行测#3"],"groups":[]},{"kind":"knowledge","id":"5bfcba55f93da9ec","topic":"发展与治理","label":"“硬联通”、“软联通”、“心联通”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.“硬联通”、“软联通”、“心联通”\n“硬联通”指基础设施建设，包括铁路、港口、公路等硬件的联通。它为合作提供了物\n质基础，能够降低贸易成本；“软联通”是指规则标准、制度机制的对接，涵盖海关、税收、\n技术标准等方面的协调。软联通为深化合作提供了制度保障，有助于促进区域市场一体化。\n通过统一规则和标准，减少了贸易壁垒和合作中的不确定性，使得不同地区之间的经济交流\n更加顺畅；“心联通”强调民众间的情感、文化、价值认同。它通过人文交流来增进信任，\n为“软硬联通”奠定民意基础。\n2021 年 11 月 19 日，习近平总书记在出席第三次“一带一路”建设座谈会并发表重要\n讲话时强调，把基础设施“硬联通”作为重要方向，把规则标准“软联通”作为重要支撑，\n把同共建国家人民“心联通”作为重要基础。","source":{"doc":"6cbfb01fe723bba64b75","first":32,"last":32,"page":32,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a369b4a949f829186ce86f6c81e33777f07cefaaf3bcc7f2be0804c9ce3ab6e7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1616b8b5c8fdf88d","topic":"发展与治理","label":"重大标志性工程和“小而美”民生项目","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.重大标志性工程和“小而美”民生项目\n党的二十届三中全会审议通过的《中共中央关于进一步全面深化改革、推进中国式现代\n化的决定》提出，统筹推进重大标志性工程和“小而美”民生项目。\n重大标志性工程指规模宏大、具有战略意义的基础设施或经济项目，通常为国家长远发\n展提供核心支撑；小而美民生项目指规模较小、直接改善民众日常生活质量的项目，注重实\n效与可感知性，旨在解决民众关心的具体问题。","source":{"doc":"6cbfb01fe723bba64b75","first":32,"last":33,"page":32,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/a369b4a949f829186ce86f6c81e33777f07cefaaf3bcc7f2be0804c9ce3ab6e7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"e9d0d7601968f8ce","topic":"产业、科技与对外开放","label":"西部陆海新通道","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.西部陆海新通道\n西部陆海新通道位于中国西部地区腹地，北接丝绸之路经济带，南连 21 世纪海上丝绸\n之路，协同衔接长江经济带，在区域协调发展格局中具有重要战略地位。该通道利用铁路、\n公路、水运、航空等多种运输方式，由重庆向南经贵州等省份，通过广西北部湾等沿海沿边\n口岸，通达新加坡及东盟主要物流节点，运行时间比经东部地区出海节约 10 天左右。向北\n与中欧班列连接，利用兰渝铁路及西北地区主要物流节点，通达中亚、南亚、欧洲等区域。\n“陆海新通道”已与中欧班列和长江黄金水道实现联通，并已初步实现丝绸之路经济带和\n21 世纪海上丝绸之路的有机衔接。","source":{"doc":"6cbfb01fe723bba64b75","first":33,"last":33,"page":33,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d994b26612c565bb6d136cdd4809c7ffe8b05a6cbdbdaca20d106b1ce039bdd3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"7d9fd781d17f69b8","topic":"农业与城乡治理","label":"“三农”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.“三农”\n“三农”，即农村、农业和农民。自 2004 年至 2026 年，中共中央、国务院已连续二十\n三年以中央一号文件的形式聚焦“三农”议题。","source":{"doc":"6cbfb01fe723bba64b75","first":33,"last":33,"page":33,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d994b26612c565bb6d136cdd4809c7ffe8b05a6cbdbdaca20d106b1ce039bdd3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"ae3e8603d2c7cdac","topic":"农业与城乡治理","label":"“千万工程”经验","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.“千万工程”经验\n2003 年，时任浙江省委书记的习近平同志在广泛深入调查研究基础上，立足浙江省情\n农情和发展阶段特征，准确把握经济社会发展规律和趋势，作出了实施“千村示范、万村整\n治”工程（“千万工程”）的战略决策，在浙江近 4 万个村庄中选择 1 万个左右的行政村进\n行全面整治，把其中 1000 个左右的中心村建设成全面小康示范村，并以此为龙头，深入推\n进社会主义新农村建设。","source":{"doc":"6cbfb01fe723bba64b75","first":33,"last":34,"page":33,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d994b26612c565bb6d136cdd4809c7ffe8b05a6cbdbdaca20d106b1ce039bdd3.jpg","mentions":["江苏 2025 A类 行测#10"],"groups":[]},{"kind":"knowledge","id":"9784754828cadfa9","topic":"农业与城乡治理","label":"多元化食物供给体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.元化食物供给\n《国务院办公厅关于践行大食物观构建多元化食物供给体系的意见》指出，树立大农业\n观、大食物观，农林牧渔并举，构建多元化食物供给体系，是党中央提出的明确要求，是\n保障粮食和重要农产品稳定安全供给的客观要求和重要举措。\n构建多元化食物供给体系，全方位、多途径开发食物资源，有利于更好满足人民群众日\n益多元化的食物消费需求，实现从“吃得饱”向“吃得好”升级。\n构建多元化食物供给体系有两层含义。一是拓宽食物供给渠道，提高食物来源结构的多\n元化水平。除了向耕地和植物动物要食物，还要进一步开发草原森林海洋资源，挖掘微生物\n和生物工程技术潜力，加强对非常规农业生产空间的开发和利用。二是增加食物供给种类，\n提高食物产品构成的多元化水平。除了粮食，还要增加肉类、蔬菜、水果、水产品等各类食\n物供给，既保障传统的以口粮为主的粮食安全，也保障肉蛋奶蔬果油糖等非口粮重要农产品\n的供给安全。","source":{"doc":"6cbfb01fe723bba64b75","first":34,"last":34,"page":34,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/3e016b899a62d0aab86f764bf243dcf5c4deb4c6ae4be296351b9af4ec15e4cd.jpg","mentions":["国考 2025 副省级 行测#6","国考 2025 地市级 行测#6","国考 2025 行政执法 行测#6"],"groups":[]},{"kind":"knowledge","id":"ac62f51740fec606","topic":"农业与城乡治理","label":"耕地红线","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.耕地红线\n耕地红线是指经常进行耕种的土地面积的最低值，守住耕地红线旨在确保国家粮食安全。\n国务院印发《全国土地利用总体规划纲要（2006—2020 年）》提出，确保 18 亿亩的耕地红\n线。","source":{"doc":"6cbfb01fe723bba64b75","first":34,"last":34,"page":34,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/3e016b899a62d0aab86f764bf243dcf5c4deb4c6ae4be296351b9af4ec15e4cd.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"18b15dd81bc52dab","topic":"农业与城乡治理","label":"高标准农田建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.高标准农田建设\n高标准农田是指通过土地整治、设施完善和生态优化形成的旱涝保收、高产稳产耕地，\n具有集中连片、土壤肥沃、抗灾能力强等特点，是国家粮食安全的核心保障。《逐步把永久\n基本农田建成高标准农田实施方案》提出到 2030 年，力争累计建成高标准农田 13.5 亿亩，\n累计改造提升 2.8 亿亩，统筹规划、同步实施高效节水灌溉，新增高效节水灌溉面积 8000\n万亩；到 2035 年，力争将具备条件的永久基本农田全部建成高标准农田，累计改造提升 4.55\n亿亩，新增高效节水灌溉面积 1.3 亿亩。","source":{"doc":"6cbfb01fe723bba64b75","first":34,"last":34,"page":34,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/3e016b899a62d0aab86f764bf243dcf5c4deb4c6ae4be296351b9af4ec15e4cd.jpg","mentions":["国考 2024 副省级 申论#4","国考 2025 副省级 行测#6","国考 2025 地市级 行测#6","国考 2025 行政执法 行测#6"],"groups":[]},{"kind":"knowledge","id":"64e0a00ebe161aac","topic":"农业与城乡治理","label":"乡村振兴战略","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.乡村振兴战略\n党的十九大报告提出实施乡村振兴战略。实施乡村振兴战略，是以习近平同志为核心的\n党中央着眼党和国家事业全局作出的重大决策，是新时代新征程“三农”工作的总抓手。\n实施乡村振兴战略，坚持农业农村优先发展是总方针，产业兴旺、生态宜居、乡风文明、\n治理有效、生活富裕是总要求，建立健全城乡融合发展体制机制和政策体系是制度保障。\n实施乡村振兴战略，要坚持乡村全面振兴，实现乡村产业振兴、人才振兴、文化振兴、\n生态振兴、组织振兴，推动农业全面升级、农村全面进步、农民全面发展。、","source":{"doc":"6cbfb01fe723bba64b75","first":35,"last":35,"page":35,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4c6f19afa9a539a2b780385d37ab0771e11d58036fad90328c2cfa2698f34dd0.jpg","mentions":["政治理论必刷100题#34"],"groups":[]},{"kind":"knowledge","id":"09d945517be41756","topic":"农业与城乡治理","label":"开发式帮扶","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.开发式帮扶\n开发式帮扶是指以促进农村低收入群体形成自我发展能力为目标的帮扶方式，旨在激发\n农村低收入群体的内生动力，从“被动受助”转向“主动发展”，提高自我“造血”能力。","source":{"doc":"6cbfb01fe723bba64b75","first":35,"last":35,"page":35,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4c6f19afa9a539a2b780385d37ab0771e11d58036fad90328c2cfa2698f34dd0.jpg","mentions":[],"grou
