ps":[]},{"kind":"knowledge","id":"52998774d3311fa2","topic":"就业、社保与公共服务","label":"社会救助","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.社会救助\n社会救助与社会保险、社会福利、社会优抚等其他社会保障形式，共同构成我国的社会\n保障体系。其中，社会救助是最先形成的、历史最悠久的社会保障形式，是保障社会成员生\n活安全和生存权利的“最后一道防线”。","source":{"doc":"6cbfb01fe723bba64b75","first":35,"last":35,"page":35,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4c6f19afa9a539a2b780385d37ab0771e11d58036fad90328c2cfa2698f34dd0.jpg","mentions":["国考 2025 行政执法 行测#40"],"groups":[]},{"kind":"knowledge","id":"80b0764101d67b48","topic":"农业与城乡治理","label":"健全现代农业经营体系和社会化服务体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.健全现代农业经营体系和社会化服务体系\n党的二十届三中全会提出“完善农业经营体系”“健全便捷高效的农业社会化服务体系”。","source":{"doc":"6cbfb01fe723bba64b75","first":36,"last":36,"page":36,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/7444b52b99e8a517f086f0e140b65b6b89347f99e7660be4afed6aa761270558.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8946d0f381a26309","topic":"农业与城乡治理","label":"新型农村集体经济","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.新型农村集体经济\n新型农村集体经济，是指在社会主义市场经济体制下，依托现代科技与管理理念，以农\n民为主体，对传统集体经济进行创新的经济形态。党的二十大报告提出，巩固和完善农村基\n本经营制度，发展新型农村集体经济。2023 年中央一号文件提出，构建产权关系明晰、治\n理架构科学、经营方式稳健、收益分配合理的运行机制，探索资源发包、物业出租、居间\n服务、资产参股等多样化途径发展新型农村集体经济。","source":{"doc":"6cbfb01fe723bba64b75","first":36,"last":36,"page":36,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/7444b52b99e8a517f086f0e140b65b6b89347f99e7660be4afed6aa761270558.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"177047d974024efc","topic":"发展与治理","label":"“钉钉子精神”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.“钉钉子精神”\n我们要有钉钉子的精神，钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，\n直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效。如果东一榔头西\n一棒子，结果很可能是一颗钉子都钉不上、钉不牢。\n——《习近平谈治国理政》","source":{"doc":"6cbfb01fe723bba64b75","first":36,"last":36,"page":36,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/7444b52b99e8a517f086f0e140b65b6b89347f99e7660be4afed6aa761270558.jpg","mentions":["国考 2024 副省级 行测#32"],"groups":[]},{"kind":"knowledge","id":"cc7e2aa6219f2cfa","topic":"发展与治理","label":"区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.区域协调发展战略、区域重大战略、主体功能区战略和新型城镇化战略\n区域协调发展战略：党的十八大以来，党中央强化举措推进西部大开发、东北振兴、中\n部崛起和东部率先发展，推动实施区域协调发展战略成为我国空间治理的基础战略。\n——求是网\n区域重大战略：是指党的十八大以来实施的京津冀协同发展、长江经济带发展、粤港澳\n大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展等若干区域发展战略。区\n域重大战略的实施充分考虑了我国国土空间类型多样、差别巨大的客观实际，旨在从不同空\n间尺度、区域类型和功能定位推动战略重点区域加快发展，发挥对区域经济发展布局的示范\n引领和辐射带动作用。\n——国家发改委\n主体功能区战略：主体功能区是基于不同区域的资源环境承载能力、现有开发密度和发\n展潜力等，将特定区域确定为特定主体功能定位类型的一种空间单元。按开发强度划分为优\n化开发、重点开发、限制开发和禁止开发四类地区，按主体功能划分为城市化地区、农产品\n主产区和重点生态功能区三类地区。2011 年，“十二五”规划纲要明确提出“实施主体功\n能区战略”，将其上升至国家战略层面，此后主体功能区战略一直是指导我国区域经济发展\n的重大战略。\n——国家治理网\n城镇化是现代化的必由之路，是解决农业、农村、农民问题的重要途径，是推动区域协\n调发展的有力支撑，是扩大内需和促进产业升级的重要抓手。深入实施以人为本的新型城镇\n化战略，要坚持以人民为中心的发展思想，坚持稳中求进工作总基调，完整准确全面贯彻\n新发展理念，加快构建新发展格局，着力推动高质量发展，以满足人民日益增长的美好生\n活需要为根本目的，以体制机制改革为动力，因势利导、顺势而为，因地制宜、分类施策，\n稳步提高城镇化质量和水平，充分释放新型城镇化蕴藏的巨大内需潜力，持续推动经济实现\n质的有效提升和量的合理增长，为中国式现代化提供强劲动力和坚实支撑。\n——坚持以人为本。把推进农业转移人口市民化作为新型城镇化首要任务，坚持人民城\n市人民建、人民城市为人民，充分尊重人的意愿，调动和发挥好人的积极性主动性创造性，\n促进人的全面发展和社会公平正义，使全体居民共享现代化发展成果。\n——坚持遵循规律。立足我国国情，遵循自然规律、经济规律特别是城市发展规律，统\n筹新型工业化、新型城镇化和乡村全面振兴，充分发挥市场在资源配置中的决定性作用，更\n好发挥政府作用，提高资源配置效率。\n——坚持分类施策。统筹各地区资源环境承载能力、功能定位、城镇化发展水平和人口\n规模，因地制宜确定城镇化建设重点方向，积极稳妥、扎实推进，不搞齐步走、“一刀切”，\n形成各具特色的发展路径。\n——坚持集约高效。在全国“三区三线”划定成果基础上，有效集聚各类要素，促进城\n镇发展与产业支撑、就业转移、人口集聚相统一，构建科学合理的城镇化格局，推动城乡融\n合、区域协调发展。\n——《深入实施以人为本的新型城镇化战略五年行动计划》","source":{"doc":"6cbfb01fe723bba64b75","first":37,"last":38,"page":37,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e13d8f0bc07947afe9c134c408fb9e9571054fc10920ab81a6716a4a08faeb6e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"06eb2511c8386498","topic":"农业与城乡治理","label":"“人地钱”挂钩","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.“人地钱”挂钩\n“人地钱”挂钩是通过建立人口流动、土地指标、财政资金的联动机制，将城镇建设用\n地指标分配、财政转移支付与城市吸纳农业转移人口的数量挂钩，实现“人多就多给地、多\n给钱”的激励导向。","source":{"doc":"6cbfb01fe723bba64b75","first":38,"last":38,"page":38,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/ff78171d8f17f33cced512c48538d784cc55552731134b76b1b5fd2e60c4a509.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"15733f04bfae52f3","topic":"农业与城乡治理","label":"城市内涵式发展","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.城市内涵式发展\n2025 年中央城市工作会议强调，当前和今后一个时期城市工作要“以坚持城市内涵式\n发展为主线”。《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》指出，\n要“坚持城市内涵式发展，大力实施城市更新，建设创新、宜居、美丽、韧性、文明、智\n慧的现代化人民城市”。\n城市内涵式发展是指与“外延式扩张”相对的一种城市发展模式，强调在城镇化进程进\n入中后期后，从依赖规模扩张转向注重内部质量提升、结构优化和效率改善，以实现城市的\n高质量、可持续发展。","source":{"doc":"6cbfb01fe723bba64b75","first":38,"last":38,"page":38,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/ff78171d8f17f33cced512c48538d784cc55552731134b76b1b5fd2e60c4a509.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"43e04b6be1671410","topic":"农业与城乡治理","label":"城市治理智慧化精细化","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.城市治理智慧化精细化\n城市治理智慧化，就是以大数据、云计算、物联网等技术手段提升城市运行效率、公共\n服务质量和风险应对能力等，通过全域感知、智能研判和精准执行，让城市具备动态响应与\n自我优化的能力。城市治理精细化，则是兼顾科学管理与人本关怀，通过将治理对象、流程、\n责任落到最小单元，使治理更具温度、更加精细、更体现公平性，持续提升人民群众的获得\n感、幸福感、安全感。城市治理智慧化和精细化两者协同，有助于形成科学化、规范化、人\n性化的治理模式，推动城市治理更高效、更有序、更有温度。\n习近平总书记指出：“一流城市要有一流治理，要注重在科学化、精细化、智能化上下\n功夫。既要善于运用现代科技手段实现智能化，又要通过绣花般的细心、耐心、巧心提高\n精细化水平，绣出城市的品质品牌。”推动城市治理智慧化精细化，注重创新城市治理的理\n念、模式、手段，是深入践行人民城市理念的重要举措，是推进以人为本的新型城镇化的\n必然要求，是提升城市治理水平、推进城市治理现代化的重要方面。","source":{"doc":"6cbfb01fe723bba64b75","first":38,"last":39,"page":38,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/ff78171d8f17f33cced512c48538d784cc55552731134b76b1b5fd2e60c4a509.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"13db55925b136dac","topic":"就业、社保与公共服务","label":"普惠性、基础性、兜底性民生建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.普惠性、基础性、兜底性民生建设\n实现人民对美好生活的向往是中国式现代化的出发点和落脚点。坚持尽力而为、量力而\n行，加强普惠性、基础性、兜底性民生建设，解决好人民群众急难愁盼问题，畅通社会流动\n渠道，提高人民生活品质。\n——《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》\n以普惠性民生建设为发展方向。普惠性，强调保障对象的普遍性。\n以基础性民生建设为主要内容。基础性，强调以人民群众的基本需求为保障内容。\n以兜底性民生建设为基本职责。兜底性，强调政府必须承担民生兜底保障责任。\n普惠性、基础性、兜底性三者有机联系、相互衔接、相辅相成，体现了以人民为中心的\n发展思想，体现了整体和重点、当前和长远、目标和方法的有机统一，是习近平总书记关于\n保障和改善民生的重要论述的重要内容，是在结合我国国情、吸纳人类优秀文明成果基础上\n的重大创新。\n——《求是》杂志文章《加强普惠性、基础性、兜底性民生建设》","source":{"doc":"6cbfb01fe723bba64b75","first":39,"last":40,"page":39,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/b111e12387e2910999904607fe7e209bffdd45aa299a8aca42d8ce302240edd6.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"89c071eacc7a83cb","topic":"就业、社保与公共服务","label":"促进高质量充分就业","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.促进高质量充分就业\n促进高质量充分就业，是新时代新征程就业工作的新定位、新使命。要坚持以人民为中\n心的发展思想，全面贯彻劳动者自主就业、市场调节就业、政府促进就业和鼓励创业的方针，\n持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者的获得感幸福感安全感，\n为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。\n——《求是》杂志文章《促进高质量充分就业》","source":{"doc":"6cbfb01fe723bba64b75","first":40,"last":40,"page":40,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/99492c77f4b04119d96b0e1eae7e060857dbfe48dc4060c4c3958fb10b84a345.jpg","mentions":["政治理论必刷100题#70","江苏 2025 A类 行测#8","江苏 2025 B类 行测#8","江苏 2025 C类 行测#8"],"groups":[]},{"kind":"knowledge","id":"6e6c48f4e0e6ff3b","topic":"就业、社保与公共服务","label":"构建就业友好型发展方式","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.构建就业友好型发展方式\n党的二十届四中全会通过的《中共中央关于制定国民经济和社会发展第十五个五年规划\n的建议》对促进高质量充分就业作出重要部署，并提出“构建就业友好型发展方式”。习近\n平总书记深刻指出，“就业是最基本的民生，事关人民群众切身利益，事关经济社会健康发\n展，事关国家长治久安”，深刻揭示了就业与发展的辩证统一关系，为新时代就业工作提供\n了根本遵循。\n所谓就业友好型发展方式，就是将就业优先理念贯穿于经济社会发展全过程各领域，实\n现经济增长与就业扩容良性互动、结构优化与就业提质相互促进、创新驱动与就业赋能有机\n统一，让发展成果更多更公平惠及全体劳动者，为中国式现代化筑牢民生根基。\n——《人民网》","source":{"doc":"6cbfb01fe723bba64b75","first":40,"last":40,"page":40,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/99492c77f4b04119d96b0e1eae7e060857dbfe48dc4060c4c3958fb10b84a345.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"c6d2b60d41683a60","topic":"就业、社保与公共服务","label":"劳动密集型行业企业","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"4.劳动密集型行业企业\n密集型产业主要包括劳动密集型、资本密集型、技术/知识密集型、资源密集型等四种\n核心类型，这种产业分类方法体现了各产业对不同生产要素的依赖程度。\n（1）劳动密集型：指生产过程中对劳动力数量的依赖度远高于资本、技术等其他生产\n要素的产业。\n（2）资本密集型：指在生产经营中需要投入大量资本用于购置固定资产（如大型生产\n设备、厂房、生产线等）的产业。\n（3）技术/知识密集型：指以先进科学技术为核心生产要素，研发投入占比高、对专业\n技术人才依赖度强的产业。\n（4）资源密集型：指直接依托自然资源进行开采或初级加工的产业，生产过程高度依\n赖土地、矿产、森林、水等天然资源的禀赋。","source":{"doc":"6cbfb01fe723bba64b75","first":40,"last":40,"page":40,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/99492c77f4b04119d96b0e1eae7e060857dbfe48dc4060c4c3958fb10b84a345.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f3ab02f32165e5e8","topic":"就业、社保与公共服务","label":"加强就业歧视治理","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"5.加强就业歧视治理\n坚决破除影响劳动力、人才流动的体制机制障碍，同步推进户籍、用人、档案等服务改\n革，消除地域、身份、性别、年龄等影响平等就业的不合理限制和就业歧视，畅通社会流动\n渠道。健全就业歧视救济机制，依法纳入劳动保障监察范围，完善民事支持起诉机制，稳妥\n开展公益诉讼检察工作。\n——《中共中央 国务院关于实施就业优先战略 促进高质量充分就业的意见》","source":{"doc":"6cbfb01fe723bba64b75","first":40,"last":41,"page":40,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/99492c77f4b04119d96b0e1eae7e060857dbfe48dc4060c4c3958fb10b84a345.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"6b35b860c9e28c54","topic":"就业、社保与公共服务","label":"建设高素质专业化教师队伍","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.建设高素质专业化教师队伍\n建设高素质专业化教师队伍，筑牢教育强国根基。实施教育家精神铸魂强师行动，提升\n教师专业素质能力，优化教师管理和资源配置，提高教师政治地位、社会地位、职业地位。\n——《教育强国建设规划纲要（2024—2035 年）》","source":{"doc":"6cbfb01fe723bba64b75","first":41,"last":41,"page":41,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/00b026e5c8aff38bf9ef475916d6fa2ee511193df8403a899dffae3198f7a020.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"dbbc0e18499f05a2","topic":"发展与治理","label":"加强体育、美育、劳动教育和心理健康教育","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.加强体育、美育、劳动教育和心理健康教育\n促进学生健康成长、全面发展。深入实施素质教育，健全德智体美劳全面培养体系，加\n快补齐体育、美育、劳动教育短板。落实健康第一教育理念，实施学生体质强健计划，中小\n学生每天综合体育活动时间不低于 2 小时，加强校园足球建设，有效控制近视率、肥胖率。\n推进学校美育浸润行动。实施劳动习惯养成计划，提升学生动手实践能力、解决复杂问题能\n力和社会适应能力。普及心理健康教育，建立全国学生心理健康监测预警系统，分学段完善\n服务工作机制。\n——《教育强国建设规划纲要（2024—2035 年）》","source":{"doc":"6cbfb01fe723bba64b75","first":41,"last":42,"page":41,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/00b026e5c8aff38bf9ef475916d6fa2ee511193df8403a899dffae3198f7a020.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1118cba9eb8a3fed","topic":"就业、社保与公共服务","label":"健康优先发展战略","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.健康优先发展战略\n实施健康优先发展战略，健全公共卫生体系，促进社会共治、医防协同、医防融合，强\n化监测预警、风险评估、流行病学调查、检验检测、应急处置、医疗救治等能力。\n——《中共中央关于进一步全面深化改革、推进中国式现代化的决定》","source":{"doc":"6cbfb01fe723bba64b75","first":42,"last":42,"page":42,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4491322bc63bddc44a33437d5eea838e3f514f5a0c83b2a15bcdfb7e8cbc852d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"ae9d233d249830ad","topic":"就业、社保与公共服务","label":"爱国卫生运动","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.爱国卫生运动\n爱国卫生运动是中国共产党于 1952 年发起的群众性卫生活动，是我国历史上持续时间\n最长的群众性运动，其核心要素体现为“爱国是核心、卫生是根本、运动是方式”。该运动\n由毛泽东等老一辈革命家倡导，周恩来担任首任中央防疫委员会主任并主持反细菌战防疫体\n系建设，初期以反细菌战和防疫工作为核心，后发展为涵盖城乡环境治理、卫生设施改善的\n系统性工程。\n70 年来，在党的领导下，爱国卫生运动坚持以人民健康为中心，坚持预防为主，为改\n变城乡环境卫生面貌、有效应对重大传染病疫情、提升社会健康治理水平发挥了重要作用。\n——《习近平总书记在爱国卫生运动开展 70 周年之际作出重要指示》","source":{"doc":"6cbfb01fe723bba64b75","first":42,"last":42,"page":42,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4491322bc63bddc44a33437d5eea838e3f514f5a0c83b2a15bcdfb7e8cbc852d.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"2456fc71bebec7a5","topic":"就业、社保与公共服务","label":"实施积极应对人口老龄化国家战略","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.实施积极应对人口老龄化国家战略\n优化居家为基础、社区为依托、机构为专业支撑、医养相结合的养老服务供给格局，强\n化以失能老年人照护为重点的基本养老服务，健全分级分类、普惠可及、覆盖城乡、持续发\n展的养老服务体系。\n——《中共中央 国务院关于深化养老服务改革发展的意见》","source":{"doc":"6cbfb01fe723bba64b75","first":43,"last":43,"page":43,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/92ef4636b1b2bec50fd85be68480f9538a2f9f57f260dcd0f9da710ec45149ca.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a7aa1c1117e2d655","topic":"就业、社保与公共服务","label":"银发经济","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.银发经济\n银发经济，也称银色经济、银发产业，是向老年人提供产品或服务，以及为老龄阶段做\n准备等一系列经济活动的总和。\n截至 2025 年底，我国 60 岁及以上老年人口达 3.2 亿人，预计到 2035 年，这一群体数\n量将超 4 亿人，银发经济规模有望突破 30 万亿元。","source":{"doc":"6cbfb01fe723bba64b75","first":43,"last":43,"page":43,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/92ef4636b1b2bec50fd85be68480f9538a2f9f57f260dcd0f9da710ec45149ca.jpg","mentions":["政治理论必刷100题#71"],"groups":[]},{"kind":"knowledge","id":"1aea66b8c06cac87","topic":"发展与治理","label":"社会主义核心价值观","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.社会主义核心价值观\n培育和践行社会主义核心价值观，是推进中国特色社会主义伟大事业、实现中华民族伟\n大复兴中国梦的战略任务。党的十八大提出，倡导富强、民主、文明、和谐，倡导自由、平\n等、公正、法治，倡导爱国、敬业、诚信、友善，积极培育和践行社会主义核心价值观。这\n与中国特色社会主义发展要求相契合，与中华优秀传统文化和人类文明优秀成果相承接，是\n我们党凝聚全党全社会价值共识作出的重要论断。富强、民主、文明、和谐是国家层面的价\n值目标，自由、平等、公正、法治是社会层面的价值取向，爱国、敬业、诚信、友善是公民\n个人层面的价值准则，这 24 个字是社会主义核心价值观的基本内容，为培育和践行社会主\n义核心价值观提供了基本遵循。\n——《关于培育和践行社会主义核心价值观的意见》","source":{"doc":"6cbfb01fe723bba64b75","first":44,"last":44,"page":44,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/dae780d9cdb18f91619b636257ec304258b310c8a8210ac5f3475c3a79df5771.jpg","mentions":["国考 2023 副省级 行测#25","国考 2023 行政执法 行测#29"],"groups":[]},{"kind":"knowledge","id":"4d94680ab5558551","topic":"就业、社保与公共服务","label":"完善全民阅读推广服务体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.完善全民阅读推广服务体系\n全民阅读促进工作坚持中国共产党的领导，坚持以习近平新时代中国特色社会主义思想\n为指导，贯彻落实习近平文化思想，坚持以人民为中心，坚定文化自信，发展社会主义先进\n文化，弘扬革命文化，传承中华优秀传统文化。\n全民阅读促进工作坚持以社会主义核心价值观为引领，传播有益于公民全面发展和社会\n文明进步的科学文化知识，激发公民阅读兴趣，培养公民阅读习惯，增强公民阅读能力，提\n升公民阅读质量，形成全社会爱读书、读好书、善读书的浓厚氛围。\n全民阅读促进工作由党委领导、政府主导、社会力量参与，按照公益性、基本性、均等\n性、便利性的要求，构建全民覆盖、普惠高效的全民阅读促进体系，涵育文明风尚，厚植家\n国情怀，增强实现中华民族伟大复兴的精神力量。\n每年 4 月第四周为全民阅读活动周。\n——《全民阅读促进条例》","source":{"doc":"6cbfb01fe723bba64b75","first":44,"last":44,"page":44,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/dae780d9cdb18f91619b636257ec304258b310c8a8210ac5f3475c3a79df5771.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"4c71a679cd44373a","topic":"发展与治理","label":"深入实施中华优秀传统文化传承发展工程","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.深入实施中华优秀传统文化传承发展工程\n主要内容：\n（1）核心思想理念。中华民族和中国人民在修齐治平、尊时守位、知常达变、开物成\n务、建功立业过程中培育和形成的基本思想理念，如革故鼎新、与时俱进的思想，脚踏实地、\n实事求是的思想，惠民利民、安民富民的思想，道法自然、天人合一的思想等，可以为人们\n认识和改造世界提供有益启迪，可以为治国理政提供有益借鉴。传承发展中华优秀传统文化，\n就要大力弘扬讲仁爱、重民本、守诚信、崇正义、尚和合、求大同等核心思想理念。\n（2）中华传统美德。中华优秀传统文化蕴含着丰富的道德理念和规范，如天下兴亡、\n匹夫有责的担当意识，精忠报国、振兴中华的爱国情怀，崇德向善、见贤思齐的社会风尚，\n孝悌忠信、礼义廉耻的荣辱观念，体现着评判是非曲直的价值标准，潜移默化地影响着中国\n人的行为方式。传承发展中华优秀传统文化，就要大力弘扬自强不息、敬业乐群、扶危济困、\n见义勇为、孝老爱亲等中华传统美德。\n（3）中华人文精神。中华优秀传统文化积淀着多样、珍贵的精神财富，如求同存异、\n和而不同的处世方法，文以载道、以文化人的教化思想，形神兼备、情景交融的美学追求，\n俭约自守、中和泰和的生活理念等，是中国人民思想观念、风俗习惯、生活方式、情感样式\n的集中表达，滋养了独特丰富的文学艺术、科学技术、人文学术，至今仍然具有深刻影响。\n传承发展中华优秀传统文化，就要大力弘扬有利于促进社会和谐、鼓励人们向上向善的思想\n文化内容。\n——《关于实施中华优秀传统文化传承发展工程的意见》","source":{"doc":"6cbfb01fe723bba64b75","first":44,"last":45,"page":44,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/dae780d9cdb18f91619b636257ec304258b310c8a8210ac5f3475c3a79df5771.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"592c6e8da8879b01","topic":"生态环境与能源","label":"加快推动全面绿色转型","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.加快推动全面绿色转型\n绿色发展是中国式现代化的鲜明底色。牢固树立和践行绿水青山就是金山银山的理念，\n以碳达峰碳中和为牵引，协同推进降碳、减污、扩绿、增长，筑牢生态安全屏障，增强绿色\n发展动能。\n——《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","source":{"doc":"6cbfb01fe723bba64b75","first":46,"last":46,"page":46,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/074d34cf7f974b608bc667cf5519a34d8b3c0f8f794cdeda11a0ec2030564b7c.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"e44bdc8ad38691cf","topic":"生态环境与能源","label":"碳达峰碳中和","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.碳达峰碳中和\n力争 2030 年前二氧化碳排放达到峰值，努力争取 2060 年前实现碳中和目标。\n——《2020 年 9 月 22 日习近平总书记在第 75 届联合国大会上的讲话》\n实现碳达峰碳中和是一场广泛而深刻的经济社会系统性变革。立足我国能源资源禀赋，\n坚持先立后破，有计划分步骤实施碳达峰行动。完善能源消耗总量和强度调控，重点控制化\n石能源消费，逐步转向碳排放总量和强度“双控”制度。\n——《党的二十大报告》\n习近平宣布中国新一轮国家自主贡献：到 2035 年，中国全经济范围温室气体净排放量\n比峰值下降 7%-10%，力争做得更好。非化石能源消费占能源消费总量的比重达到 30%以上，\n风电和太阳能发电总装机容量达到 2020 年的 6 倍以上、力争达到 36 亿千瓦，森林蓄积\n量达到 240 亿立方米以上，新能源汽车成为新销售车辆的主流，全国碳排放权交易市场覆\n盖主要高排放行业，气候适应型社会基本建成。\n——《2025 年 9 月 24 日习近平在联合国气候变化峰会发表视频致辞》","source":{"doc":"6cbfb01fe723bba64b75","first":46,"last":46,"page":46,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/074d34cf7f974b608bc667cf5519a34d8b3c0f8f794cdeda11a0ec2030564b7c.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"285d545a34d41ff8","topic":"生态环境与能源","label":"蓝天、碧水、净土保卫战","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.蓝天、碧水、净土保卫战\n持续深入打好蓝天保卫战。以京津冀及周边、长三角、汾渭平原等重点区域为主战场，\n以细颗粒物控制为主线，大力推进多污染物协同减排。\n持续深入打好碧水保卫战。统筹水资源、水环境、水生态治理，深入推进长江、黄河等\n大江大河和重要湖泊保护治理，优化调整水功能区划及管理制度。\n持续深入打好净土保卫战。开展土壤污染源头防控行动，严防新增污染，逐步解决长期\n积累的土壤和地下水严重污染问题。\n——《中共中央 国务院关于全面推进美丽中国建设的意见》","source":{"doc":"6cbfb01fe723bba64b75","first":46,"last":46,"page":46,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/074d34cf7f974b608bc667cf5519a34d8b3c0f8f794cdeda11a0ec2030564b7c.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b1ad1404e2a812d0","topic":"生态环境与能源","label":"零碳园区和工厂建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"6.零碳园区和工厂建设\n零碳工厂建设是指通过技术创新、结构调整和管理优化 等减排措施，实现厂区内二氧\n化碳排放的持续降低、逐步趋 向于近零的过程。\n遵循原则：因业施策，系统推进。创新驱动，技术赋能。应减尽减，持续提升。统一规\n范，公开透明。\n主要目标：2026 年起，遴选一批零碳工厂，做好标杆引领。到 2027 年，在汽车、锂电\n池、光伏、电子电器、轻工、机械、算力设施等行业领域，培育建设一批零碳工厂。到 2030\n年，将零碳工厂建设逐步拓展至钢铁、有色金属、石化化工、建材、纺织等行业领域，探索\n传统高载能产业脱碳新路径，推广零碳工厂设计、融资、改造、管理等综合服务模式和系统\n解决方案，大幅提升产品全生命周期和全产业链管理能力，实现工厂碳排放的稳步下降。\n——《关于开展零碳工厂建设工作的指导意见》","source":{"doc":"6cbfb01fe723bba64b75","first":47,"last":47,"page":47,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e93c0ef324498fb8d5cf485abc1a87bd69aefaa5ddb17c06ac6a741e60a53143.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"af6fa182a8393e20","topic":"生态环境与能源","label":"碳排放总量和强度双控制度","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"7.碳排放总量和强度双控制度\n“十五五”时期，实施以强度控制为主、总量控制为辅的碳排放双控制度，建立碳达峰\n碳中和综合评价考核制度，加强重点领域和行业碳排放核算能力，健全重点用能和碳排放单\n位管理制度，开展固定资产投资项目碳排放评价，构建符合中国国情的产品碳足迹管理体系\n和产品碳标识认证制度，确保如期实现碳达峰目标。\n碳达峰后，实施以总量控制为主、强度控制为辅的碳排放双控制度，建立碳中和目标评\n价考核制度，进一步强化对各地区及重点领域、行业、企业的碳排放管控要求，健全产品碳\n足迹管理体系，推行产品碳标识认证制度，推动碳排放总量稳中有降。\n——《加快构建碳排放双控制度体系工作方案》","source":{"doc":"6cbfb01fe723bba64b75","first":47,"last":47,"page":47,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/e93c0ef324498fb8d5cf485abc1a87bd69aefaa5ddb17c06ac6a741e60a53143.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f7940a49cc7f3883","topic":"发展与治理","label":"着力稳定房地产市场","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.着力稳定房地产市场\n针对着力稳定房地产市场，2026 年的重点是：因城施策控增量、去库存、优供给，结\n合城市更新、城中村改造盘活利用存量用地，推动收购存量商品房用作保障性住房、安置房、\n宿舍、人才房等。优化和精准实施保障性住房供应，实施房屋品质提升工程，有序推进“好\n房子”建设；进一步发挥房地产项目“白名单”制度作用，支持房地产企业合理融资需求。\n——《全国住房城乡建设工作会议》","source":{"doc":"6cbfb01fe723bba64b75","first":48,"last":48,"page":48,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d0b46ad1bad3504086de4ffe8f52191e2eda27dfa1e327cf87af3b2f88c8a877.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"7b62b3ebc327bd69","topic":"发展与治理","label":"化解地方政府债务风险","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.化解地方政府债务风险\n地方性政府债务指有财政收入的地方政府及地方公共机构发行的债券，是地方政府根据\n信用原则、以承担还本付息责任为前提而筹集资金的债务凭证，其收入列入地方政府预算并\n由地方政府安排调度。\n我国地方政府债务分为法定债务和隐性债务。\n（1）地方政府法定债务：是指地方政府在法定债务限额之内，通过发行债券举借的债\n务，包括一般债和专项债。\n（2）地方政府隐性债务：是指地方政府在法定政府债务限额之外，直接或者承诺以财\n政资金偿还，以及违规提供担保等方式举借的债务。\n——《我国地方政府债务合并监管研究》","source":{"doc":"6cbfb01fe723bba64b75","first":48,"last":48,"page":48,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d0b46ad1bad3504086de4ffe8f52191e2eda27dfa1e327cf87af3b2f88c8a877.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b3faa643c2c1a8ff","topic":"发展与治理","label":"化解金融领域风险","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.化解金融领域风险\n坚持把防控风险作为金融工作的永恒主题。金融既有管理和分散风险的功能，又自带风\n险基因。我国金融体量和复杂程度今非昔比，风险的系统性关联性大大增强。必须增强忧患\n意识，做好风险防控，增强金融体系韧性。\n加快建设金融强国的目标：\n金融强国，应当基于强大的经济基础，具有领先世界的经济实力、科技实力和综合国力，\n同时具备一系列关键核心金融要素：拥有强大的货币、强大的中央银行、强大的金融机构、\n强大的国际金融中心、强大的金融监管、强大的金融人才队伍。\n建设金融强国，必须加快构建中国特色现代金融体系：科学稳健的金融调控体系，结构\n合理的金融市场体系，分工协作的金融机构体系，完备有效的金融监管体系，多样化专业性\n的金融产品和服务体系，自主可控、安全高效的金融基础设施体系。\n——《求是》杂志文章《走好中国特色金融发展之路，建设金融强国》","source":{"doc":"6cbfb01fe723bba64b75","first":48,"last":49,"page":48,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d0b46ad1bad3504086de4ffe8f52191e2eda27dfa1e327cf87af3b2f88c8a877.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"c3da64daf8e2d7c5","topic":"发展与治理","label":"总体国家安全观","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.总体国家安全观\n2014 年 4 月 15 日，习近平总书记在中央国家安全委员会第一次会议上，创造性提出总\n体国家安全观。\n——《求是》杂志文章《全面贯彻总体国家安全观》\n我们要坚持以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文\n化社会安全为保障、以促进国际安全为依托，统筹外部安全和内部安全、国土安全和国民安\n全、传统安全和非传统安全、自身安全和共同安全，统筹维护和塑造国家安全，夯实国家安\n全和社会稳定基层基础，完善参与全球安全治理机制，建设更高水平的平安中国，以新安全\n格局保障新发展格局。\n——《党的二十大报告》","source":{"doc":"6cbfb01fe723bba64b75","first":49,"last":49,"page":49,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/fff4fbdcf08a73eed408de6c9132e4e9d92129aa884a1014c4ceda4b510b6eac.jpg","mentions":["政治理论必刷100题#64","政治理论必刷100题#99"],"groups":[]},{"kind":"knowledge","id":"2749f538678c62c3","topic":"发展与治理","label":"新时代“枫桥经验”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.新时代“枫桥经验”\n（1）“枫桥经验”\n“枫桥经验”是指 20 世纪 60 年代初，浙江诸暨县（现诸暨市）枫桥镇干部群众创造的\n“发动和依靠群众，坚持矛盾不上交，就地解决，实现捕人少，治安好”的基层社会治理经\n验。\n1963 年，毛泽东同志亲笔批示：“要各地仿效，经过试点，推广去做。”2003 年，时\n任浙江省委书记的习近平同志明确要求充分珍惜、大力推广、不断创新“枫桥经验”。\n（2）新时代“枫桥经验”\n“枫桥经验”在实践中不断丰富、持续发展，特别是党的十八大以来，形成了特色鲜明\n的新时代“枫桥经验”。\n党的十八大以来，习近平总书记多次作出重要指示，要求在社会基层坚持和发展新时代\n“枫桥经验”。其内涵是：坚持和贯彻党的群众路线，在党的领导下，充分发动群众、组织\n群众、依靠群众解决群众自己的事情，做到“小事不出村、大事不出镇、矛盾不上交”。","source":{"doc":"6cbfb01fe723bba64b75","first":50,"last":50,"page":50,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/7af6f63597498fd8a9b45892a6de57f0a914d61655465814cd743d6783f646f7.jpg","mentions":["江苏 2025 A类 行测#23","江苏 2025 B类 行测#22","江苏 2025 C类 行测#24"],"groups":[]},{"kind":"knowledge","id":"bbd1d1c94e39bf88","topic":"发展与治理","label":"增强“四个意识”、坚定“四个自信”、做到“两个维护”","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.增强“四个意识”、坚定“四个自信”、做到“两个维护”\n“四个意识”：政治意识、大局意识、核心意识、看齐意识。\n“四个自信”：道路自信、理论自信、制度自信、文化自信。\n“两个维护”：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中\n央权威和集中统一领导。","source":{"doc":"6cbfb01fe723bba64b75","first":50,"last":51,"page":50,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/7af6f63597498fd8a9b45892a6de57f0a914d61655465814cd743d6783f646f7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"d7ff4c02a336114a","topic":"发展与治理","label":"树立和践行正确政绩观","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.树立和践行正确政绩观\n经党中央同意，在全党开展树立和践行正确政绩观学习教育。学习教育以县处级以上领\n导班子和领导干部特别是“一把手”为重点，于 2026 年春节假期后启动、7 月底基本结束。\n持之以恒推进全面从严治党，以立党为公、为民造福、科学决策、真抓实干为总要求，\n以一体推进学查改为抓手，教育引导各级党组织和党员、干部坚持实事求是、求真务实，为\n人民出政绩、以实干出政绩。\n学习教育要坚持聚焦主题、简约务实，不分批次、不划阶段，认真落实学习研讨、查摆\n问题、整改整治、建章立制、开门教育等工作安排。\n——《关于在全党开展树立和践行正确政绩观学习教育的通知》","source":{"doc":"6cbfb01fe723bba64b75","first":51,"last":51,"page":51,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/6045204e36b44891f392674f8870bd47ff39aaabb770966ec3b2add281394ab0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"dc297c735547bdb5","topic":"发展与治理","label":"法治政府建设","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.法治政府建设\n我们要坚持走中国特色社会主义法治道路，建设中国特色社会主义法治体系、建设社会\n主义法治国家，围绕保障和促进社会公平正义，坚持依法治国、依法执政、依法行政共同推\n进，坚持法治国家、法治政府、法治社会一体建设，全面推进科学立法、严格执法、公正司\n法、全民守法，全面推进国家各方面工作法治化。\n扎实推进依法行政。法治政府建设是全面依法治国的重点任务和主体工程。\n——《党的二十大报告》","source":{"doc":"6cbfb01fe723bba64b75","first":51,"last":52,"page":51,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/6045204e36b44891f392674f8870bd47ff39aaabb770966ec3b2add281394ab0.jpg","mentions":["政治理论必刷100题#96","江苏 2025 B类 行测#10"],"groups":[]},{"kind":"knowledge","id":"afa845e668ca6349","topic":"发展与治理","label":"行政监督体系","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.行政监督体系\n（1）行政内部监督系统\n行政内部监督系统，是指行政机关在国家行政系统内部实施的各种监督所组成的行政监\n督系统，分为一般监督和审计监督。\n（2）行政外部监督系统\n行政外部监督系统，是指除行政机关以外的监督主体所构成的对行政机关及其工作人员\n行政行为的遵纪守法情况进行督查、督导的监督体系。外部监督主要包括立法监督、监察监\n督、司法监督、政党监督、社会监督。","source":{"doc":"6cbfb01fe723bba64b75","first":52,"last":52,"page":52,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d093de802ce23f58723273d5f46123e83d64bea91c9c0b283fc1469045fe55e9.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"362d729a358e2954","topic":"发展与治理","label":"整治形式主义为基层减负","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"3.整治形式主义为基层减负\n形式主义、官僚主义是顽瘴痼疾，必须下大力气坚决纠治。基层是贯彻落实党中央决策\n部署的“最后一公里”，不能被形式主义、官僚主义束缚手脚。\n各地区各部门要严格执行《若干规定》，统筹为基层减负和赋能，切实把基层从形式主\n义、官僚主义束缚中解脱出来，引导广大党员、干部积极担当作为，有更多精力抓落实。中\n央层面整治形式主义为基层减负专项工作机制要定期督促检查，中央和国家机关各部门、各\n省级党委和政府在安排部署工作时要实事求是，党委（党组）要履行好主体责任，各级纪检\n监察机关要强化监督执行，确保《若干规定》落到实处。\n——《整治形式主义为基层减负若干规定》","source":{"doc":"6cbfb01fe723bba64b75","first":52,"last":52,"page":52,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d093de802ce23f58723273d5f46123e83d64bea91c9c0b283fc1469045fe55e9.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"67e70b6f5b528cb8","topic":"发展与治理","label":"以铸牢中华民族共同体意识为主线","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.以铸牢中华民族共同体意识为主线\n（1）“十二个必须”\n党关于加强和改进民族工作的重要思想，概括起来有以下方面：\n一是必须从中华民族伟大复兴战略高度把握新时代党的民族工作的历史方位。\n二是必须把推动各民族为全面建设社会主义现代化国家共同奋斗作为新时代党的民族\n工作的重要任务。\n三是必须以铸牢中华民族共同体意识为新时代党的民族工作的主线。\n四是必须坚持正确的中华民族历史观。\n五是必须坚持各民族一律平等。\n六是必须高举中华民族大团结旗帜。\n七是必须坚持和完善民族区域自治制度。\n八是必须构筑中华民族共有精神家园。\n九是必须促进各民族广泛交往交流交融。\n十是必须坚持依法治理民族事务。\n十一是必须坚决维护国家主权、安全、发展利益。\n十二是必须坚持党对民族工作的领导。\n——《2021 年习近平在中央民族工作会议上的讲话》\n（2）“五个共同”\n中华民族是有着五千多年文明史的伟大民族。我国各民族共同开拓了祖国的辽阔疆域，\n共同缔造了统一的多民族国家，共同书写了辉煌的中国历史，共同创造了灿烂的中华文化，\n共同培育了伟大的民族精神。中华民族共同体的形成和发展是人心所向、大势所趋、历史必\n然。\n各民族血脉相融，是中华民族共同体形成和发展的历史根基。各民族信念相同，是中华\n民族缔造统一的多民族国家的内生动力。各民族文化相通，是中华民族铸就多元一体文明格\n局的文化基因。各民族经济相依，是中华民族构建统一经济体的强大力量。各民族情感相亲，\n是中华民族一家亲的坚强纽带。\n——《求是》杂志文章《中华民族共同体的形成和发展是人心所向、大势所趋、历史必\n然》","source":{"doc":"6cbfb01fe723bba64b75","first":52,"last":53,"page":52,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/d093de802ce23f58723273d5f46123e83d64bea91c9c0b283fc1469045fe55e9.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"3e5eac35d5287c86","topic":"发展与治理","label":"宗教中国化","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.宗教中国化\n要总结运用历史经验，立足我国宗教工作实际，强化系统观念，加强体制规范建设，加\n强综合治理，加强基层基础工作，系统推进我国宗教中国化，积极引导宗教与社会主义社会\n相适应。\n我国是中国共产党领导的社会主义国家，积极引导宗教与社会主义社会相适应是必然要\n求。要坚持以社会主义核心价值观为引领，引导宗教界人士和信教群众牢固树立正确的国家\n观、历史观、民族观、文化观、宗教观，不断增进“五个认同”，自觉投身中国式现代化建\n设。\n——《习近平在中共中央政治局第二十二次集体学习时的讲话》","source":{"doc":"6cbfb01fe723bba64b75","first":53,"last":53,"page":53,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/fb2103b0dc379918318cd3a39a3bac2339939b873d37a2dea85c6ff9c098e61e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"0635ac740211e691","topic":"发展与治理","label":"习近平强军思想","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.习近平强军思想\n2017 年 10 月，党的十九大把习近平强军思想写入党章，确立习近平强军思想在国防和\n军队建设中的指导地位。\n习近平强军思想的主要内容可以概括为“十一个明确”：①明确党对人民军队的绝对领\n导是人民军队建军之本、强军之魂；②明确强国必须强军，巩固国防和强大人民军队是新时\n代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑；③明确党在新时代的\n强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，到 2027 年实现建军一百\n年奋斗目标，到 2035 年基本实现国防和军队现代化，到本世纪中叶把人民军队建成世界一\n流军队；④明确军队是要准备打仗的，必须聚焦能打仗、打胜仗，扭住强敌对手；⑤明确推\n进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治军；⑥明确改革是\n强军的必由之路；⑦明确科技是核心战斗力；⑧明确强军之道要在得人；⑨明确依法治军是\n我们党建军治军基本方式；⑩明确军民融合发展是兴国之举、强军之策；⑪明确作风优良是\n我军鲜明特色和政治优势。","source":{"doc":"6cbfb01fe723bba64b75","first":54,"last":54,"page":54,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/43670521412c3b2ed94e53da1d2c18cd8e93b3b1037a7138d98b82aa91818fb4.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"96057c4cf6f4aa3c","topic":"发展与治理","label":"党对人民军队的绝对领导","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.党对人民军队的绝对领导\n党对军队绝对领导的根本原则和制度，发端于南昌起义，奠基于三湾改编，定型于古田\n会议，是人民军队完全区别于一切旧军队的政治特质和根本优势。\n——《在庆祝中国人民解放军建军 90 周年大会上的讲话》","source":{"doc":"6cbfb01fe723bba64b75","first":54,"last":54,"page":54,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/43670521412c3b2ed94e53da1d2c18cd8e93b3b1037a7138d98b82aa91818fb4.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1643e39e38152c55","topic":"发展与治理","label":"港澳相关","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.港澳相关\n“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定\n的最佳制度安排，必须长期坚持。\n全面准确、坚定不移贯彻“一国两制”、“港人治港”、“澳人治澳”、高度自治的方\n针，坚持依法治港治澳，维护宪法和基本法确定的特别行政区宪制秩序。坚持和完善“一国\n两制”制度体系，落实中央全面管治权，落实“爱国者治港”、“爱国者治澳”原则，落实\n特别行政区维护国家安全的法律制度和执行机制。\n——《党的二十大报告》","source":{"doc":"6cbfb01fe723bba64b75","first":55,"last":55,"page":55,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4833fbd6ebf758fc9dc11135b18e8c3325c51e02216f08ba855de3ca70d47730.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1133ca42fdc4e6e1","topic":"发展与治理","label":"台湾问题","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.台湾问题\n（1）历史任务\n解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务，是全体中华儿女的共同\n愿望，是实现中华民族伟大复兴的必然要求。坚持贯彻新时代党解决台湾问题的总体方略，\n牢牢把握两岸关系主导权和主动权，坚定不移推进祖国统一大业。\n——《党的二十大报告》\n（2）新时代党解决台湾问题总体方略（“十个坚持”）：\n第一，坚持党中央对对台工作的集中统一领导。这是统一的根本保证。\n第二，坚持在中华民族伟大复兴进程中推进祖国统一。这是统一的历史方位。\n第三，坚持在祖国大陆发展进步基础上解决台湾问题。这是统一的战略思路。\n第四，坚持“和平统一、一国两制”基本方针。这是统一的大政方针。\n第五，坚持一个中国原则和“九二共识”。这是统一的政治基础。\n第六，坚持推动两岸关系和平发展、融合发展。这是统一的实践途径。\n第七，坚持团结台湾同胞、争取台湾民心。这是统一的根本动力。\n第八，坚持粉碎“台独”分裂图谋。这是统一的必然要求。\n第九，坚持反对外部势力干涉。这是统一的外部条件。\n第十，坚持决不承诺放弃使用武力。这是统一的战略支撑。","source":{"doc":"6cbfb01fe723bba64b75","first":55,"last":55,"page":55,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/4833fbd6ebf758fc9dc11135b18e8c3325c51e02216f08ba855de3ca70d47730.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a156952e65e40d9c","topic":"发展与治理","label":"独立自主的和平外交政策","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"1.独立自主的和平外交政策\n中国始终坚持维护世界和平、促进共同发展的外交政策宗旨，致力于推动构建人类命运\n共同体。\n中国坚定奉行独立自主的和平外交政策，始终根据事情本身的是非曲直决定自己的立场\n和政策，维护国际关系基本准则，维护国际公平正义。\n中国坚持在和平共处五项原则基础上同各国发展友好合作，推动构建新型国际关系，深\n化拓展平等、开放、合作的全球伙伴关系，致力于扩大同各国利益的汇合点。\n中国坚持对外开放的基本国策，坚定奉行互利共赢的开放战略，不断以中国新发展为世\n界提供新机遇，推动建设开放型世界经济，更好惠及各国人民。\n中国积极参与全球治理体系改革和建设，践行共商共建共享的全球治理观，坚持真正的\n多边主义，推进国际关系民主化，推动全球治理朝着更加公正合理的方向发展。\n——《党的二十大报告》","source":{"doc":"6cbfb01fe723bba64b75","first":56,"last":56,"page":56,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/ac7e1ffab506eda39506a65e7e78c4a17ccd8e4964f2bad993855667d73c92f4.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f58326ae99401036","topic":"发展与治理","label":"全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议","basis":"机构注释","paper":"《2026年政府工作报告》粉笔解读.pdf","text":"2.全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议\n当今世界，和平赤字、发展赤字、安全赤字、治理赤字有增无减。提出构建人类命运共\n同体和全球发展倡议、全球安全倡议、全球文明倡议等，就是为了破解上述赤字，推动建设\n一个更加美好的世界，为各国人民创造更加美好的生活。\n（1）全球发展倡议：坚持发展优先，坚持以人民为中心，坚持普惠包容，坚持创新驱\n动，坚持人与自然和谐共生，坚持行动导向。\n（2）全球安全倡议：坚持共同、综合、合作、可持续的安全观，坚持尊重各国主权、\n领土完整，坚持遵守联合国宪章宗旨和原则，坚持重视各国合理安全关切，坚持通过对话协\n商以和平方式解决国家间的分歧和争端，坚持统筹维护传统领域和非传统领域安全。\n（3）全球文明倡议：共同倡导尊重世界文明多样性，共同倡导弘扬全人类共同价值，\n共同倡导重视文明传承和创新，共同倡导加强国际人文交流合作。\n（4）全球治理倡议：第一，奉行主权平等。第二，遵守国际法治。第三，践行多边主\n义。第四，倡导以人为本。第五，注重行动导向。\n——《求是》杂志文章《推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球\n治理倡议》","source":{"doc":"6cbfb01fe723bba64b75","first":56,"last":56,"page":56,"file":"《2026年政府工作报告》粉笔解读.pdf"},"thumb":"assets/thumbs/ac7e1ffab506eda39506a65e7e78c4a17ccd8e4964f2bad993855667d73c92f4.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"1f810b9249ae6b9c","topic":"党政制度与理论","label":"中央委员会是什么？","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"（1）中央委员会是什么？\n党的最高领导机关，是党的全国代表大会和它所产生的中央委员会。在全国代表\n大会闭会期间，中央委员会执行全国代表大会的决议，领导党的全部工作，对外代表\n中国共产党。中央委员会由党的全国代表大会选举产生，由委员和候补委员组成，每\n届任期五年。","source":{"doc":"41195a191a57c1c36332","first":2,"last":2,"page":2,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/4de2ff2f6c33c22a39b71fda2036d9f10e7118bc2240580e23e1f7cba0b2848c.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"7acd4e47d5931bc8","topic":"党政制度与理论","label":"全面从严治党","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.全面从严治党\n2014 年 12 月，习近平总书记在江苏考察时明确提出“全面从严治党”，并将其同\n全面建成小康社会、全面深化改革、全面依法治国并列，形成“四个全面”战略布\n局。\n2017 年 10 月，党的十九大将“坚持全面从严治党”确立为新时代坚持和发展中国\n特色社会主义的基本方略之一；十九大党章在总纲部分党的建设总体要求中，将“坚\n持党要管党、从严治党”修改为“坚持党要管党、全面从严治党”，这是“全面从严\n治党”首次写入党章。\n2021 年 11 月，党的十九届六中全会决议将“明确全面从严治党的战略方针”列为\n习近平新时代中国特色社会主义思想“十个明确”的重要内容。\n2022 年 10 月，党的二十大首次提出“健全全面从严治党体系”，强化管党治党全\n面系统布局、协同高效推进。","source":{"doc":"41195a191a57c1c36332","first":3,"last":3,"page":3,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/87f5439114ed813f2c4094dcb1a4a8bcedc68692250d95308812672294bab16c.jpg","mentions":["国考 2024 副省级 行测#5","国考 2024 副省级 行测#23","国考 2024 行政执法 行测#4","国考 2024 行政执法 行测#24","国考 2025 副省级 行测#8","国考 2025 地市级 行测#8","国考 2025 行政执法 行测#8","江苏 2025 A类 行测#2","江苏 2025 B类 行测#2","江苏 2025 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"a96efe606f622af6","topic":"党政制度与理论","label":"新发展理念","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.新发展理念\n党的十八届五中全会提出，必须牢固树立创新、协调、绿色、开放、共享的发展\n理念。\n创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展\n的必要条件和人民对美好生活追求的重要体现，开放是国家繁荣发展的必由之路，共\n享是中国特色社会主义的本质要求。\n创新发展注重的是解决发展动力问题，协调发展注重的是解决发展不平衡问题，\n绿色发展注重的是解决人与自然和谐问题，开放发展注重的是解决发展内外联动问\n题，共享发展注重的是解决社会公平正义问题。\n——《新华网》","source":{"doc":"41195a191a57c1c36332","first":3,"last":4,"page":3,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/87f5439114ed813f2c4094dcb1a4a8bcedc68692250d95308812672294bab16c.jpg","mentions":["政治理论必刷100题#25","国考 2023 副省级 行测#5","国考 2023 地市级 行测#4","国考 2024 副省级 行测#2","国考 2024 地市级 行测#5","国考 2025 副省级 行测#7","国考 2025 副省级 行测#48","国考 2025 地市级 行测#7","国考 2025 地市级 行测#51","国考 2025 行政执法 行测#7"],"groups":[]},{"kind":"knowledge","id":"8cff63008c52a13e","topic":"党政制度与理论","label":"“五位一体”总体布局","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.“五位一体”总体布局\n2012 年 11 月，党的十八大首次提出中国特色社会主义事业总布局是“五位一\n体”，即“经济建设、政治建设、文化建设、社会建设、生态文明建设”五个方面。\n“五位一体”总体布局是一个有机整体，经济建设是根本，政治建设是保障，文化建\n设是灵魂，社会建设是条件，生态文明建设是基础，统一于把我国建成富强民主文明\n和谐美丽的社会主义现代化强国的新目标。","source":{"doc":"41195a191a57c1c36332","first":4,"last":4,"page":4,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0506537f9df9a83c721931de78623551bbc511550d1d1aeb5c2efa4ce87a5dd2.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"28e9a3b60750eb3e","topic":"党政制度与理论","label":"“四个全面”战略布局","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.“四个全面”战略布局\n2014 年 12 月，习近平总书记在江苏调研时首次提出包括全面建成小康社会、全面\n深化改革、全面依法治国、全面从严治党的“四个全面”。\n2020 年 10 月，党的十九届五中全会对“四个全面”战略布局作出新的表述，将\n“全面建成小康社会”调整为“全面建设社会主义现代化国家”。\n——《中华人民共和国司法部》","source":{"doc":"41195a191a57c1c36332","first":4,"last":4,"page":4,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0506537f9df9a83c721931de78623551bbc511550d1d1aeb5c2efa4ce87a5dd2.jpg","mentions":["江苏 2025 A类 行测#2","江苏 2025 B类 行测#2","江苏 2025 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"b79e4f5f5e1ba147","topic":"党政制度与理论","label":"国内国际两个大局","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"4.国内国际两个大局\n领导干部要胸怀两个大局，一个是中华民族伟大复兴的战略全局，一个是世界百\n年未有之大变局，这是我们谋划工作的基本出发点。\n——《中国共产党新闻网》","source":{"doc":"41195a191a57c1c36332","first":4,"last":4,"page":4,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0506537f9df9a83c721931de78623551bbc511550d1d1aeb5c2efa4ce87a5dd2.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"051e0dfed462853c","topic":"党政制度与理论","label":"国防和军队现代化建设","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"5.国防和军队现代化建设\n国防和军队现代化新“三步走”战略：到 2027 年实现建军一百年奋斗目标，到\n2035 年基本实现国防和军队现代化，到本世纪中叶把人民军队建成世界一流军队。\n——《解放军报》","source":{"doc":"41195a191a57c1c36332","first":4,"last":4,"page":4,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0506537f9df9a83c721931de78623551bbc511550d1d1aeb5c2efa4ce87a5dd2.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"e21e9734f22320ba","topic":"党政制度与理论","label":"为中国人民谋幸福、为中华民族谋复兴","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.为中国人民谋幸福、为中华民族谋复兴\n2017 年 10 月，习近平同志在作党的十九大报告时指出，中国共产党人的初心和使\n命，就是为中国人民谋幸福、为中华民族谋复兴。\n——《中国政府网》","source":{"doc":"41195a191a57c1c36332","first":6,"last":6,"page":6,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/fbb25775764b0e3588a929e27f23760563b6401530e9a409e3eedffabd45c39b.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"2979c5f4d345dad8","topic":"党政制度与理论","label":"党的建设","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.党的建设\n党的建设是指党为保持自己的性质而从事的一系列自我完善的活动，不仅包括党\n务工作，还包括党的政治建设、思想建设、组织建设、作风建设、纪律建设和制度建\n设等。\n（1）党的政治建设：是党的根本性建设，决定党的建设方向和效果。党的政治建\n设的首要任务是保证全党服从中央，坚持党中央权威和集中统一领导。\n（2）党的思想建设：是党的基础性建设。党的思想建设的首要任务是坚定理想信\n念。\n（3）新时代党的建设总要求是：坚持和加强党的全面领导，坚持党要管党、全面\n从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治\n建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着\n力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度\n建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走\n在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克\n思主义执政党。\n——《共产党员网》","source":{"doc":"41195a191a57c1c36332","first":6,"last":7,"page":6,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/fbb25775764b0e3588a929e27f23760563b6401530e9a409e3eedffabd45c39b.jpg","mentions":["政治理论必刷100题#85","政治理论必刷100题#87","国考 2024 副省级 行测#5","国考 2024 行政执法 行测#4","江苏 2025 A类 行测#1","江苏 2025 A类 行测#2","江苏 2025 B类 行测#1","江苏 2025 B类 行测#2","江苏 2025 C类 行测#1","江苏 2025 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"c16f4ec02a3b3033","topic":"党政制度与理论","label":"“让人民来监督政府”和“自我革命”","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.“让人民来监督政府”和“自我革命”\n1945 年 7 月，在延安一孔窑洞里，面对黄炎培提出的如何跳出“其兴也勃焉，其\n亡也忽焉”的历史周期率的问题，毛泽东同志给出第一个答案：“让人民来监督政\n府”。以习近平同志为核心的党中央在新时代全面从严治党伟大实践中给出第二个答\n案：自我革命。\n习近平总书记强调，一百年来，党外靠发展人民民主、接受人民监督，内靠全面\n从严治党、推进自我革命，勇于坚持真理、修正错误，勇于刀刃向内、刮骨疗毒，保\n证了党长盛不衰、不断发展壮大，这一重要论述深刻揭示了跳出历史周期率两个答案\n的相互关系。自我监督和人民监督相辅相成、相互促进，体现了内因和外因关系的深\n刻辩证法，两者都源于党的初心使命。\n——《中央纪委国家监委网站》","source":{"doc":"41195a191a57c1c36332","first":7,"last":7,"page":7,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/2b898ad673db0ef6a1a89d409c8f7dda4d92151fa1a22194959b30658e9ea3bc.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"9e85630e3edf73c6","topic":"党政制度与理论","label":"习近平党建思想","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.习近平党建思想\n2026 年 6 月 15 日，全国党建工作座谈会在京召开，中共中央政治局常委、中央书\n记处书记蔡奇出席会议并讲话，中共中央政治局常委、中央纪律检查委员会书记李希\n出席会议。会议认为，党的十八大以来，以习近平同志为核心的党中央围绕建设什么\n样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党的重大时代课\n题，提出一系列新理念新思想新战略，形成习近平党建思想。\n习近平党建思想内涵要义可以概括为“十四个坚持”：\n①坚持党的领导是中国特色社会主义最本质的特征；\n②坚持党中央集中统一领导是党的领导的最高原则；\n③坚持全面从严治党是新时代党的建设的战略方针；\n④坚持不忘初心、牢记使命是党的宗旨立场和价值取向；\n⑤坚持以党的政治建设为统领是新时代党的建设的根本要求；\n⑥坚持用党的创新理论凝心铸魂是党的思想建设的根本任务；\n⑦坚持锤炼坚强党性是党员、干部的终身课题；\n⑧坚持健全上下贯通、执行有力的组织体系是党的优势所在、力量所在；\n⑨坚持建设堪当民族复兴重任的高素质干部队伍是关系党和国家事业的关键性问\n题；\n⑩坚持推进作风建设常态化长效化是保持党同人民群众血肉联系的有效途径；\n⑪坚持用严明的纪律管全党治全党是全面从严治党的治本之策；\n⑫坚持一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的\n基本方针；\n⑬坚持制度治党、依规治党是全面从严治党的长远和根本之策；\n⑭坚持落实管党治党政治责任是全面从严治党需要牢牢牵住的“牛鼻子”。","source":{"doc":"41195a191a57c1c36332","first":8,"last":8,"page":8,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/f808af01350245ecc9f54674477771d2ab47b1639b799ceaaef82bbbeaad2490.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"b1eb9615fcc7bc1a","topic":"党政制度与理论","label":"“四大考验”","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.“四大考验”\n执政考验、改革开放考验、市场经济考验、外部环境考验\n——共产党员网","source":{"doc":"41195a191a57c1c36332","first":9,"last":9,"page":9,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a2e1bd4dbc19ff7e0303386556f135d17511dbb989fd58b8302e713691657001.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"279012b3cb08a7ad","topic":"党政制度与理论","label":"“四种危险”","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.“四种危险”\n精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险\n——共产党员网","source":{"doc":"41195a191a57c1c36332","first":9,"last":9,"page":9,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a2e1bd4dbc19ff7e0303386556f135d17511dbb989fd58b8302e713691657001.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"8258c0a163851d24","topic":"党政制度与理论","label":"新时代全面从严治党宝贵经验","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.新时代全面从严治党宝贵经验\n在新时代全面从严治党的伟大实践中，我们党积累了丰富的管党治党、兴党强党经\n验：\n1 从制定和落实中央八项规定开局破题，从抓作风入手推进全面从严治党；\n2 明确新时代党的建设总要求，把党的政治建设摆在党的建设统领位置；\n3 强调全面从严治党，核心是加强党的领导；\n4 坚持思想建党和制度治党有机结合、同向发力；\n5 反复强调打铁必须自身硬，把严的标准、严的措施贯穿于党的建设全过程和各\n方面，持续抓思想从严、监督从严、执纪从严、治吏从严、作风从严、反腐从严；\n6 注重整体谋划、系统推进，坚持党性党风党纪一起抓、正风肃纪反腐相贯通；\n7 坚持以上率下，从领导机关和领导干部严起、抓起，通过抓“关键少数”示范\n带动“绝大多数”；\n8 把党的建设融入党和国家事业发展大局，为推进中国式现代化提供坚强保障；\n——求是网","source":{"doc":"41195a191a57c1c36332","first":9,"last":9,"page":9,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a2e1bd4dbc19ff7e0303386556f135d17511dbb989fd58b8302e713691657001.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"7a3d4d37e3aac5f1","topic":"党政制度与理论","label":"党的建设面临的突出问题","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"5.党的建设面临的突出问题\n在十八届中央政治局常委同中外记者见面时，习近平总书记斩钉截铁地指出“坚持\n党要管党、从严治党，切实解决自身存在的突出问题”，彰显了大党大国领袖深邃的历\n史洞察和鲜明的问题导向。从当时党内实际状况来看，一些长期存在的深层次问题尚未\n根本解决，一些新问题又日益凸显。\n有的地方和部门对坚持党的领导认识模糊、行动乏力，落实党的领导弱化虚化淡\n化、党的建设缺失；\n一些基层党组织软弱涣散，一些党员、干部党性意识不强，政治信仰发生动摇，形\n式主义、官僚主义、享乐主义和奢靡之风盛行，特权思想和特权现象较为严重；\n选人用人风气不正，任人唯亲、跑官要官、买官卖官、拉票贿选现象屡禁不止；\n一些党员、干部法治意识、纪律观念淡薄，自我约束松懈，纪律执行失之于宽、失\n之于松、失之于软；\n贪污受贿、腐化堕落等现象滋生蔓延，一些领导干部特别是高级干部贪腐程度相当\n严重甚至触目惊心；等等。\n这些问题具有极强的危险性和破坏性，严重损害党的形象和威信、侵蚀党的执政根\n基，令党和人民忧心忡忡。\n——共产党员网","source":{"doc":"41195a191a57c1c36332","first":9,"last":10,"page":9,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a2e1bd4dbc19ff7e0303386556f135d17511dbb989fd58b8302e713691657001.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"43a0142f83147a14","topic":"党政制度与理论","label":"党的政治建设","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.党的政治建设\n学习领会习近平党的政治建设思想，要把握三个“要义”。第一，旗帜鲜明讲政治。\n这是马克思主义政党的根本要求。第二，政治建设放首位。政治建设是党的根本性建设，\n决定了党的建设的方向和效果。第三，全党服从中央是首要任务。全党各个组织和全体党\n员服从党的全国代表大会和中央委员会。\n——求是网","source":{"doc":"41195a191a57c1c36332","first":10,"last":11,"page":10,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/451a495d2dd6b15e4d354ee11dc1f113fb7e2a268d93783757c26b0e8e191326.jpg","mentions":["江苏 2025 A类 行测#2","江苏 2025 B类 行测#2","江苏 2025 C类 行测#2"],"groups":[]},{"kind":"knowledge","id":"acd1720cecb17d6e","topic":"党政制度与理论","label":"自我净化、自我完善、自我革新、自我提高","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.自我净化、自我完善、自我革新、自我提高\n（1）自我净化，就是要过滤杂质、清除毒素、割除毒瘤。\n（2）自我完善，就是要修复肌体、健全机制、丰富功能。\n（3）自我革新，就是要与时俱进、自我超越。\n（4）自我提高，就是要有新本领、有新境界，永不僵化、永不停滞。\n——求是网","source":{"doc":"41195a191a57c1c36332","first":11,"last":11,"page":11,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/7dd706927495aece0a4fafc528c051624ba1ac7619724617497702f0e15527c3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"84c20e60e45d939e","topic":"党政制度与理论","label":"政治领导力、思想引领力、群众组织力、社会号召力","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.政治领导力、思想引领力、群众组织力、社会号召力\n（1）党的政治领导力：政治领导力是马克思主义政党第一位的能力，主要体现为对\n党的路线方针政策等重大决策的领导，对国家发展道路、发展阶段、发展布局、国际形势\n等重大判断的领导，对捍卫政治立场、把准政治方向、坚持政治原则以及保持政治定力、\n防范政治风险等方面的领导。\n（2）党的思想引领力：是保证全党全国各族人民思想统一、步调一致的坚实基础，\n主要体现为坚持马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科\n学发展观，全面贯彻习近平新时代中国特色社会主义思想，深入学习贯彻习近平党建思\n想；坚持马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，不断\n开辟马克思主义中国化时代化新境界；坚持用党的创新理论武装全党、教育人民，用马克\n思主义中国化时代化的最新成果引领社会向前发展。\n（3）党的群众组织力：是我们党坚如磐石、坚不可摧的力量根基。主要体现在两个\n方面，一是坚持党的群众路线，一切为了群众、一切依靠群众，从群众中来、到群众中去，\n坚信人民群众是历史的创造者，相信人民群众中蕴藏着无穷的智慧和力量，切实解决人民\n群众急难愁盼问题，不断增强人民群众的获得感、幸福感、安全感。二是党的各级组织和\n党员个人以身作则、率先垂范，处处走在群众的前面，用自身的言行为群众立标杆、作示\n范，以自身的先进性吸引群众、组织群众，巩固深厚的群众基础。\n（4）党的社会号召力：是党的先进性和感召力的重要体现。主要体现为党通过美好\n的愿景来鼓舞社会，以科学的战略安排来引导社会，以健全的组织来动员社会，以可触可\n感的成就来吸引社会，以廉洁亲民的形象来感染社会。\n——中国共产党新闻网","source":{"doc":"41195a191a57c1c36332","first":11,"last":12,"page":11,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/7dd706927495aece0a4fafc528c051624ba1ac7619724617497702f0e15527c3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"47af976e39ce639c","topic":"党政制度与理论","label":"党性","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.党性\n党性是党员、干部立身、立业、立言、立德的基石。习近平总书记强调：“决定一个\n人如何的是品行，决定一名党员如何的是党性。”党性是党的固有本质属性在每一个党员\n身上的体现，是党的理想信念、立场宗旨、纪律作风等要求在每一个党员思想、言论和行\n为上的具体体现。中国共产党人的坚强党性，是我们党保持先进性和纯洁性、提高领导水\n平和执政能力的重要保证。","source":{"doc":"41195a191a57c1c36332","first":13,"last":13,"page":13,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/f5cc47281fdb0d05f35e9bb4c1db9e765409d9102839d434180b452ae44b6593.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"cb655afd8c44625f","topic":"党政制度与理论","label":"坚定理想信念、铸牢对党忠诚、厚植为民情怀、坚持实事求是、纯正道德品质、保持清正廉洁","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.坚定理想信念、铸牢对党忠诚、厚植为民情怀、坚持实事求是、纯正道德品质、保\n持清正廉洁\n坚定理想信念：增强党性，“坚定理想信念”居于首位，要坚定马克思主义信仰，坚\n定共产主义远大理想，坚定中国特色社会主义信念。坚定理想信念，坚守共产党人精神追\n求，始终是共产党人安身立命的根本，始终是每名党员干部增强党性、炼就“金刚不坏之\n身”的关键所在。\n铸牢对党忠诚：“天下至德，莫大于忠”，对党忠诚，是共产党人最重要的政治品质。\n中国共产党一路走来，经历过无数艰险和磨难，没有被任何困难压垮，靠的就是千千万万\n党员的忠诚，忠诚于党的理想信念、忠诚于党的奋斗目标、忠诚于党的伟大事业，铁心跟\n党走，虽九死而不悔，用对党忠诚的气节和行动构筑了不屈的精神脊梁。\n厚植为民情怀：江山就是人民、人民就是江山，打江山、守江山，守的是人民的心。\n厚植为民情怀，是贯穿于我们党的性质宗旨、历史实践和面向未来的必然要求，是党永葆\n生机活力、赢得民心的关键所在。\n坚持实事求是：实事求是，是马克思主义的根本观点，是中国共产党人认识世界、改\n造世界的根本要求，是我们党的基本思想方法、工作方法、领导方法。坚持从实际出发、\n实事求是，不只是思想方法问题，也是党性强不强问题。\n纯正道德品质：涵养高尚的道德品质是我们党对党员干部的一贯要求，只有不断加强\n党性锤炼，明大德、守公德、严私德，其才方能用得其所。\n保持清正廉洁：“廉者，政之本也”。清正廉洁是共产党人的立身之本，更是不能丢\n弃的底色。保持清正廉洁的政治本色是党性修养的重要内容。","source":{"doc":"41195a191a57c1c36332","first":13,"last":14,"page":13,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/f5cc47281fdb0d05f35e9bb4c1db9e765409d9102839d434180b452ae44b6593.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"956d0ec506441030","topic":"党政制度与理论","label":"增强共产党人的党性","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.增强共产党人的党性\n《决定》把“增强共产党人的党性”摆在战略任务部署的第一部分，并且从 5 个方面\n作出了具体部署。一是强化对党忠诚教育。深刻领悟“两个确立”的决定性意义，增强“四\n个意识”、坚定“四个自信”、做到“两个维护”，严明党的政治纪律和政治规矩，净化\n党内政治生态。二是坚持用党的创新理论凝心铸魂。把学习、领悟、运用党的创新理论作\n为加强党性修养的根本途径，深入学习贯彻习近平党建思想，丰富理论学习教育方式，弘\n扬马克思主义学风。三是用党的优良传统和中华优秀传统文化涵养党性。发扬党的优良作\n风，传承红色基因，赓续共产党人精神血脉，挖掘用好中华优秀传统文化中的道德观念。\n四是在实践中锤炼党性。在贯彻落实党中央决策部署、完成急难险重任务、应对重大风浪\n考验中锤炼党性，在处理是和非、公和私、得和失等关系中磨砺党性，发挥党内政治生活\n“大熔炉”作用。五是加强党性鉴别。把党性作为干部考察和党员民主评议的重要内容，\n在干部选拔任用和评优评先中用好党性鉴别结果。","source":{"doc":"41195a191a57c1c36332","first":14,"last":14,"page":14,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/5b4b956d0d50d4a91c35d2c4a3e3b4c46ed8a6676905228b8a1cece586d6ecb0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"3cd0eab6f95914e6","topic":"党政制度与理论","label":"民主集中制","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.民主集中制\n民主集中制就是民主基础上的集中和集中指导下的民主相结合的制度。民主集中制\n包括民主和集中两个方面，两者互为条件、相辅相成、缺一不可。我们党实行的民主集中\n制，是又有集中又有民主、又有纪律又有自由、又有统一意志又有个人心情舒畅生动活泼\n的制度。\n民主集中制是马克思主义建党学说的重要内容。中国共产党从一开始就是按照民主\n集中制原则组织起来的。党的二大首次确认民主集中制的建党原则，党的六大通过的党章\n第一次明确规定党的组织原则是民主集中制。习近平总书记曾指出：民主集中制是我们党\n的根本组织制度和领导制度，是科学的合理的有效率的制度，是我们党最大的制度优势。\n民主集中制的基本原则：第一，坚持“四个服从”（即党员个人服从党的组织，少数\n服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中\n央委员会）；第二，坚持选举产生党的领导机关；第三，坚持集体领导；第四，善于发挥\n下级党组织的积极性；第五，注意尊重少数人意见；第六，禁止个人崇拜。","source":{"doc":"41195a191a57c1c36332","first":14,"last":15,"page":14,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/5b4b956d0d50d4a91c35d2c4a3e3b4c46ed8a6676905228b8a1cece586d6ecb0.jpg","mentions":["国考 2024 副省级 行测#24"],"groups":[]},{"kind":"knowledge","id":"c054b0f36623248e","topic":"党政制度与理论","label":"严格贯彻执行民主集中制","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.严格贯彻执行民主集中制\n《决定》从 4 个方面作出了具体部署。一是坚持和加强党中央集中统一领导。完善党\n中央集中统一领导的体制机制，完善党中央重大决策部署落实机制，严格执行向党中央请\n示报告制度，推进政治监督具体化、精准化、常态化。二是提高党内民主质量。坚持和完\n善党内民主制度，健全党内情况通报制度、情况反映制度，坚持党内民主平等的同志关系。\n三是严格执行领导班子决策议事规则。完善党委（党组）议事规则和决策程序，加强重大\n决策合规合法性审查，健全重大决策、重要人事任免、重大项目安排、大额资金使用事项\n监督机制，也就是常说的“三重一大”监督机制。四是规范“一把手”履职用权。落实加\n强对“一把手”和领导班子监督的制度规定，健全领导班子权力运行制约机制，完善同级\n监督制度机制。","source":{"doc":"41195a191a57c1c36332","first":15,"last":15,"page":15,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/b0bbc172892f939c6f7d7cb627c884d63b9c357301060fb4f5ba9e34d8ebe7a7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"bbe80a7e2a294b5e","topic":"党政制度与理论","label":"全面从严治党关键在从严治吏","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.全面从严治党关键在从严治吏\n2013 年 6 月，习近平总书记在全国组织工作会议上首次强调“党要管党，首先是管\n好干部；从严治党，关键是从严治吏”。 其核心逻辑在于：干部是党的事业的骨干，中\n央战略部署要靠各级领导干部层层落实，因此治党之要，重在治吏。","source":{"doc":"41195a191a57c1c36332","first":15,"last":15,"page":15,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/b0bbc172892f939c6f7d7cb627c884d63b9c357301060fb4f5ba9e34d8ebe7a7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"274da3266b72e0b0","topic":"党政制度与理论","label":"新时代党的组织路线","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.新时代党的组织路线\n组织路线是政党进行组织工作的根本原则和根本方针。新时代党的组织路线是全面\n贯彻习近平新时代中国特色社会主义思想，以组织体系建设为重点，着力培养忠诚干净担\n当的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人\n唯贤，为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。","source":{"doc":"41195a191a57c1c36332","first":15,"last":16,"page":15,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/b0bbc172892f939c6f7d7cb627c884d63b9c357301060fb4f5ba9e34d8ebe7a7.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"83048902814807e7","topic":"党政制度与理论","label":"建设高素质干部队伍","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.建设高素质干部队伍\n《决定》从 6 个方面作出部署：一是坚持正确用人导向。强调坚持党管干部原则，落\n实新时代好干部标准，大力选拔任用对党忠诚、表里如一、担当尽责、实绩突出、清正廉\n洁的干部，坚决不用那些畏难避事、庸懒无为、作风漂浮的人，坚决清除那些对党不忠、\n阳奉阴违、以权谋私的人。二是精准科学选人用人。坚持组织选人、公正用人、以事择人，\n严格执行干部选拔任用原则和程序，坚决整治用人上的不正之风。三是推动干部树立和践\n行正确政绩观。深化政绩观教育，改进推动高质量发展政绩考核，健全有效防范和纠治政\n绩观偏差工作机制，引导干部为人民出政绩、以实干出政绩。四是增强干部干事创业本\n领。加强干部思想淬炼、政治历练、实践锻炼、专业训练，增强推动高质量发展本领、服\n务群众本领、防范化解风险本领、运用法治思维和法治方式开展工作本领。五是提高培养\n选拔优秀年轻干部质量。坚持培养和管理并重，引导年轻干部走健康成长之路。六是加强\n干部管理监督。从高级干部抓起，加强干部全方位管理和经常性监督。","source":{"doc":"41195a191a57c1c36332","first":16,"last":16,"page":16,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a9cd1b60fbdd338b6884138cc38394cc0679e9d2d14ff98bfea0c287a9f65070.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"42eca6d3cff14a84","topic":"党政制度与理论","label":"体系化推进各层级各领域党组织建设。","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.体系化推进各层级各领域党组织建设。\n严密的组织体系，是马克思主义政党的优势所在、力量所在。党的力量来自组织，党\n的全面领导、党的全部工作要靠党的坚强组织体系去实现。我们党历来高度重视组织的统\n一和巩固，伴随着革命、建设、改革的历史进程，建立起包括党的中央组织、地方组织、\n基层组织在内的严密组织体系。\n《决定》从 6 个方面作出部署：一是发挥中央和国家机关党组织表率作用。深化政治\n机关建设，把中央和国家机关建设成为讲政治、守纪律、负责任、有效率的模范机关。二\n是强化地方党委功能。强调地方党委在本地区履行把方向、管大局、作决策、保落实职责，\n把地方党委建设成为坚决听从党中央指挥、执行有力、管理严格、班子团结、风气纯正的\n坚强组织。三是统筹推进各领域基层党组织建设。强化大抓基层鲜明导向，深入推进抓党\n建促乡村全面振兴，加强城市街道、社区党建工作，深化党建引领基层治理和基层政权建\n设。四是突出抓好新兴领域党的建设。深化拓展新经济组织、新社会组织、新就业群体党\n的组织覆盖和工作覆盖，增强党在新兴领域号召力凝聚力影响力。五是加强党员队伍建\n设。坚持把政治标准放在首位，提高发展党员质量，优化党员队伍结构，强化党员教育管\n理，完善和落实党员作用发挥机制。六是完善党的各级组织贯通机制。坚持抓好本级、带\n动下级，层层抓落实，做实党委（党组）书记抓基层党建工作述职评议考核，推动党的各\n级组织全面进步、全面过硬。","source":{"doc":"41195a191a57c1c36332","first":16,"last":17,"page":16,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/a9cd1b60fbdd338b6884138cc38394cc0679e9d2d14ff98bfea0c287a9f65070.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"73010ca4730714f9","topic":"党政制度与理论","label":"党性党风党纪一起抓","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.党性党风党纪一起抓\n党性：是政党固有的本质特征，是党员干部立身、立业、立言、立德的基石，\n是净化党风、严明党纪的内在依据。\n党风：是党在思想、政治、组织、工作、生活等各方面表现出来的态度和行为，\n是党性、党纪的外在体现，关系人心向背，关系党的生死存亡。\n党纪：是管党治党的戒尺，也是党员、干部约束自身行为的标准和遵循。\n党性、党风、党纪是有机整体，党性是根本，党风是表现，党纪是保障。党性、\n党风、党纪的内在一致性，决定了三者必须“一起抓”才能达到治病强身、固本培\n元的整体效果。","source":{"doc":"41195a191a57c1c36332","first":17,"last":17,"page":17,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/bd3bda33cddd87fdd66f6fe6f7f2450858947c578526764cf242ce5550faaa39.jpg","mentions":["政治理论必刷100题#3"],"groups":[]},{"kind":"knowledge","id":"99694140e5b6e631","topic":"党政制度与理论","label":"党的“六大纪律”","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.党的“六大纪律”\n党的纪律主要包括“六大纪律”，即：政治纪律、组织纪律、廉洁纪律、群众\n纪律、工作纪律、生活纪律。严明党的纪律，首要的就是严明政治纪律。政治纪律\n是最重要、最根本、最关键的纪律，遵守党的政治纪律是遵守党的全部纪律的重要\n基础。","source":{"doc":"41195a191a57c1c36332","first":17,"last":18,"page":17,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/bd3bda33cddd87fdd66f6fe6f7f2450858947c578526764cf242ce5550faaa39.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"31dfc159f19dedf2","topic":"党政制度与理论","label":"作风建设","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.作风建设\n党的作风就是党的形象，关系人心向背，关系党的生死存亡。作风问题本质上\n是党性问题，核心是党同人民群众的关系问题。作风问题具有顽固性、反复性，决\n定了作风建设必须常抓不懈。","source":{"doc":"41195a191a57c1c36332","first":18,"last":18,"page":18,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0741f84f7b18ce5bd754e9fee7a542c5c14ecc00112407cb856d3f4c6a7ff1f0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"02a36e66317d2ef6","topic":"党政制度与理论","label":"中国特色反腐败之路","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.中国特色反腐败之路\n《决定》从四个方面对坚定走好中国特色反腐败之路作出部署：一是保持惩治腐败高\n压态势，深化权力集中、资金密集、资源富集领域腐败问题整治，重点查处政治问题和经\n济问题交织、政商勾连、资本向政治领域渗透等问题，深挖细查新型腐败和隐性腐败，常\n态化整治群众身边不正之风和腐败问题；二是加强对权力运行的制约和监督，健全授权用\n权制权相统一、清晰透明可追溯的制度机制，更加科学有效地把权力关进制度笼子；三是\n夯实崇廉拒腐思想根基，加强新时代廉洁文化建设，运用党的创新理论蕴含的理想信念、\n价值理念、道德观念、纪法意识涵养党员、干部清廉操守；四是增强一体推进不敢腐、不\n能腐、不想腐综合效能，抓实以案促改促治，提高反腐败穿透力。","source":{"doc":"41195a191a57c1c36332","first":18,"last":18,"page":18,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0741f84f7b18ce5bd754e9fee7a542c5c14ecc00112407cb856d3f4c6a7ff1f0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5e7483966a872659","topic":"党政制度与理论","label":"不敢腐不能腐不想腐","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.不敢腐不能腐不想腐\n“不敢”是前提，要以严格的执纪执法增强制度刚性，让党员、干部从害怕被查处的\n“不敢”走向敬畏党和人民、敬畏党纪国法的“不敢”;\n“不能”是关键，要科学配置权力，加强重点领域监督机制改革和制度建设，推动\n形成不断完备的制度体系、严格有效的监督体系；\n“不想”是根本，要靠加强理想信念教育、提高党性觉悟、涵养廉洁文化，筑牢拒腐防\n变的思想道德防线，夯实不忘初心、 牢记使命的思想根基。\n一体推进不敢腐、不能腐、不想腐，必须三者同时发力、同向发力、综合发力，把不敢腐\n的强大震慑效能、不能腐的刚性制度约束、不想腐的思想教育优势融于一体。","source":{"doc":"41195a191a57c1c36332","first":18,"last":19,"page":18,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/0741f84f7b18ce5bd754e9fee7a542c5c14ecc00112407cb856d3f4c6a7ff1f0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"6af25dbdd03d5a34","topic":"党政制度与理论","label":"党内法规制度建设是全面从严治党的长远之策、根本之策","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.党内法规制度建设是全面从严治党的长远之策、根本之策\n党内法规制度承载党的意志，制度治党具有刚性约束功能，制度的约束力不仅\n体现为对违规行为的惩戒，也体现为明确行为尺度，使党员干部能够预知行为后果，\n自觉规范权力行使。因此，具有固本长效功能，是巩固党的长期执政根基的重要支\n撑。","source":{"doc":"41195a191a57c1c36332","first":19,"last":19,"page":19,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/ade3a5450c28d0ae6b27f63beb8f45d79fdf0440ef46966fc7dfe4d9b4f3d18e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"97ecf430b27275eb","topic":"党政制度与理论","label":"把党章作为全党的根本行为规范","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.把党章作为全党的根本行为规范\n以党章为根本构建党内法规体系，是制度治党的根本依托。党章是党的根本大\n法，是制定其他党内法规的基础和依据。以党章为根本，意味着各项制度必须遵循\n共同的基本原则，任何党内法规都不得同党章相抵触。","source":{"doc":"41195a191a57c1c36332","first":19,"last":19,"page":19,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/ade3a5450c28d0ae6b27f63beb8f45d79fdf0440ef46966fc7dfe4d9b4f3d18e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"6e5b52c2a070c063","topic":"党政制度与理论","label":"依法治国和依规治党有机统一","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.依法治国和依规治党有机统一\n坚持依法治国和依规治党有机统一是全面依法治国的本质要求和重要保障。依规治\n党是依法治国的引领和保障，依法治国是依规治党的基础和依托。","source":{"doc":"41195a191a57c1c36332","first":19,"last":19,"page":19,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/ade3a5450c28d0ae6b27f63beb8f45d79fdf0440ef46966fc7dfe4d9b4f3d18e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"f678a920d963368a","topic":"党政制度与理论","label":"党和国家监督体系","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.党和国家监督体系\n党的二十大报告鲜明提出要健全“党统一领导、全面覆盖、权威高效”的监督\n体系。具体包括：党内监督、人大监督、民主监督、行政监督、司法监督、审计监\n督、财会监督、统计监督、群众监督、舆论监督等监督。其中，党内监督在党和国\n家监督体系中是最基本的、第一位的，是各类监督发挥作用的方向引领和根本支撑，\n要以党内监督为主导，不断完善权力监督制度和执纪执法体系，推动各类监督贯通\n协调，形成常态长效的监督合力。","source":{"doc":"41195a191a57c1c36332","first":19,"last":20,"page":19,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/ade3a5450c28d0ae6b27f63beb8f45d79fdf0440ef46966fc7dfe4d9b4f3d18e.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"d56b2b6974f5eb31","topic":"党政制度与理论","label":"党内监督体系","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.党内监督体系\n《中国共产党党内监督条例》规定：“建立健全党中央统一领导，党委（党组）\n全面监督，纪律检查机关专责监督，党的工作部门职能监督，党的基层组织日常监\n督，党员民主监督的党内监督体系。\n党中央集中统一领导：党内监督工作由党中央集中统一领导，各级党组织都要服从\n党中央领导。\n党委（党组）全面监督：党委（党组）在党内监督中负主体责任，由书记第一\n负责，统一领导本地区本部门本单位的党内监督工作。\n纪律检查机关专责监督：各级纪委是党内监督的专责机关，履行监督执纪问责\n职责。\n党的工作部门职能监督：党的工作部门是党委（党组）主体责任在不同领域的\n载体和抓手，党委办公厅、组织部、宣传部、统战部、政法委等工作部门，在职责\n范围内承担相应的监督职责。\n党的基层组织日常监督：基层党组织要通过组织生活等，对党员进行日常监督。\n党员民主监督：党员要行使监督权利，对领导干部和党的工作进行监督。","source":{"doc":"41195a191a57c1c36332","first":20,"last":20,"page":20,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/38aa99630d57bbbb63c22942cdef54899c1d92b14fb5daf520be7152fdbd5777.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a478e95546ddcea5","topic":"党政制度与理论","label":"纪检监察工作双重领导体制","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.纪检监察工作双重领导体制\n纪检监察工作双重领导体制是指党的纪律检查机关和国家监察机关在同级党委\n（政府）和上级纪委监委的双重领导下开展工作的制度安排。这一体制是中国特色\n社会主义监督体系的重要组成部分，旨在强化党对反腐败工作的集中统一领导，同\n时保证纪检监察机关行使职权的相对独立性和权威性。","source":{"doc":"41195a191a57c1c36332","first":20,"last":20,"page":20,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/38aa99630d57bbbb63c22942cdef54899c1d92b14fb5daf520be7152fdbd5777.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"5f43ac4a1cb0e794","topic":"党政制度与理论","label":"全面从严治党是全党的共同政治责任","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.全面从严治党是全党的共同政治责任\n习近平总书记强调，管党治党的主体责任、监督责任、第一责任人责任、“一\n岗双责”等构成完整的责任链条，每一种责任都要严格落实。\n主体责任：党委（党组）负主体责任，是管党治党的“牛鼻子”。\n监督责任：纪委是党内监督的专责机关，是管党治党的重要力量，在全面从严治党\n中负监督责任。\n第一责任人责任：全面从严治党第一责任人是各级党委（党组）书记，要做到重要\n工作亲自部署、重大问题亲自过问、重要环节亲自协调、重要案件亲自督办。\n“一岗双责”：领导班子其他成员履行“一岗双责”，即既要抓好分管业务工作，\n也要抓好分管领域的党风廉政建设工作，两个责任一起扛、一起落实。","source":{"doc":"41195a191a57c1c36332","first":21,"last":21,"page":21,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/1de6f1bcd6a6a65a676d040610882bc7928be7bfa37afbb1e4c7df676cc811d0.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"81ecb322a280cd46","topic":"经济指标与宏观调控","label":"稳中求进工作总基调","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.稳中求进工作总基调\n稳中求进工作总基调是我们党治国理政的重要原则，也是做好经济工作的方法论。\n党的十八大以来，习近平总书记围绕坚持稳中求进工作总基调发表一系列重要论述，指出\n“发展是硬道理，稳定也是硬道理，抓发展、抓稳定两手都要硬”，强调“要坚持稳中求\n进、以进促稳、先立后破”。\n习近平总书记强调，“‘稳’的重点要放在稳住经济运行上，确保增长、就业、物价\n不出现大的波动，确保金融不出现区域性系统性风险。‘进’的重点要放在调整经济结构\n和深化改革开放上，确保转变经济发展方式和创新驱动发展取得新成效”。\n“稳”和“进”是辩证统一的关系，“稳”为“进”创造更好的环境和时机，“进”\n为“稳”的动态平衡提供动力支撑。","source":{"doc":"41195a191a57c1c36332","first":21,"last":22,"page":21,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/1de6f1bcd6a6a65a676d040610882bc7928be7bfa37afbb1e4c7df676cc811d0.jpg","mentions":["政治理论必刷100题#48"],"groups":[]},{"kind":"knowledge","id":"9317b72d8b159e70","topic":"党政制度与理论","label":"统筹发展和安全","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.统筹发展和安全\n“坚持统筹发展和安全”，是党的二十届四中全会提出“十五五”时期我国经济社\n会发展必须遵循的六条原则之一，凸显新形势下将安全发展贯穿国家发展各领域、全过程\n的重要性、迫切性。\n发展和安全犹如一体之两翼、驱动之双轮，相辅相成、互为条件，任何时候都不能偏\n废。一方面，发展是解决我国一切问题的基础和关键，不发展是最大的不安全；另一方面，\n安全是发展的前提，没有高水平安全就没有高质量发展。筑牢治国安邦的根基、增强攻坚\n克难的底气，发展是硬道理，安全也是硬道理。","source":{"doc":"41195a191a57c1c36332","first":22,"last":22,"page":22,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/4768e0c95b3d22f7f7cc13f010b605aac6348525f9d55f4d0a9d776f54e0b9c3.jpg","mentions":["政治理论必刷100题#13","国考 2024 副省级 行测#6"],"groups":[]},{"kind":"knowledge","id":"1edd4269071575b8","topic":"就业、社保与公共服务","label":"普惠性、基础性、兜底性民生建设","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"3.普惠性、基础性、兜底性民生建设\n“普惠性、基础性、兜底性民生建设”是当前我国保障和改善民生的核心工作思路，\n强调以人民为中心，解决好群众最关心最直接最现实的利益问题。\n普惠性，强调保障对象的普遍性。习近平总书记强调，中国式现代化是全体人民共同\n富裕的现代化；让广大人民群众共享改革发展成果，是社会主义的本质要求，是社会主义\n制度优越性的集中体现，是我们党坚持全心全意为人民服务根本宗旨的重要体现。\n基础性，强调以人民群众的基本需求为保障内容。涵盖教育、医疗、养老、就业、住\n房等领域。习近平总书记强调，健全基本公共服务体系，提高公共服务水平，增强均衡性\n和可及性；在幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所\n扶上持续用力。\n兜底性，强调政府必须承担民生兜底保障责任。习近平总书记指出，社会政策要托底，\n就是要守住民生底线；对各类困难群众，我们要格外关注、格外关爱、格外关心，时刻把\n他们的安危冷暖放在心上，关心他们的疾苦，千方百计帮助他们排忧解难。","source":{"doc":"41195a191a57c1c36332","first":22,"last":22,"page":22,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/4768e0c95b3d22f7f7cc13f010b605aac6348525f9d55f4d0a9d776f54e0b9c3.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"053a24013e87f6af","topic":"党政制度与理论","label":"基本实现社会主义现代化","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"1.基本实现社会主义现代化\n“基本实现社会主义现代化”是中国到 2035 年要实现的社会主义现代化目标，是全\n面建成社会主义现代化强国的第一阶段战略安排。第一阶段从 2020 年到 2035 年，基本\n实现社会主义现代化；第二阶段从 2035 年到本世纪中叶，建成富强民主文明和谐美丽的\n社会主义现代化强国。","source":{"doc":"41195a191a57c1c36332","first":23,"last":23,"page":23,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/2bf4c19130b09c3f31d682f524aeef88fc788d84398eda2c4bd23cfac50c3f05.jpg","mentions":[],"groups":[]},{"kind":"knowledge","id":"a527cafd4023765d","topic":"党政制度与理论","label":"以中国式现代化全面推进中华民族伟大复兴","basis":"机构注释","paper":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf","text":"2.以中国式现代化全面推进中华民族伟大复兴\n党的二十大报告明确提出，新时代新征程中国共产党的中心任务就是“团结带领全\n国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全\n面推进中华民族伟大复兴”。","source":{"doc":"41195a191a57c1c36332","first":23,"last":23,"page":23,"file":"《中国共产党第二十届中央委员会第五次全体会议公报》解读.pdf"},"thumb":"assets/thumbs/2bf4c19130b09c3f31d682f524aeef88fc788d84398eda2c4bd23cfac50c3f05.jpg","mentions":["国考 2023 副省级 行测#1","国考 2023 行政执法 行测#1"],"groups":[]},{"kind":"skill","id":"e749694b526d0e5e","topic":"资料分析方法","label":"比较同比增速","basis":"据题目与解析整理","paper":"国考 2024 地市级 行测","text":"先圈出同一指标的现期和上年同期。用增长量除以上年同期量，比较各项增长率。只有现期量和增长量时，先相减求出上年同期量。","source":{"doc":"e1792c53900a45f1b9fa","first":38,"last":38,"file":"e1792c53900a45f1b9fa.pdf","page":38},"thumb":"assets/thumbs/db2dfbefb17aac17e58df7963218bdc2f041d01a03b788fb49c6cc7fef54a5d7.jpg","mentions":[],"groups":[{"label":"比较同一年不同指标","questions":["国考 2024 地市级 行测#111","江苏 2024 A类 行测#124"]},{"label":"比较不同年份的同一指标","questions":["国考 2024 地市级 行测#128","江苏 2025 A类 行测#123"]}]},{"kind":"skill","id":"7a985b326fc58141","topic":"资料分析方法","label":"计算现期比重","basis":"据题目与解析整理","paper":"国考 2023 副省级 行测","text":"圈出题目所求的部分和总体，核对时间、单位、统计范围，再用部分量除以总体量。题目列出几个不重叠的部分时，先加总分子。","source":{"doc":"ecade1ff5af69283232e","first":38,"last":38,"file":"ecade1ff5af69283232e.pdf","page":38},"thumb":"assets/thumbs/9883695097e06686ee25a0f7c28dbc1f9534e6b8c3995360ead864674fe5967c.jpg","mentions":[],"groups":[{"label":"汇总多个部分再求占比","questions":["国考 2023 副省级 行测#121","国考 2023 地市级 行测#123"]},{"label":"选对总体并计算占比","questions":["国考 2023 副省级 行测#128","国考 2024 行政执法 行测#129"]}]},{"kind":"skill","id":"9e4ed0684594686f","topic":"数量关系方法","label":"用工作总量相等列工程方程","basis":"据题目与解析整理","paper":"国考 2023 地市级 行测","text":"把施工过程按人员或效率发生变化的时点拆开，算出每段实际工作量。同一工程的几种安排都能用同一个总量表示，据此列方程。","source":{"doc":"f3ab652d8e31c5bbdabc","first":20,"last":20,"file":"f3ab652d8e31c5bbdabc.pdf","page":20},"thumb":"assets/thumbs/cd73affe8c613a163f73e27b2519f0a775153b7ae3f23628940c0d110a617710.jpg","mentions":[],"groups":[{"label":"处理合作时的效率变化","questions":["国考 2023 地市级 行测#64","国考 2024 副省级 行测#72"]},{"label":"按工作日和参与人员分段","questions":["江苏 2024 B类 行测#61","江苏 2023 A类 行测#61"]}]},{"kind":"skill","id":"264ebd474a4792dc","topic":"判断推理方法","label":"用其他解释削弱因果推断","basis":"据题目与解析整理","paper":"江苏 2023 A类 行测","text":"先写出观察到的结果和作者认定的原因。逐项检查是否有另一个因素也能产生该结果，以及材料能否支持这个解释。","source":{"doc":"be17f9afe070cf13a0fb","first":30,"last":31,"file":"be17f9afe070cf13a0fb.pdf","page":30},"thumb":"assets/thumbs/abe8711457eabac86a6f428c4beec23f0dc1ffbcbfc09a839cedc6b16177c243.jpg","mentions":[],"groups":[{"label":"从观察结果中找出其他成因","questions":["江苏 2023 A类 行测#100","国考 2025 行政执法 行测#105"]},{"label":"检查市场现象的其他解释","questions":["国考 2024 行政执法 行测#103","国考 2023 副省级 行测#112"]}]},{"kind":"skill","id":"ddd96a3c875dfde1","topic":"言语理解与表达方法","label":"通过转折定位文段重心","basis":"据题目与解析整理","paper":"国考 2023 地市级 行测","text":"标出转折词，分别概括前后两层意思。再看后文如何论证、解释或提出对策，选择能覆盖作者主张的选项。","source":{"doc":"f3ab652d8e31c5bbdabc","first":15,"last":15,"file":"f3ab652d8e31c5bbdabc.pdf","page":15},"thumb":"assets/thumbs/739907995c65be7d90e07fad1b4f8d429d6c02a97b15ce6039176fe8e7db037d.jpg","mentions":[],"groups":[{"label":"读出转折后的讨论重点","questions":["国考 2023 地市级 行测#46","江苏 2024 A类 行测#23"]},{"label":"顺着转折找到主张或对策","questions":["国考 2023 行政执法 行测#42","国考 2023 行政执法 行测#53"]}]},{"kind":"skill","id":"2dbe8ddc694f3a14","topic":"申论方法","label":"归纳多则材料中的成效","basis":"据题目与解析整理","paper":"江苏 2023 A类 申论","text":"逐则记下谁采取了什么行动、给谁带来了什么变化。合并相同效果，保留各则材料独有的成效，最后按题干要求压缩成一段。","source":{"doc":"e31432d6e63d78de7465","first":1,"last":1,"file":"e31432d6e63d78de7465.pdf","page":1},"thumb":"assets/thumbs/db8401ec2200ef65ae77eccd72063e1e3e326a39889a56090928ce2653bc9d23.jpg","mentions":[],"groups":[{"label":"按地区、部门提取治理成效","questions":["江苏 2023 A类 申论#1","江苏 2024 B类 申论#1"]},{"label":"按事例归纳文旅与产业成效","questions":["江苏 2025 A类 申论#1","江苏 2024 C类 申论#1"]}]},{"kind":"skill","id":"1145b945bfee41b8","topic":"申论方法","label":"按使用对象写工作指南","basis":"据题目与解析整理","paper":"国考 2025 行政执法 申论","text":"先确定谁拿着指南做事。将材料整理为工作事项，每项写清什么时候做、做什么、如何交接或记录，让使用者能逐条照做。","source":{"doc":"d1fc3fe21ef6ae3b1ae6","first":2,"last":2,"file":"d1fc3fe21ef6ae3b1ae6.pdf","page":2},"thumb":"assets/thumbs/62784a2e71931766d59142cad64de582035867d94c50efa3c0ef5271b139964a.jpg","mentions":[],"groups":[{"label":"把现场工作拆成步骤","questions":["国考 2025 行政执法 申论#3","guide-market"]},{"label":"把服务职责写成可执行条目","questions":["guide-delivery","guide-culture"]}]},{"kind":"skill","id":"6d2b92b322742d49","topic":"申论方法","label":"按发文身份写倡议书","basis":"据题目与解析整理","paper":"江苏 2024 B类 申论","text":"先写明谁在向谁发出倡议。用材料中的事实讲清缘由，再写收件人力所能及的行动，收尾时核对号召、称谓和落款。","source":{"doc":"f75bd8f3e117a96a77ba","first":2,"last":2,"file":"f75bd8f3e117a96a77ba.pdf","page":2},"thumb":"assets/thumbs/688fc62b14f6e27ba934eaece5725c28f503ef3aeaaa26035aadfd7c2a9f82ad.jpg","mentions":[],"groups":[{"label":"向特定行业和群体发出倡议","questions":["江苏 2024 B类 申论#3","appeal-reading"]},{"label":"把参与者的顾虑写进行动号召","questions":["appeal-village","appeal-market"]}]}],"practice":{"国考 2024 地市级 行测#111":{"label":"国考 2024 地市级 行测 · 第 111 题","origin":"真题","paper":"国考 2024 地市级 行测","stem":"111. 将S省各级12315工作机构接收的投诉、举报和咨询三类诉求量按2022年同比增速从高到低排序，以下正确的\n是：\n","options":[["A","投诉量、举报量、咨询量"],["B","咨询量、投诉量、举报量"],["C","举报量、咨询量、投诉量"],["D","举报量、投诉量、咨询量"]],"key":"D","source":{"doc":"92d0b72e86a6a33d568d","first":23,"last":23,"file":"92d0b72e86a6a33d568d.pdf","page":23},"materials":[{"label":"题组2","text":"（一）\n\n      2022年，S省各级12315工作机构共接收诉求220.4万件，同比增长21.41%。其中，投诉55.6万件、举报26.3万\n件、咨询138.5万件，比上一年分别增加14.0万件、8.9万件、16.0万件。","source":{"doc":"92d0b72e86a6a33d568d","first":22,"last":22,"file":"92d0b72e86a6a33d568d.pdf","page":22}}],"answer":{"text":"111. 正确答案：D\n解析：\n根据题干“······按2022年同比增速从高到低排序······”，可判定本题为一般增长率比较问题。定位文字材料可知：\n2022年S省各级12315工作机构接收的诉求中：投诉55.6万件、举报26.3万件、咨询138.5万件，比上一年分别增加\n14.0万件、8.9万件、16.0万件。根据公式：增长率                  ，则2022年三类诉求量的同比增速分别为：\n\n投诉量                     ；举报量                     ；咨询量\n\n                     。故同比增速从高到低排序为：举报量、投诉量、咨询量。\n\n故正确答案为D。\n【考点】\n综合资料,一般增长率","source":{"doc":"e1792c53900a45f1b9fa","first":38,"last":38,"file":"e1792c53900a45f1b9fa.pdf","page":38}}},"江苏 2024 A类 行测#124":{"label":"江苏 2024 A类 行测 · 第 124 题","origin":"真题","paper":"江苏 2024 A类 行测","stem":"124. 2023年上半年，该市地区生产总值、社会消费品零售总额、实际利用外资、工业用电量四个指标中同比增速最\n快的是：\n","options":[["A","地区生产总值"],["B","社会消费品零售总额"],["C","实际利用外资"],["D","工业用电量"]],"key":"C","source":{"doc":"f8fec75f67d6d1ba5759","first":25,"last":25,"file":"f8fec75f67d6d1ba5759.pdf","page":25},"materials":[{"label":"题组5","text":"（二）","sourc
