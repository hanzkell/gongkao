<script>
const mount='/gongkao/',path=location.pathname.slice(mount.length).replace(/^read\//,'');
if(/^(pdfs|docs|exports)\//.test(path)){
 location.replace(mount+'download.html?file='+encodeURIComponent(decodeURIComponent(path))+location.hash);
}else if(['','index.html','search.html','non-current.html'].includes(path)){
 location.replace(mount+path+location.search+location.hash);
}
</script></head><body><a href="/gongkao/">打开学习目录</a></body></html>
